<style id="adminPolish">
/* 관리자 화면 정리용 디자인 - 기능/동작은 변경하지 않음 */
.admin{
  min-height:calc(100vh - 72px);
  background:#f3f6fa;
  display:grid;
  grid-template-columns:150px 1fr;
}
.side{
  background:#071b45;
  padding:22px 10px;
  position:sticky;
  top:0;
  height:calc(100vh - 72px);
  box-sizing:border-box;
}
.side h2{
  font-size:15px;
  margin:0 0 16px;
  padding:8px 10px;
  color:#fff;
}
.nav{

  border-radius:8px;
  font-size:14px;
  transition:.15s;
}
.nav.on{background:#1466e8}
.nav:hover{background:#123b7f}
.main{
  padding:20px 22px 35px;
  max-width:1700px;
  width:100%;
  box-sizing:border-box;
}
.panel{
  background:#fff;
  border:1px solid #dbe3ee;
  border-radius:12px;
  margin-bottom:14px;
  padding:18px;
  box-shadow:0 2px 8px rgba(18,38,70,.05);
}
.panel h2{
  font-size:20px;
  margin:0 0 5px;
  color:#10244b;
}
.hint{color:#718096;font-size:12px}
.lockGrid,.controlRow,.grid{
  gap:10px;
}
.lockCard{
  border:1px solid #dce4ee;
  border-radius:10px;
  background:#fbfcfe;
  padding:14px;
  box-shadow:none;
}
.lockCard h3{
  font-size:17px;
  margin:0 0 8px;
}
.lockCard p{
  color:#64748b;
  margin:5px 0 12px;
  font-size:12px;
}
.lockCard button{
  width:100%;
  min-height:38px;
  border-radius:7px;
  font-weight:900;
}
.controlBox{
  background:#fbfcfe;
  border:1px solid #dce4ee;
  border-radius:10px;
  padding:16px;
}
.controlBox h3{
  margin:0 0 12px;
  font-size:16px;
}
.stepper{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}
.stepper button{
  width:38px;
  height:36px;
  border-radius:7px;
  font-size:18px;
  font-weight:900;
}

  text-align:center;
  font-size:21px;
}
.adminSave{
  margin-top:13px;
  min-width:130px;
}
.adminTable .grid{
  align-items:stretch;
}

  border-radius:10px;
  padding:13px;

  font-size:16px;

  padding-bottom:9px;
  margin-bottom:8px;
  border-bottom:1px solid #e6ebf2;
}

  margin:7px 0;
  font-size:12px;
  line-height:1.5;

  border-radius:7px;
  padding:8px;
  font-weight:800;
}

  float:right;

  border:0;
  border-radius:6px;
  padding:6px 9px;

.adminTable .smallbtn:hover{background:#c62828}
.adminTop a{
  background:#1466e8;
  border-radius:7px;
  padding:9px 15px;
  font-weight:900;
}

async function advance(s,doSave=true){
  s.finished=s.finished||{};

  for(const c of s.courts){

      s.finished[a.ticket]={...a,endedAt:Date.now()};
      c.active=null; ch=true;

async function reg(){
  const btn=document.getElementById("regBtn"), ee=document.getElementById("e");
  const nn=document.getElementById("n").value.trim();
  const gg=document.getElementById("g").value;
  const id=Number(document.getElementById("c").value);
  const deviceId=getDeviceToken();

  const err=(msg)=>{

  if(!nn||!gg||!id){err("닉네임, 게임 방식, 코트를 모두 선택해주세요.");return}

  /* 같은 스마트폰의 5분 재등록 제한 */
  const cooldown=getCooldownUntil();
  if(cooldown>Date.now()){
    err("⚠️ 이미 등록했습니다. "+cooldownMessage(cooldown));
    return;
  }

  btn.disabled=true; btn.style.opacity=".65"; ee.style.display="none";

  try{
    let s=await get();
    if(!s || !Array.isArray(s.courts)) s=cloneDef();

    s.max_per_court=Math.max(1,Math.min(20,Number(s.max_per_court||5)));
    s.re_register_minutes=Math.max(1,Math.min(20,Number(s.re_register_minutes||5)));
    s.finished=s.finished||{};

    /* 서버에 저장된 익명 기기 토큰으로 모든 코트의 중복 대기/이용 여부 검사 */

}

        <p>이용 시간이 종료되었습니다.<br>다음 고객을 위해<br>퇴장 버튼을 눌러주세요.</p>
        <div class="notice">퇴장을 눌러야<br>다시 이용 가능합니다.</div>
        <button class="btn" onclick="finish()">퇴장하기</button>
      </div>
      <div style="font-size:10px;color:#777;text-align:center;margin-top:8px">
        ※ 퇴장 버튼을 눌러야 다음 대기자가 이용을 시작합니다.
      </div>`;
    return;
  }

  /* 현재 이용 중 */
  if(a){
    const remain=left(a.endAt);
    w.innerHTML=`
      <div style="font-size:11px;color:#1565ff;font-weight:800;text-align:center;margin-bottom:8px">
        ● 15분 경과 후 퇴장 (자동 안내)
      </div>
      <div class="doneScreen" style="background:#061b4f;text-align:left">
        <div style="text-align:center;font-size:12px;font-weight:800;margin-bottom:12px">고객용 QR 스마트등록</div>
        <div class="row"><span style="color:#fff">닉네임</span><b style="color:#fff">${esc(a.nickname)}</b></div>
        <div class="row"><span style="color:#fff">선택 코트</span><b style="color:#fff">${a.court}번 코트</b></div>
        <div class="row"><span style="color:#fff">이용 시간</span><b style="color:#fff">${tm(a.startAt)} ~ ${tm(a.endAt)}</b></div>
        <div class="my">
          <small>현재 이용 중</small>
          <strong>${esc(a.nickname)}</strong>
          <small>남은 시간</small>
        </div>
        <div class="timer" style="color:#fff">${remain}</div>
        <button class="btn cancel" onclick="leave()">퇴장하기</button>
      </div>`;
    return;
  }

  /* 2번째 화면: 대기 중 */
  if(q){
    const arr=c.queue||[];
    const pos=arr.findIndex(x=>x.ticket===ticket)+1;
    const duration=Number(s.settings[q.game]||15);
    let activeRemain=0;
    if(c.active && c.active.endAt){
      activeRemain=Math.max(0,Math.ceil((Number(c.active.endAt)-Date.now())/60000));
    }
    const expected=Math.max(0,activeRemain+(pos-1)*duration);
    const now=new Date();
    const eta=new Date(Date.now()+expected*60000);

    w.innerHTML=`
      <div style="font-size:11px;color:#1565ff;font-weight:800;text-align:center;margin-bottom:8px">
        ● 개선 화면 (해당 코트만 간결하게)
      </div>
      <div class="doneScreen" style="padding:12px 14px;background:#061b4f;text-align:left">
        <div style="text-align:center;font-size:13px;font-weight:900;margin-bottom:10px">고객용 QR 스마트등록</div>
        <div style="text-align:center;font-size:10px;margin-bottom:12px">간편하게 코트 대기를 확인하세요.</div>

        <div style="background:#fff;color:#071633;border-radius:12px;padding:12px">
          <div style="font-size:13px;font-weight:900;margin-bottom:8px">내 대기 정보</div>
          <div class="row"><span>닉네임</span><b>${esc(q.nickname)}</b></div>
          <div class="row"><span>선택 코트</span><b>${q.court}번 코트</b></div>
          <div class="row"><span>이용 시간</span><b>${duration}분</b></div>

          <div class="my" style="margin-top:12px">
            <small>나의 순번</small>
            <strong>${pos}번</strong>
            <small>(현재 대기 중)</small>
          </div>

          <div style="display:flex;justify-content:space-between;font-size:11px;margin:10px 2px 4px">
            <span>착 ${now.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}</span>
            <span>종료 ${eta.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}</span>
          </div>

          <div style="text-align:center;font-size:11px;color:#333">남은 시간</div>
          <div class="timer" style="color:#07854b">${String(expected).padStart(2,"0")}:00</div>

          <div class="qbox">
            <div class="qtitle">${c.id}번 코트 대기 현황 (총 ${arr.length}팀)</div>
            <div class="qrow" style="font-weight:800"><span>순번</span><span>닉네임</span><span>예상 대기 시간</span></div>
            ${arr.map((x,i)=>{
              const wait=Math.max(0,activeRemain+i*duration);
              return `<div class="qrow"><b>${i+1}</b><span>${esc(x.nickname)}${x.ticket===ticket?' <b>(나)</b>':''}</span><span>약 ${wait}분 후 입장</span></div>`;
            }).join("")}
          </div>

          <button class="btn cancel" onclick="cancelWait()">예약 대기 취소</button>
        </div>
      </div>`;
    return;
  }

  w.innerHTML='대기 등록 정보가 없습니다.';
}
async function cancelWait(){
  try{let s=await get();for(const c of s.courts)c.queue=(c.queue||[]).filter(x=>x.ticket!==ticket);await save(s);location.href="?page=register"}catch(e){showError(e)}
}
async function leave(){
  try{let s=await get();for(const c of s.courts)if(c.active?.ticket===ticket){s.finished=s.finished||{};s.finished[ticket]={...c.active,endedAt:Date.now()};c.active=null}await advance(s);await save(s)}catch(e){showError(e)}
}
async function finish(){
  try{let s=await get();if(s.finished)delete s.finished[ticket];await save(s);location.href="?page=register"}catch(e){showError(e)}
}

function setupAdminNav(){
  document.querySelectorAll('.side .nav').forEach(a=>a.addEventListener('click',()=>{
    document.querySelectorAll('.side .nav').forEach(x=>x.classList.remove('on'));
    a.classList.add('on');
  }));
}

function admin(){
  const app=document.getElementById("app");
  app.innerHTML=`<header class="header"><div><div class="brand">장군봉 통합관리</div><div class="sub">통합관리 시스템</div></div><div class="adminTop"><a href="?page=customer">고객 화면으로</a></div></header><div class="admin"><div id="viewSwitch" class="view-switch" aria-label="관리자 화면 전환">
  <button id="switchCustomer" type="button" onclick="switchManagementView('display')">고객용</button>
  <button id="switchAdmin" class="secondary" type="button" onclick="switchManagementView('admin')">관리자 모드</button>
</div>
<aside class="side"><h2>관리자 모드</h2><a class="nav on" href="#courtManage">코트 관리</a><a class="nav" href="#gameTime">게임 시간 설정</a><a class="nav" href="#waitMax">대기 정원 설정</a><a class="nav" href="#reRegister">재등록 제한 설정</a></aside><main class="main"><section class="panel" id="courtManage"><div class="adminSectionTitle"><div><h2>코트 관리</h2><div class="hint">사용하지 않을 코트는 잠금할 수 있습니다.</div></div></div><div class="lockGrid" id="cs"></div></section><section class="panel" id="gameTime"><div class="adminSectionTitle"><div><h2>게임 시간 설정</h2><div class="hint">기본 15분 · 1분씩 조절 · 최대 20분</div></div></div><div class="controlRow"><div class="controlBox"><h3>4인 복식</h3><div class="stepper"><button onclick="changeTime('4인 복식',-1)">−</button><strong id="g2">15</strong><span>분</span><button onclick="changeTime('4인 복식',1)">+</button></div></div><div class="controlBox"><h3>2인 단식</h3><div class="stepper"><button onclick="changeTime('2인 단식',-1)">−</button><strong id="g3">15</strong><span>분</span><button onclick="changeTime('2인 단식',1)">+</button></div></div><div class="controlBox"><h3>난타</h3><div class="stepper"><button onclick="changeTime('난타',-1)">−</button><strong id="g1">15</strong><span>분</span><button onclick="changeTime('난타',1)">+</button></div></div></div></section><section class="panel" id="waitMax"><div class="adminSectionTitle"><div><h2>대기 정원 설정</h2><div class="hint">전체 코트에 동일하게 적용됩니다.</div></div></div><div class="controlRow"><div class="controlBox"><h3>대기자 최대 정원</h3><div class="hint" style="margin-bottom:10px">전체 코트 동일 적용 · 1명~20명</div><div class="stepper"><button onclick="changeMax(-1)">−</button><strong id="mx">5</strong><span>명</span><button onclick="changeMax(1)">+</button></div></div></div><button class="save adminSave" onclick="saveAdmin()">변경사항 저장</button></section><section class="panel cooldownPanel" id="reRegister"><div class="cooldownInner"><div><div class="cooldownTitle">재등록 제한 시간 설정 (대기 후 다시 예약 가능 시간)</div><div class="cooldownHint">게임 종료 후 다시 예약할 수 있는 시간을 1분~20분으로 조절합니다.</div><div class="cooldownBox"><div class="stepper"><button onclick="changeCooldown(-1)">−</button><strong id="rc">5</strong><span>분</span><button onclick="changeCooldown(1)">+</button></div></div><button class="save adminSave" onclick="saveAdmin()">변경사항 저장</button></div><div class="cooldownInfo"><b>ⓘ 안내</b><br>• 설정한 시간이 지나야 같은 스마트폰에서 다시 예약할 수 있습니다.<br>• 예) <b>6분</b>으로 설정하면 게임 종료 후 6분이 지나야 재등록 가능합니다.<br>• 고객용 화면의 안내 문구도 설정값에 맞춰 자동으로 표시됩니다.</div></div></section><section class="panel adminTable"><h2>현재 대기 현황</h2><div class="grid" id="qq"></div></section></main></div>`;
  renderAdmin(cloneDef()); sub(renderAdmin);
}
function renderAdmin(s){
  const g1=document.getElementById("g1"),g2=document.getElementById("g2"),g3=document.getElementById("g3"),mx=document.getElementById("mx"),rc=document.getElementById("rc"),cs=document.getElementById("cs"),qq=document.getElementById("qq");
  if(!g1||!g2||!g3||!mx||!rc||!cs||!qq)return;
  g1.textContent=s.settings["난타"];g2.textContent=s.settings["4인 복식"];g3.textContent=s.settings["2인 단식"];mx.textContent=s.max_per_court;rc.textContent=Number(s.re_register_minutes||5);
  cs.innerHTML=s.courts.map(c=>'<div class="lockCard"><h3>'+c.id+'번 코트</h3><p>'+(c.blocked?'현재 잠금':'현재 사용 가능')+'</p><button class="'+(c.blocked?'locked':'open')+'" onclick="block('+c.id+','+(!c.blocked)+')">'+(c.blocked?'잠금 해제':'코트 잠금')+'</button></div>').join('');
  qq.innerHTML=s.courts.map(c=>'<div class="card"><h3>'+c.id+'번 코트</h3>'+(c.active?'<p>이용 중: '+esc(c.active.nickname)+' <button class="smallbtn" onclick="force('+c.id+')">강제 퇴장</button></p>':'<p>이용 중 없음</p>')+(c.queue||[]).map((x,i)=>'<p>'+String(i+1)+'. '+esc(x.nickname)+' / '+esc(x.game)+'</p>').join('')+'</div>').join('');
}
async function changeTime(game,delta){
  const el=game==="난타"?document.getElementById("g1"):game==="4인 복식"?document.getElementById("g2"):document.getElementById("g3");
  if(!el)return;
  const v=Math.max(1,Math.min(20,Number(el.textContent||15)+delta));
  el.textContent=v;
  try{
    const s=await get();
    s.settings=s.settings||{"난타":15,"4인 복식":15,"2인 단식":15};
    s.settings[game]=v;
    await save(s);
  }catch(e){showError(e)}
}
function changeMax(delta){
  const el=document.getElementById("mx"); if(!el)return;
  el.textContent=Math.max(1,Math.min(20,Number(el.textContent||5)+delta));
}
function changeCooldown(delta){
  const el=document.getElementById("rc"); if(!el)return;
  el.textContent=Math.max(1,Math.min(20,Number(el.textContent||5)+delta));
}
async function saveAdmin(){
  try{
    let s=await get();
    const reRegisterMinutes=Math.max(1,Math.min(20,Number(document.getElementById("rc").textContent||5)));
    s.settings=s.settings||{"난타":15,"4인 복식":15,"2인 단식":15};
    s.settings["난타"]=Math.max(1,Math.min(20,Number(document.getElementById("g1").textContent||15)));
    s.settings["4인 복식"]=Math.max(1,Math.min(20,Number(document.getElementById("g2").textContent||15)));
    s.settings["2인 단식"]=Math.max(1,Math.min(20,Number(document.getElementById("g3").textContent||15)));
    s.max_per_court=Math.max(1,Math.min(20,Number(document.getElementById("mx").textContent||5)));
    s.re_register_minutes=reRegisterMinutes;

    // 게임시간/정원과 함께 재등록 제한시간도 waiting_state에 확실히 저장
    await save(s);

    // 저장 직후 DB에서 다시 읽어 화면을 갱신하여 5분으로 되돌아가는 현상 방지
    const saved=await get();
    renderAdmin(saved);
    alert("변경사항이 저장되었습니다. 재등록 제한시간: "+(Number(saved.re_register_minutes)||5)+"분");
  }catch(e){showError(e)}
}
async function block(id,b){
  try{
    let s=await get();
    s.courts.find(c=>c.id===id).blocked=b;
    await save(s);
  }catch(e){showError(e)}
}
async function force(id){
  try{
    let s=await get(),c=s.courts.find(c=>c.id===id);
    if(c.active){s.finished=s.finished||{};s.finished[c.active.ticket]={...c.active,endedAt:Date.now()};c.active=null}
    await advance(s); await save(s);
  }catch(e){showError(e)}
}


function management(){
  const view=params.get("view")||"display";
  if(view==="admin"){
    admin();
    const top=document.querySelector('.adminTop');
    if(top){
      const links=top.querySelectorAll('a');
      if(links[0]){links[0].href='?page=management&view=display';links[0].textContent='고객용';}
      if(links[1]){links[1].href='?page=register';links[1].textContent='QR 등록';}
    }
  }else{
    customer();
    const top=document.querySelector('.header > div:last-child');
    if(top){
      const a=top.querySelector('a.customerBtn');
      if(a){a.href='?page=management&view=admin';a.textContent='관리자';}
    }
  }
}

(function(){
  const r=route();
  if(r==="management")management();
  else if(r==="admin")admin();
  else if(r==="register")register();
  else if(r==="waiting")waiting();
  else customer();
  ensure().catch(e=>console.error(e));
})();
</script>
<script>
(function(){
  window.switchManagementView=function(view){
    const display=document.getElementById("manageDisplay");
    const admin=document.getElementById("manageAdmin");
    if(!display||!admin)return;
    const customer=document.getElementById("switchCustomer");
    const adminBtn=document.getElementById("switchAdmin");
    if(view==="admin"){
      display.style.display="none";
      admin.style.display="block";
      if(customer)customer.style.display="inline-flex";
      if(adminBtn)adminBtn.style.display="none";
    }else{
      display.style.display="block";
      admin.style.display="none";
      if(customer)customer.style.display="none";
      if(adminBtn)adminBtn.style.display="inline-flex";
    }
  };

  function initManagementView(){
    const mp=document.getElementById("managementPage");
    if(!mp)return;
    const params=new URLSearchParams(location.search);
    const view=params.get("view")||"display";
    switchManagementView(view==="admin"?"admin":"display");
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",initManagementView);
  }else{
    initManagementView();
  }
})();
</script>
