<script>
/* Supabase 설정: 아래 2개만 본인 프로젝트 값으로 교체 */
const SUPABASE_URL="https://jvurwckjumnzzecazgku.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_ATg2EbcVch2360kEit3w4g_IcHAWHIL";

<script>
const SB_HEADERS={"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY,"Content-Type":"application/json"};
async function sbGet(){
  const url=SUPABASE_URL+"/rest/v1/waiting_state?id=eq.waiting_state&select=*";
  const r=await fetch(url,{
    method:"GET",
    headers:{
      "apikey":SUPABASE_ANON_KEY,
      "Authorization":"Bearer "+SUPABASE_ANON_KEY,
      "Accept":"application/json"
    },
    cache:"no-store"
  });
  const text=await r.text();
  if(!r.ok) throw new Error("조회 오류 "+r.status+" : "+text);
  const rows=text?JSON.parse(text):[];
  return rows[0]||null;
}
async function sbUpsert(row){
  const payload={
    settings:row.settings||{"난타":15,"4인 복식":15,"2인 단식":15},
    max_per_court:Number(row.max_per_court||5),
    finished:row.finished||{},
    courts:Array.isArray(row.courts)?row.courts:[]
  };
  const url=SUPABASE_URL+"/rest/v1/waiting_state?id=eq.waiting_state";
  const r=await fetch(url,{
    method:"PATCH",
    headers:{
      "apikey":SUPABASE_ANON_KEY,
      "Authorization":"Bearer "+SUPABASE_ANON_KEY,
      "Content-Type":"application/json",
      "Accept":"application/json",
      "Prefer":"return=representation"
    },
    body:JSON.stringify(payload)
  });
  const text=await r.text();
  if(!r.ok) throw new Error("저장 오류 "+r.status+" : "+text);
  const rows=text?JSON.parse(text):[];
  if(!Array.isArray(rows)||rows.length===0)
    throw new Error("저장 오류 : waiting_state가 수정되지 않았습니다.");
  return true;
}const ROOT="waiting_state";
const params=new URLSearchParams(location.search);
const REGISTER_URL=location.origin+location.pathname+"?page=register";
const ticket=params.get("ticket")||"";
const colors=["#07854b","#1461e8","#6332d7","#ff7900","#e51e2a"];
let mobileCourt=1;
const def={id:ROOT,settings:{"난타":15,"4인 복식":15,"2인 단식":15},max_per_court:5,finished:{},courts:[1,2,3,4,5].map(id=>({id,blocked:false,active:null,queue:[]}))};

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function tm(t){return new Date(t).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}
function left(t){let n=Math.max(0,Math.ceil((t-Date.now())/1000));return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")}
function cloneDef(){return JSON.parse(JSON.stringify(def))}
function showError(err){
  const msg=err?.message||String(err||"알 수 없는 오류");
  console.error("Supabase error:",err);
  const box=document.getElementById("app");
  if(box && !box.innerHTML.includes("장군봉 배드민턴")) {
    box.innerHTML='<div style="max-width:720px;margin:60px auto;padding:28px;font-family:Arial;text-align:center"><h2>장군봉 배드민턴 스마트 대기</h2><p>데이터 연결을 준비하는 중입니다.</p><small>'+esc(msg)+'</small></div>';
  }
}
async function get(){
  const data=await sbGet();
  return data?data:cloneDef();
}
async function save(s){
  await sbUpsert({
    id:ROOT,
    settings:s.settings,
    max_per_court:s.max_per_court,
    finished:s.finished||{},
    courts:s.courts
  });
}
async function ensure(){
  const data=await sbGet();
  if(!data) await save(cloneDef());
}
async function advance(s,doSave=true){
  s.finished=s.finished||{};
  let ch=false;
  for(const c of s.courts){
    if(c.active && Date.now()>=Number(c.active.endAt)){
      const a=c.active;
      s.finished[a.ticket]={...a,endedAt:Date.now()};
      c.active=null; ch=true;
    }
    if(!c.active && !c.blocked && (c.queue||[]).length){
      const x=c.queue.shift();
      const m=Number(s.settings[x.game]||15);
      const st=Date.now();
      c.active={...x,startAt:st,endAt:st+m*60000};
      ch=true;
    }
  }
  if(ch && doSave) await save(s);
  return s;
}
let liveTimer=null;
function sub(fn){
  if(liveTimer) clearInterval(liveTimer);
  const refresh=async()=>{try{fn(await advance(await get()))}catch(e){showError(e)}};
  refresh();
  liveTimer=setInterval(refresh,2000);
}

/* GitHub Pages compatible routing:
   /?page=register
   /?page=admin
   /?page=waiting&ticket=...
   Existing /register, /admin, /waiting paths are also supported. */
function route(){
  const path=location.pathname.replace(/\/+$/,"");
  const page=params.get("page")||"";
  if(page==="management") return "management";
  if(path==="/admin" || path.endsWith("/admin") || page==="admin") return "admin";
  if(path==="/register" || path.endsWith("/register") || page==="register") return "register";
  if(path==="/waiting" || path.endsWith("/waiting") || page==="waiting" || ticket) return "waiting";
  if(page==="display") return "display";
  return "register";
}

async function reg(){
  const btn=document.getElementById("regBtn"), ee=document.getElementById("e");
  const nn=document.getElementById("n").value.trim();
  const gg=document.getElementById("g").value;
  const id=Number(document.getElementById("c").value);

  const err=(msg)=>{
    ee.style.display="block";
    ee.textContent=msg;
    btn.disabled=false; btn.style.opacity="1";
  };

  if(!nn||!gg||!id){err("닉네임, 게임 방식, 코트를 모두 선택해주세요.");return}
  btn.disabled=true; btn.style.opacity=".65"; ee.style.display="none";

  try{
    let s=await get();
    if(!s || !Array.isArray(s.courts)){
      s=cloneDef();
    }
    s.settings=s.settings||{"난타":15,"4인 복식":15,"2인 단식":15};
    s.max_per_court=Number(s.max_per_court||5);
    s.finished=s.finished||{};
    const x=s.courts.find(v=>Number(v.id)===id);

    if(!x){err("선택한 코트를 찾을 수 없습니다.");return}
    if(x.blocked){err("현재 이용할 수 없는 코트입니다. 다른 코트를 선택해주세요.");return}

    x.queue=Array.isArray(x.queue)?x.queue:[];
    const total=x.queue.length+(x.active?1:0);
    if(total>=s.max_per_court){err("선택한 코트의 대기가 마감되었습니다.");return}

    let t=(crypto&&crypto.randomUUID)?crypto.randomUUID():("T"+Date.now()+Math.random().toString(36).slice(2));
    x.queue.push({ticket:t,nickname:nn,game:gg,court:id,createdAt:Date.now()});

    // Normalize and start the first waiting customer if the court is empty.
    await advance(s,false);
    await save(s);

    location.replace(location.pathname+"?page=waiting&ticket="+encodeURIComponent(t));
  }catch(e){
    console.error(e);
    const msg=String(e?.message||e);
    err(msg);
  }
}

function fmtDuration(ms){
  const sec=Math.max(0,Math.ceil(ms/1000));
  const m=Math.floor(sec/60);
  const s=sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function startWaitRing(totalSeconds, targetTime){
  const total=Math.max(1,Number(totalSeconds)||1);
  const target=Number(targetTime)||Date.now()+total*1000;
  function tick(){
    const remain=Math.max(0,(target-Date.now())/1000);
    const mm=Math.floor(remain/60);
    const ss=Math.floor(remain%60);
    const text=document.getElementById("waitRemain");
    const ring=document.getElementById("waitRing");
    if(text) text.textContent=String(mm).padStart(2,"0")+":"+String(ss).padStart(2,"0");
    if(ring){
      const pct=Math.max(0,Math.min(1,remain/total));
      ring.style.background="conic-gradient(#08a05c "+(pct*360)+"deg,#dcefe5 0deg)";
    }
    if(remain>0) requestAnimationFrame(tick);
  }
  tick();
}

async function finish(){

  app.innerHTML=`<header class="header"><div><div class="brand">장군봉 배드민턴 관리자</div><div class="sub">스마트 대기 관리 시스템</div></div><div class="adminTop"><a href="?page=register">고객 등록 화면</a><a href="?page=display">고객대기 화면</a></div></header><div class="admin"><aside class="side"><h2>관리자 모드</h2><div class="nav on">코트 관리</div><div class="nav">게임 시간 설정</div><div class="nav">대기 정원 설정</div></aside><main class="main"><section class="panel"><div class="adminSectionTitle"><div><h2>코트 관리</h2><div class="hint">사용하지 않을 코트는 잠금할 수 있습니다.</div></div></div><div class="lockGrid" id="cs"></div></section><section class="panel"><div class="adminSectionTitle"><div><h2>게임 시간 설정</h2><div class="hint">기본 15분 · 1분씩 조절 · 최대 20분 · 변경 즉시 고객 화면에 적용</div></div></div><div class="controlRow"><div class="controlBox"><h3>4인 복식</h3><div class="stepper"><button onclick="changeTime('4인 복식',-1)">−</button><strong id="g2">15</strong><span>분</span><button onclick="changeTime('4인 복식',1)">+</button></div></div><div class="controlBox"><h3>2인 단식</h3><div class="stepper"><button onclick="changeTime('2인 단식',-1)">−</button><strong id="g3">15</strong><span>분</span><button onclick="changeTime('2인 단식',1)">+</button></div></div><div class="controlBox"><h3>난타</h3><div class="stepper"><button onclick="changeTime('난타',-1)">−</button><strong id="g1">15</strong><span>분</span><button onclick="changeTime('난타',1)">+</button></div></div><div style="font-size:12px;color:#07854b;font-weight:800;margin-top:10px">✓ 저장 버튼을 누르지 않아도 + / − 변경 즉시 고객 등록 화면에 적용됩니다.</div></div></section><section class="panel"><div class="adminSectionTitle"><div><h2>대기자 최대 정원</h2><div class="hint">전체 코트에 동일하게 적용 · 4명~20명</div></div></div><div class="controlBox"><div class="stepper"><button onclick="changeMax(-1)">−</button><strong id="mx">5</strong><span>명</span><button onclick="changeMax(1)">+</button></div></div><button class="save adminSave" onclick="saveAdmin()">변경사항 저장</button></section><section class="panel adminTable"><h2>현재 대기 현황</h2><div class="grid" id="qq"></div></section></main></div>`;
  renderAdmin(cloneDef()); sub(renderAdmin);
}
function renderAdmin(s){
  const g1=document.getElementById("g1"),g2=document.getElementById("g2"),g3=document.getElementById("g3"),mx=document.getElementById("mx"),cs=document.getElementById("cs"),qq=document.getElementById("qq");
  if(!g1||!g2||!g3||!mx||!cs||!qq)return;
  g1.textContent=s.settings["난타"];g2.textContent=s.settings["4인 복식"];g3.textContent=s.settings["2인 단식"];mx.textContent=s.max_per_court;
  cs.innerHTML=s.courts.map(c=>'<div class="lockCard"><h3>'+c.id+'번 코트</h3><p>'+(c.blocked?'현재 잠금':'현재 사용 가능')+'</p><button class="'+(c.blocked?'locked':'open')+'" onclick="block('+c.id+','+(!c.blocked)+')">'+(c.blocked?'잠금 해제':'코트 잠금')+'</button></div>').join('');
  qq.innerHTML=s.courts.map(c=>'<div class="card"><h3>'+c.id+'번 코트</h3>'+(c.active?'<p>이용 중: '+esc(c.active.nickname)+' <button class="smallbtn" onclick="force('+c.id+')">강제 퇴장</button></p>':'<p>이용 중 없음</p>')+(c.queue||[]).map((x,i)=>'<p>'+String(i+1)+'. '+esc(x.nickname)+' / '+esc(x.game)+'</p>').join('')+'</div>').join('');
}
async function changeTime(game,delta){
  const el=game==="난타"?document.getElementById("g1"):game==="4인 복식"?document.getElementById("g2"):document.getElementById("g3");
  if(!el)return;
  const v=Math.max(15,Math.min(20,Number(el.textContent||15)+delta));
  el.textContent=v;
  try{
    const s=await get();
    s.settings=s.settings||{"난타":15,"4인 복식":15,"2인 단식":15};
    s.settings[game]=v;
    await save(s);
  }catch(e){
    showError(e);
  }
}
function changeMax(delta){
  const el=document.getElementById("mx"); if(!el)return;
  el.textContent=Math.max(4,Math.min(20,Number(el.textContent||5)+delta));
}
async function saveAdmin(){
  try{
    let s=await get();
    s.settings["난타"]=Math.max(15,Math.min(20,Number(document.getElementById("g1").textContent)));
    s.settings["4인 복식"]=Math.max(15,Math.min(20,Number(document.getElementById("g2").textContent)));
    s.settings["2인 단식"]=Math.max(15,Math.min(20,Number(document.getElementById("g3").textContent)));
    s.max_per_court=Math.max(4,Math.min(20,Number(document.getElementById("mx").textContent)));
    await save(s);
    alert("변경사항이 저장되었습니다.");
  }catch(e){showError(e)}
}
async function block(id,b){
  try{
    let s=await get();
    s.courts.find(c=>c.id===id).blocked=b;
    await save(s);
  }catch(e){showError(e)}
}
async function force(id){
  try{
    let s=await get(),c=s.courts.find(c=>c.id===id);
    if(c.active){s.finished=s.finished||{};s.finished[c.active.ticket]={...c.active,endedAt:Date.now()};c.active=null}
    await advance(s); await save(s);
  }catch(e){showError(e)}
}

(function(){
  const r=route();
  if(r==="management"){openManagement();return;}
  
  if(r==="admin")admin();
  else if(r==="register")register();
  else if(r==="waiting")waiting();
  else if(r==="display")display();
  else register();
  ensure().catch(e=>console.error(e));
})();
</script>
<script>
(function(){
  const MG_COLORS=["#07854b","#1461e8","#6332d7","#ff7900","#e51e2a"];

  window.setManageMode=function(mode){
    const d=document.getElementById("manageDisplay");
    const a=document.getElementById("manageAdmin");
    const db=document.getElementById("mDisplayBtn");
    const ab=document.getElementById("mAdminBtn");
    if(!d||!a)return;
    d.style.display=mode==="display"?"block":"none";
    a.style.display=mode==="admin"?"block":"none";
    db.className=mode==="display"?"on":"off";
    ab.className=mode==="admin"?"on":"off";
  };

  window.renderManagement=function(state){
    const stats=document.getElementById("mStats"), courts=document.getElementById("mCourts");
    if(!stats||!courts)return;
    const cs=state.courts||[];
    const active=cs.filter(c=>c.active).length;
    const teams=cs.reduce((n,c)=>n+(c.queue||[]).length,0);
    const people=cs.reduce((n,c)=>n+(c.queue||[]).reduce((m,x)=>{
      return m+(x.game==="4인 복식"?4:x.game==="2인 단식"?2:1);
    },0),0);

    stats.innerHTML=
      '<div class="manage-stat"><small>전체 코트</small><b>'+cs.length+'개</b></div>'+
      '<div class="manage-stat"><small>이용 중 코트</small><b>'+active+'개</b></div>'+
      '<div class="manage-stat"><small>대기 팀</small><b>'+teams+'팀</b></div>'+
      '<div class="manage-stat"><small>대기 인원</small><b>'+people+'명</b></div>';

    courts.innerHTML=cs.map((c,i)=>{
      const a=c.active,q=c.queue||[];
      const remaining=a&&a.endAt?left(a.endAt):"00:00";
      const status=c.blocked?"사용 불가":a?"이용 중":"대기 중";
      const bg=a?"#eef7f1":c.blocked?"#f1f3f6":"#fff7ed";
      const fg=a?"#07854b":c.blocked?"#667085":"#c2410c";
      const rows=q.map((x,j)=>
        '<div class="manage-qrow"><b>'+(j+1)+'</b><span>'+esc(x.nickname)+'</span><span>'+esc(x.game||"")+'</span></div>'
      ).join("");
      return '<section class="manage-court">'+
        '<div class="manage-head"><b><span style="color:'+MG_COLORS[i]+'">●</span> '+c.id+'번 코트</b>'+
        '<span class="manage-badge" style="background:'+(a?MG_COLORS[i]:c.blocked?"#718096":"#c2410c")+'">'+status+'</span></div>'+
        '<div class="manage-body">'+
        (a?
          '<div class="manage-current" style="background:'+bg+';border:1px solid '+(a?"#c8ead5":"#fed7aa")+'">'+
          '<div class="state" style="color:'+fg+'">이용 중</div>'+
          '<div class="time" style="color:'+fg+'">'+remaining+'</div>'+
          '<div style="font-size:10px;color:#667085;font-weight:800">이용 잔여시간</div></div>'+
          '<div class="manage-row"><span>현재 이용자</span><b>'+esc(a.nickname)+'</b></div>'+
          '<div class="manage-row"><span>게임 방식</span><b>'+esc(a.game)+'</b></div>'+
          '<div class="manage-row"><span>이용 시간</span><b>'+tm(a.startAt)+' ~ '+tm(a.endAt)+'</b></div>'
        :
          '<div class="manage-current" style="background:'+bg+';border:1px solid #fed7aa">'+
          '<div class="state" style="color:'+fg+'">대기 중</div>'+
          '<div class="time" style="color:'+fg+'">'+q.length+'팀</div>'+
          '<div style="font-size:10px;color:#667085;font-weight:800">현재 대기</div></div>'
        )+
        '<div class="manage-qtitle">'+c.id+'번 코트 대기 현황</div>'+
        (rows||'<div class="manage-qrow"><span></span><span>대기자 없음</span><span></span></div>')+
        '</div></section>';
    }).join("");

    const controls=document.getElementById("mCourtControls");
    if(controls){
      controls.innerHTML=cs.map(c=>
        '<div class="manage-control"><b>'+c.id+'번 코트</b>'+
        '<span class="manage-btn '+(c.blocked?"manage-gray":"manage-blue")+'">'+(c.blocked?"잠금":"사용 가능")+'</span></div>'
      ).join("");
    }
    const wt=document.getElementById("mWaitingTeams");
    if(wt)wt.textContent=teams+"팀";
  };

  // Use the existing app's state getter when available.
  window.openManagement=function(){
    const app=document.getElementById("app");
    const mp=document.getElementById("managementPage");
    if(app)app.style.display="none";
    if(mp)mp.style.display="block";
    setManageMode("display");
    if(typeof get==="function"){
      get().then(renderManagement).catch(()=>{});
    }
  };
})();
</script>
</body></html>
