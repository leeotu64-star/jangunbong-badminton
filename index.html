.admin{display:grid;grid-template-columns:190px 1fr;min-height:calc(100vh - 76px)}.side{background:#071b45;color:#fff;padding:18px 10px}.side h2{font-size:16px;margin:0;padding:10px}.nav{display:block;box-sizing:border-box;padding:14px;border-radius:6px;margin:4px 0;font-weight:800;color:#fff;text-decoration:none}.nav.on{background:#0c63e8}.main{padding:25px}.panel{border:1px solid #dfe5ee;border-radius:9px;margin-bottom:18px;padding:18px}.panel h2{margin:0 0 6px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.card{border:1px solid #dce3ee;border-radius:8px;padding:12px}.card h3{margin:0 0 10px}.smallbtn{padding:7px 11px;border:1px solid #ccd6e4;background:#fff;border-radius:6px}.settings{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.setting{border:1px solid #dce3ee;border-radius:8px;padding:12px;display:flex;justify-content:space-between;align-items:center}.setting input{width:65px;padding:7px;text-align:center}.save{background:#0c63e8;color:#fff;border:0;border-radius:7px;padding:11px 28px;font-weight:800}

<style id="adminPolish">
/* 관리자 화면 정리용 디자인 - 기능/동작은 변경하지 않음 */
.admin{
  min-height:calc(100vh - 72px);
  background:#f3f6fa;
  display:grid;
  grid-template-columns:150px 1fr;
}
.side{
  background:#071b45;
  padding:22px 10px;
  position:sticky;
  top:0;
  height:calc(100vh - 72px);
  box-sizing:border-box;
}
.side h2{
  font-size:15px;
  margin:0 0 16px;
  padding:8px 10px;
  color:#fff;
}
.nav{
  padding:13px 12px;
  margin:5px 0;
  border-radius:8px;
  font-size:14px;
  transition:.15s;
}
.nav.on{background:#1466e8}
.nav:hover{background:#123b7f}
.main{
  padding:20px 22px 35px;
  max-width:1700px;
  width:100%;
  box-sizing:border-box;
}
.panel{
  background:#fff;
  border:1px solid #dbe3ee;
  border-radius:12px;
  margin-bottom:14px;
  padding:18px;
  box-shadow:0 2px 8px rgba(18,38,70,.05);
}
.panel h2{
  font-size:20px;
  margin:0 0 5px;
  color:#10244b;
}
.hint{color:#718096;font-size:12px}
.lockGrid,.controlRow,.grid{
  gap:10px;
}
.lockCard{
  border:1px solid #dce4ee;
  border-radius:10px;
  background:#fbfcfe;
  padding:14px;
  box-shadow:none;
}
.lockCard h3{
  font-size:17px;
  margin:0 0 8px;
}
.lockCard p{
  color:#64748b;
  margin:5px 0 12px;
  font-size:12px;
}
.lockCard button{
  width:100%;
  min-height:38px;
  border-radius:7px;
  font-weight:900;
}
.controlBox{
  background:#fbfcfe;
  border:1px solid #dce4ee;
  border-radius:10px;
  padding:16px;
}
.controlBox h3{
  margin:0 0 12px;
  font-size:16px;
}
.stepper{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}
.stepper button{
  width:38px;
  height:36px;
  border-radius:7px;
  font-size:18px;
  font-weight:900;
}
.stepper strong{
  min-width:38px;
  text-align:center;
  font-size:21px;
}
.adminSave{
  margin-top:13px;
  min-width:130px;
}
.adminTable .grid{
  align-items:stretch;
}
.adminTable .card{
  min-height:145px;
  background:#fbfcfe;
  border:1px solid #d9e2ee;
  border-radius:10px;
  padding:13px;
  box-sizing:border-box;
}
.adminTable .card h3{
  font-size:16px;
  color:#10244b;
  padding-bottom:9px;
  margin-bottom:8px;
  border-bottom:1px solid #e6ebf2;
}
.adminTable .card p{
  margin:7px 0;
  font-size:12px;
  line-height:1.5;
}
.adminTable .card p:first-of-type{
  background:#eef4ff;
  border-radius:7px;
  padding:8px;
  font-weight:800;
}
.adminTable .smallbtn{
  float:right;
  background:#e53935;
  color:#fff;
  border:0;
  border-radius:6px;
  padding:6px 9px;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
}
.adminTable .smallbtn:hover{background:#c62828}
.adminTop a{
  background:#1466e8;
  border-radius:7px;
  padding:9px 15px;
  font-weight:900;
}
@media(max-width:950px){
  .admin{grid-template-columns:1fr}
  .side{position:relative;height:auto}
  .main{padding:14px}
  .grid{grid-template-columns:repeat(2,1fr)}
}
</style>

<style id="monitorFinalPolish">

:root{
  --navy:#071d49;--blue:#1769e8;--green:#079455;--orange:#f97316;
  --purple:#6734d4;--red:#e51d35;--line:#c9d5e5;--soft:#f4f7fb;
  --ink:#071b3f;
}
body{background:linear-gradient(135deg,#eef3f9 0%,#f8fafc 55%,#eaf0f8 100%) !important;}
.monitor-shell{

.monitor-brand{display:flex;align-items:center;gap:15px}

.badminton-mark svg{width:49px;height:49px}
.monitor-title{font-size:30px;font-weight:950;letter-spacing:-1.2px}

<script>
const SB_HEADERS={"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY,"Content-Type":"application/json"};
async function sbGet(){
  const url=SUPABASE_URL+"/rest/v1/waiting_state?id=eq.waiting_state&select=*";
  const r=await fetch(url,{
    method:"GET",
    headers:{
      "apikey":SUPABASE_ANON_KEY,
      "Authorization":"Bearer "+SUPABASE_ANON_KEY,
      "Accept":"application/json"
    },
    cache:"no-store"
  });
  const text=await r.text();
  if(!r.ok) throw new Error("조회 오류 "+r.status+" : "+text);
  const rows=text?JSON.parse(text):[];
  return rows[0]||null;
}
async function sbUpsert(row){
  const payload={
    settings:row.settings||{"난타":15,"4인 복식":15,"2인 단식":15},
    max_per_court:Number(row.max_per_court||5),
    finished:row.finished||{},
    courts:Array.isArray(row.courts)?row.courts:[]
  };
  const url=SUPABASE_URL+"/rest/v1/waiting_state?id=eq.waiting_state";
  const r=await fetch(url,{
    method:"PATCH",
    headers:{
      "apikey":SUPABASE_ANON_KEY,
      "Authorization":"Bearer "+SUPABASE_ANON_KEY,
      "Content-Type":"application/json",
      "Accept":"application/json",
      "Prefer":"return=representation"
    },
    body:JSON.stringify(payload)
  });
  const text=await r.text();
  if(!r.ok) throw new Error("저장 오류 "+r.status+" : "+text);
  const rows=text?JSON.parse(text):[];
  if(!Array.isArray(rows)||rows.length===0)
    throw new Error("저장 오류 : waiting_state가 수정되지 않았습니다.");
  return true;
}const ROOT="waiting_state";
const params=new URLSearchParams(location.search);
const REGISTER_URL=location.origin+location.pathname+"?page=register";
const ticket=params.get("ticket")||"";
const colors=["#07854b","#1461e8","#6332d7","#ff7900","#e51e2a"];
const def={id:ROOT,settings:{"난타":15,"4인 복식":15,"2인 단식":15},max_per_court:5,finished:{},courts:[1,2,3,4,5].map(id=>({id,blocked:false,active:null,queue:[]}))};

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function tm(t){return new Date(t).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}
function left(t){let n=Math.max(0,Math.ceil((t-Date.now())/1000));return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")}
function cloneDef(){return JSON.parse(JSON.stringify(def))}
function showError(err){
  const msg=err?.message||String(err||"알 수 없는 오류");
  console.error("Supabase error:",err);
  const box=document.getElementById("app");
  if(box && !box.innerHTML.includes("장군봉 배드민턴")) {
    box.innerHTML='<div style="max-width:720px;margin:60px auto;padding:28px;font-family:Arial;text-align:center"><h2>고객용 QR 스마트등록</h2><p>데이터 연결을 준비하는 중입니다.</p><small>'+esc(msg)+'</small></div>';
  }
}
async function get(){
  const data=await sbGet();
  return data?data:cloneDef();
}
async function save(s){
  await sbUpsert({
    id:ROOT,
    settings:s.settings,
    max_per_court:s.max_per_court,
    finished:s.finished||{},
    courts:s.courts
  });
}
async function ensure(){
  const data=await sbGet();
  if(!data) await save(cloneDef());
}
async function advance(s,doSave=true){
  s.finished=s.finished||{};
  let ch=false;
  for(const c of s.courts){
    if(c.active && Date.now()>=Number(c.active.endAt)){
      const a=c.active;
      s.finished[a.ticket]={...a,endedAt:Date.now()};
      c.active=null; ch=true;
    }
    if(!c.active && !c.blocked && (c.queue||[]).length){
      const x=c.queue.shift();
      const m=Number(s.settings[x.game]||15);
      const st=Date.now();
      c.active={...x,startAt:st,endAt:st+m*60000};
      ch=true;
    }
  }
  if(ch && doSave) await save(s);
  return s;
}
let liveTimer=null;
function sub(fn){
  if(liveTimer) clearInterval(liveTimer);
  const refresh=async()=>{try{fn(await advance(await get()))}catch(e){showError(e)}};
  refresh();
  liveTimer=setInterval(refresh,2000);
}

/* GitHub Pages compatible routing:
   /?page=register
   /?page=admin
   /?page=waiting&ticket=...
   Existing /register, /admin, /waiting paths are also supported. */
function route(){
  const path=location.pathname.replace(/\/+$/,"");
  const page=params.get("page")||"";
  if(page==="management") return "management";
  if(path==="/admin" || path.endsWith("/admin") || page==="admin") return "admin";
  if(path==="/register" || path.endsWith("/register") || page==="register") return "register";
  if(path==="/waiting" || path.endsWith("/waiting") || page==="waiting" || ticket) return "waiting";
  return "customer";
}

function renderCustomer(s){
  const stats=document.getElementById("stats"), courts=document.getElementById("courts");
  if(!stats||!courts)return;
  const activeCount=s.courts.filter(c=>c.active).length;
  const waitingTeams=s.courts.reduce((n,c)=>n+(c.queue||[]).length,0);
  const waitingPeople=s.courts.reduce((n,c)=>
    n+(c.queue||[]).reduce((m,x)=>m+(x.game==="4인 복식"?4:x.game==="2인 단식"?2:1),0),0);

  stats.innerHTML='<div class="stat"><span class="statLabel">전체 코트</span><b>5 개</b></div>'+
    '<div class="stat"><span class="statLabel">이용 중 코트</span><b>'+activeCount+' 개</b></div>'+
    '<div class="stat"><span class="statLabel">대기 중 팀</span><b>'+waitingTeams+' 팀</b></div>'+
    '<div class="stat"><span class="statLabel">전체 대기 인원</span><b>'+waitingPeople+' 명</b></div>';

  const gameMin=x=>Number(s.settings?.[x?.game])||15;
  const remainMin=c=>{
    if(!c.active||!c.active.endAt)return 0;
    return Math.max(0,Math.ceil((new Date(c.active.endAt)-Date.now())/60000));
  };
  const eta=(c,index)=>{
    let min=remainMin(c);
    const q=c.queue||[];
    for(let j=0;j<index;j++)min+=gameMin(q[j]);
    return min;
  };

  courts.innerHTML=s.courts.map((c,i)=>{
    const q=c.queue||[], a=c.active;
    const status=c.blocked?'사용 불가':a?'이용 중':'대기 중';
    const waitRows=q.map((x,j)=>
      '<div class="qrow"><b>'+(j+1)+'</b><span><strong>'+esc(x.nickname)+'</strong></span><span class="qgame">'+esc(x.game||"")+'</span><span class="qeta">약 '+eta(c,j)+'분 후</span></div>'
    ).join('');

    return '<section class="court">'+
      '<div class="head"><span><span class="num" style="background:'+colors[i]+'">'+c.id+'</span>'+c.id+'번 코트</span>'+
      '<span class="badge" style="background:'+(a?colors[i]:'#718096')+'">'+status+'</span></div>'+
      '<div class="body">'+
      (a?
        '<div class="row"><span class="label">닉네임</span><span class="val">'+esc(a.nickname)+'</span></div>'+
        '<div class="row"><span class="label">게임 방식</span><span class="val">'+esc(a.game)+'</span></div>'+
        '<div class="row"><span class="label">이용 시간</span><span class="val">'+tm(a.startAt)+' ~ '+tm(a.endAt)+'</span></div>'+
        '<div class="row"><span class="label">남은 시간</span><span class="val remain">'+left(a.endAt)+'</span></div>':
        '<div class="row"><span class="label">현재 대기 팀</span><span class="val">'+q.length+'팀</span></div>'+
        '<div class="row"><span class="label">예상 대기 시간</span><span class="val">'+(q.length?'약 '+eta(c,0)+'분':'약 0분')+'</span></div>')+
      '<div class="qbox"><div class="qtitle">'+c.id+'번 코트 대기 현황 (총 '+q.length+'팀)</div>'+
      (waitRows?'<div class="queueHead"><span>순번</span><span>닉네임</span><span>게임 구분</span><span>예상 입장</span></div>'+waitRows:'<div class="waitEmpty">현재 대기자가 없습니다.</div>')+
      '</div></div></section>';
  }).join('');
}

async function loadRegisterDuration(){
  const game=document.getElementById("g"), out=document.getElementById("duration");
  if(!game||!out)return;
  let timer=null;
  const sync=async()=>{
    try{
      const s=await get();
      out.textContent=(s.settings?.[game.value]||15)+"분";
    }catch(e){}
  };
  game.addEventListener("change",sync);
  await sync();
  timer=setInterval(sync,2000);
  window.addEventListener("beforeunload",()=>{if(timer)clearInterval(timer)},{once:true});
}

      <div class="doneScreen" style="padding:12px 14px;background:#061b4f;text-align:left">
        <div style="text-align:center;font-size:13px;font-weight:900;margin-bottom:10px">고객용 QR 스마트등록</div>
        <div style="text-align:center;font-size:10px;margin-bottom:12px">간편하게 코트 대기를 확인하세요.</div>

        <div style="background:#fff;color:#071633;border-radius:12px;padding:12px">
          <div style="font-size:13px;font-weight:900;margin-bottom:8px">내 대기 정보</div>
          <div class="row"><span>닉네임</span><b>${esc(q.nickname)}</b></div>
          <div class="row"><span>선택 코트</span><b>${q.court}번 코트</b></div>
          <div class="row"><span>이용 시간</span><b>${duration}분</b></div>

          <div class="my" style="margin-top:12px">
            <small>나의 순번</small>
            <strong>${pos}번</strong>
            <small>(현재 대기 중)</small>
          </div>

          <div style="display:flex;justify-content:space-between;font-size:11px;margin:10px 2px 4px">
            <span>착 ${now.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}</span>
            <span>종료 ${eta.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}</span>
          </div>

          <div style="text-align:center;font-size:11px;color:#333">남은 시간</div>
          <div class="timer" style="color:#07854b">${String(expected).padStart(2,"0")}:00</div>

          <div class="qbox">
            <div class="qtitle">${c.id}번 코트 대기 현황 (총 ${arr.length}팀)</div>
            <div class="qrow" style="font-weight:800"><span>순번</span><span>닉네임</span><span>예상 대기 시간</span></div>
            ${arr.map((x,i)=>{
              const wait=Math.max(0,activeRemain+i*duration);
              return `<div class="qrow"><b>${i+1}</b><span>${esc(x.nickname)}${x.ticket===ticket?' <b>(나)</b>':''}</span><span>약 ${wait}분 후 입장</span></div>`;
            }).join("")}
          </div>

          <button class="btn cancel" onclick="cancelWait()">예약 대기 취소</button>
        </div>
      </div>`;
    return;
  }

  w.innerHTML='대기 등록 정보가 없습니다.';
}
async function cancelWait(){
  try{let s=await get();for(const c of s.courts)c.queue=(c.queue||[]).filter(x=>x.ticket!==ticket);await save(s);location.href="?page=register"}catch(e){showError(e)}
}
async function leave(){
  try{let s=await get();for(const c of s.courts)if(c.active?.ticket===ticket){s.finished=s.finished||{};s.finished[ticket]={...c.active,endedAt:Date.now()};c.active=null}await advance(s);await save(s)}catch(e){showError(e)}
}
async function finish(){
  try{let s=await get();if(s.finished)delete s.finished[ticket];await save(s);location.href="?page=register"}catch(e){showError(e)}
}

function setupAdminNav(){
  document.querySelectorAll('.side .nav').forEach(a=>a.addEventListener('click',()=>{
    document.querySelectorAll('.side .nav').forEach(x=>x.classList.remove('on'));
    a.classList.add('on');
  }));
}

function admin(){
  const app=document.getElementById("app");
  app.innerHTML=`<header class="header"><div><div class="brand">장군봉 통합관리</div><div class="sub">통합관리 시스템</div></div><div class="adminTop"><a href="?page=customer">고객 화면으로</a></div></header><div class="admin"><aside class="side"><h2>관리자 모드</h2><a class="nav on" href="#courtManage">코트 관리</a><a class="nav" href="#gameTime">게임 시간 설정</a><a class="nav" href="#waitMax">대기 정원 설정</a></aside><main class="main"><section class="panel" id="courtManage"><div class="adminSectionTitle"><div><h2>코트 관리</h2><div class="hint">사용하지 않을 코트는 잠금할 수 있습니다.</div></div></div><div class="lockGrid" id="cs"></div></section><section class="panel" id="gameTime"><div class="adminSectionTitle"><div><h2>게임 시간 설정</h2><div class="hint">기본 15분 · 1분씩 조절 · 최대 20분</div></div></div><div class="controlRow"><div class="controlBox"><h3>4인 복식</h3><div class="stepper"><button onclick="changeTime('4인 복식',-1)">−</button><strong id="g2">15</strong><span>분</span><button onclick="changeTime('4인 복식',1)">+</button></div></div><div class="controlBox"><h3>2인 단식</h3><div class="stepper"><button onclick="changeTime('2인 단식',-1)">−</button><strong id="g3">15</strong><span>분</span><button onclick="changeTime('2인 단식',1)">+</button></div></div><div class="controlBox"><h3>난타</h3><div class="stepper"><button onclick="changeTime('난타',-1)">−</button><strong id="g1">15</strong><span>분</span><button onclick="changeTime('난타',1)">+</button></div></div></div></section><section class="panel" id="waitMax"><div class="adminSectionTitle"><div><h2>대기자 최대 정원</h2><div class="hint">전체 코트에 동일하게 적용 · 4명~20명</div></div></div><div class="controlBox"><div class="stepper"><button onclick="changeMax(-1)">−</button><strong id="mx">5</strong><span>명</span><button onclick="changeMax(1)">+</button></div></div><button class="save adminSave" onclick="saveAdmin()">변경사항 저장</button></section><section class="panel adminTable"><h2>현재 대기 현황</h2><div class="grid" id="qq"></div></section></main></div>`;
  renderAdmin(cloneDef()); sub(renderAdmin);
}
function renderAdmin(s){
  const g1=document.getElementById("g1"),g2=document.getElementById("g2"),g3=document.getElementById("g3"),mx=document.getElementById("mx"),cs=document.getElementById("cs"),qq=document.getElementById("qq");
  if(!g1||!g2||!g3||!mx||!cs||!qq)return;
  g1.textContent=s.settings["난타"];g2.textContent=s.settings["4인 복식"];g3.textContent=s.settings["2인 단식"];mx.textContent=s.max_per_court;
  cs.innerHTML=s.courts.map(c=>'<div class="lockCard"><h3>'+c.id+'번 코트</h3><p>'+(c.blocked?'현재 잠금':'현재 사용 가능')+'</p><button class="'+(c.blocked?'locked':'open')+'" onclick="block('+c.id+','+(!c.blocked)+')">'+(c.blocked?'잠금 해제':'코트 잠금')+'</button></div>').join('');
  qq.innerHTML=s.courts.map(c=>'<div class="card"><h3>'+c.id+'번 코트</h3>'+(c.active?'<p>이용 중: '+esc(c.active.nickname)+' <button class="smallbtn" onclick="force('+c.id+')">강제 퇴장</button></p>':'<p>이용 중 없음</p>')+(c.queue||[]).map((x,i)=>'<p>'+String(i+1)+'. '+esc(x.nickname)+' / '+esc(x.game)+'</p>').join('')+'</div>').join('');
}
async function changeTime(game,delta){
  const el=game==="난타"?document.getElementById("g1"):game==="4인 복식"?document.getElementById("g2"):document.getElementById("g3");
  if(!el)return;
  const v=Math.max(15,Math.min(20,Number(el.textContent||15)+delta));
  el.textContent=v;
  try{
    const s=await get();
    s.settings=s.settings||{"난타":15,"4인 복식":15,"2인 단식":15};
    s.settings[game]=v;
    await save(s);
  }catch(e){showError(e)}
}
function changeMax(delta){
  const el=document.getElementById("mx"); if(!el)return;
  el.textContent=Math.max(4,Math.min(20,Number(el.textContent||5)+delta));
}
async function saveAdmin(){
  try{
    let s=await get();
    s.settings["난타"]=Math.max(15,Math.min(20,Number(document.getElementById("g1").textContent)));
    s.settings["4인 복식"]=Math.max(15,Math.min(20,Number(document.getElementById("g2").textContent)));
    s.settings["2인 단식"]=Math.max(15,Math.min(20,Number(document.getElementById("g3").textContent)));
    s.max_per_court=Math.max(4,Math.min(20,Number(document.getElementById("mx").textContent)));
    await save(s);
    alert("변경사항이 저장되었습니다.");
  }catch(e){showError(e)}
}
async function block(id,b){
  try{
    let s=await get();
    s.courts.find(c=>c.id===id).blocked=b;
    await save(s);
  }catch(e){showError(e)}
}
async function force(id){
  try{
    let s=await get(),c=s.courts.find(c=>c.id===id);
    if(c.active){s.finished=s.finished||{};s.finished[c.active.ticket]={...c.active,endedAt:Date.now()};c.active=null}
    await advance(s); await save(s);
  }catch(e){showError(e)}
}


function management(){
  const view=params.get("view")||"display";
  if(view==="admin"){
    admin();
    const top=document.querySelector('.adminTop');
    if(top){
      const links=top.querySelectorAll('a');
      if(links[0]){links[0].href='?page=management&view=display';links[0].textContent='고객용';}
      if(links[1]){links[1].href='?page=register';links[1].textContent='QR 등록';}
    }
  }else{
    customer();
    const top=document.querySelector('.header > div:last-child');
    if(top){
      const a=top.querySelector('a.customerBtn');
      if(a){a.href='?page=management&view=admin';a.textContent='관리자';}
    }
  }
}

(function(){
  const r=route();
  if(r==="management")management();
  else if(r==="admin")admin();
  else if(r==="register")register();
  else if(r==="waiting")waiting();
  else customer();
  ensure().catch(e=>console.error(e));
})();
</script></body></html>
