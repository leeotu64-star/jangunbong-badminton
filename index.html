<style id="adminPolish">
/* 관리자 화면 정리용 디자인 - 기능/동작은 변경하지 않음 */
.admin{
  min-height:calc(100vh - 72px);
  background:#f3f6fa;
  display:grid;
  grid-template-columns:150px 1fr;
}
.side{
  background:#071b45;
  padding:22px 10px;
  position:sticky;
  top:0;
  height:calc(100vh - 72px);
  box-sizing:border-box;
}
.side h2{
  font-size:15px;
  margin:0 0 16px;
  padding:8px 10px;
  color:#fff;
}
.nav{
  padding:13px 12px;
  margin:5px 0;
  border-radius:8px;
  font-size:14px;
  transition:.15s;
}
.nav.on{background:#1466e8}
.nav:hover{background:#123b7f}
.main{
  padding:20px 22px 35px;
  max-width:1700px;
  width:100%;
  box-sizing:border-box;
}
.panel{
  background:#fff;
  border:1px solid #dbe3ee;
  border-radius:12px;
  margin-bottom:14px;
  padding:18px;
  box-shadow:0 2px 8px rgba(18,38,70,.05);
}
.panel h2{
  font-size:20px;
  margin:0 0 5px;
  color:#10244b;
}
.hint{color:#718096;font-size:12px}
.lockGrid,.controlRow,.grid{
  gap:10px;
}
.lockCard{
  border:1px solid #dce4ee;
  border-radius:10px;
  background:#fbfcfe;
  padding:14px;
  box-shadow:none;
}
.lockCard h3{
  font-size:17px;
  margin:0 0 8px;
}
.lockCard p{
  color:#64748b;
  margin:5px 0 12px;
  font-size:12px;
}
.lockCard button{
  width:100%;
  min-height:38px;
  border-radius:7px;
  font-weight:900;
}
.controlBox{
  background:#fbfcfe;
  border:1px solid #dce4ee;
  border-radius:10px;
  padding:16px;
}
.controlBox h3{
  margin:0 0 12px;
  font-size:16px;
}
.stepper{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}
.stepper button{
  width:38px;
  height:36px;
  border-radius:7px;
  font-size:18px;
  font-weight:900;
}
.stepper strong{
  min-width:38px;
  text-align:center;
  font-size:21px;
}
.adminSave{
  margin-top:13px;
  min-width:130px;
}
.adminTable .grid{
  align-items:stretch;
}
.adminTable .card{
  min-height:145px;
  background:#fbfcfe;
  border:1px solid #d9e2ee;
  border-radius:10px;
  padding:13px;
  box-sizing:border-box;
}
.adminTable .card h3{
  font-size:16px;
  color:#10244b;
  padding-bottom:9px;
  margin-bottom:8px;
  border-bottom:1px solid #e6ebf2;
}
.adminTable .card p{
  margin:7px 0;
  font-size:12px;
  line-height:1.5;
}
.adminTable .card p:first-of-type{
  background:#eef4ff;
  border-radius:7px;
  padding:8px;
  font-weight:800;
}
.adminTable .smallbtn{
  float:right;
  background:#e53935;
  color:#fff;
  border:0;
  border-radius:6px;
  padding:6px 9px;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
}
.adminTable .smallbtn:hover{background:#c62828}
.adminTop a{
  background:#1466e8;
  border-radius:7px;
  padding:9px 15px;
  font-weight:900;
}
@media(max-width:950px){
  .admin{grid-template-columns:1fr}
  .side{position:relative;height:auto}
  .main{padding:14px}
  .grid{grid-template-columns:repeat(2,1fr)}
}
</style>

function findDeviceRegistration(s,deviceId){
  for(const c of (s.courts||[])){
    if(c.active?.deviceId===deviceId) return {type:"active",court:c,entry:c.active};
    const q=(c.queue||[]).find(x=>x.deviceId===deviceId);
    if(q) return {type:"queue",court:c,entry:q};
  }
  return null;
}

function getReRegisterMinutes(s){
  const n=Number(s?.re_register_minutes);
  return Number.isFinite(n)&&n>0 ? Math.max(1,Math.min(20,n)) : 5;

function getReRegisterUntil(s,fin){
  const stored=Number(fin?.reRegisterUntil||0);

  const ended=Number(fin?.endedAt||0);
  return ended ? ended+getReRegisterMinutes(s)*60000 : 0;
}

  let best=null;

function tm(t){return new Date(t).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hourCycle:"h23"})}
function left(t){let n=Math.max(0,Math.ceil((t-Date.now())/1000));return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")}
function cloneDef(){return JSON.parse(JSON.stringify(def))}

async function save(s){
  /* 다른 고객 기기의 오래된 상태가 관리자 설정을 덮어쓰지 않도록
     저장 직전에 서버의 최신 설정값을 가져와 설정은 최신값을 보존합니다. */
  const latest=await sbGet();
  const payload={
    id:ROOT,
    settings:latest?.settings||s.settings||{"난타":15,"4인 복식":15,"2인 단식":15},
    max_per_court:Number(latest?.max_per_court||s.max_per_court||5),
    re_register_minutes:Math.max(1,Math.min(20,Number(latest?.re_register_minutes||s.re_register_minutes||5))),
    finished:s.finished||{},
    courts:Array.isArray(s.courts)?s.courts:[]
  };
  await sbUpsert(payload);
}

function kstDateKey(t=Date.now()){
  return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(t));
}
function resetHistoryForNewDay(s){
  s.finished=s.finished||{};
  const today=kstDateKey();
  if(s.finished._historyDate!==today){
    const keep={};
    for(const [k,v] of Object.entries(s.finished)){
      if(k==="_historyDate"||k==="_history")continue;
      if(v && typeof v==="object" && v.source!=="qr") keep[k]=v;
    }
    s.finished=keep;
    s.finished._historyDate=today;
    s.finished._history={};
    return true;
  }
  if(!s.finished._history) s.finished._history={};
  return false;
}
async function advance(s,doSave=true){
  s.finished=s.finished||{};
  let ch=resetHistoryForNewDay(s);
  for(const c of s.courts){
    if(c.active && Date.now()>=Number(c.active.endAt)){
      const a=c.active;
      const endedAt=Date.now();
      const record={...a,source:"qr",endedAt,deviceId:(a.deviceId||getDeviceToken()),reRegisterUntil:endedAt+getReRegisterMinutes(s)*60000};
      s.finished[a.ticket]=record;
      s.finished._history=s.finished._history||{};
      s.finished._history[a.ticket]=record;
      c.active=null; ch=true;
    }
    if(!c.active && !c.blocked && (c.queue||[]).length){
      const x=c.queue.shift();
      const m=Number(s.settings[x.game]||15);
      const st=Date.now();
      const et=st+m*60000;
      c.active={
        ...x,
        startAt:st,
        endAt:et,
        startTime:tm(st),
        endTime:tm(et)
      };
      ch=true;
    }
  }
  if(ch && doSave) await save(s);
  return s;
}
let liveTimer=null;
function sub(fn){
  if(liveTimer) clearInterval(liveTimer);
  const refresh=async()=>{try{fn(await advance(await get()))}catch(e){showError(e)}};

}

/* GitHub Pages compatible routing:
   /#register
   /?page=admin
   /?page=waiting&ticket=...
   Existing /register, /admin, /waiting paths are also supported. */
function route(){
  const path=location.pathname.replace(/\/+$/,"");
  const page=params.get("page")||"";
  if(page==="management") return "management";
  if(page==="insight") return "insight";
  if(path==="/admin" || path.endsWith("/admin") || page==="admin") return "admin";
  if(path==="/register" || path.endsWith("/register") || page==="register") return "register";
  if(path==="/waiting" || path.endsWith("/waiting") || page==="waiting" || ticket) return "waiting";
  return "customer";
}

function nextAutoLabel(state){
  const pool=[..."ABCDEFGHIJKLMNOPQRSTUVWXYZㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ"];
  const used=new Set();
  for(const c of (state?.courts||[])){
    if(c?.active?.nickname) used.add(String(c.active.nickname));
    for(const x of (Array.isArray(c?.queue)?c.queue:[])){
      if(x?.nickname) used.add(String(x.nickname));
    }
  }
  return pool.find(v=>!used.has(v)) || ("대기"+(used.size+1));
}

async function reg(){
  const btn=document.getElementById("regBtn"), ee=document.getElementById("e");
  const gg=document.getElementById("g").value;
  const id=Number(document.getElementById("c").value);
  const deviceId=getDeviceToken();

  const err=(msg)=>{
    ee.style.display="block";
    ee.textContent=msg;
    btn.disabled=false; btn.style.opacity="1";
  };

  if(!gg||!id){err("게임 방식과 코트를 선택해주세요.");return}

  /* 같은 스마트폰의 5분 재등록 제한 */
  const cooldown=getCooldownUntil();
  if(cooldown>Date.now()){
    err("⚠️ 이미 등록했습니다. "+cooldownMessage(cooldown));
    return;
  }

  btn.disabled=true; btn.style.opacity=".65"; ee.style.display="none";

  try{
    let s=await get();
    if(!s || !Array.isArray(s.courts)) s=cloneDef();
    s.settings=s.settings||{"난타":15,"4인 복식":15,"2인 단식":15};
    s.max_per_court=Math.max(1,Math.min(20,Number(s.max_per_court||5)));
    s.re_register_minutes=Math.max(1,Math.min(20,Number(s.re_register_minutes||5)));
    s.finished=s.finished||{};
    const nn=nextAutoLabel(s);

    /* 서버에 저장된 익명 기기 토큰으로 모든 코트의 중복 대기/이용 여부 검사 */
    const existing=findDeviceRegistration(s,deviceId);
    if(existing){
      err("⚠️ 이미 대기 등록되어 있습니다.\n기존 대기를 취소하거나 이용을 마친 후 다시 등록해주세요.");
      return;
    }

    const x=s.courts.find(v=>Number(v.id)===id);
    if(!x){err("선택한 코트를 찾을 수 없습니다.");return}
    if(x.blocked){err("현재 이용할 수 없는 코트입니다. 다른 코트를 선택해주세요.");return}

    x.queue=Array.isArray(x.queue)?x.queue:[];
    const total=x.queue.length+(x.active?1:0);
    if(total>=s.max_per_court){err("선택한 코트의 대기가 마감되었습니다.");return}

    const t=(crypto&&crypto.randomUUID)?crypto.randomUUID():
      ("T"+Date.now()+Math.random().toString(36).slice(2));

    /* QR에는 개인정보가 없고, 대기 데이터에도 익명 랜덤 토큰만 저장 */
    x.queue.push({
      ticket:t,
      nickname:nn,
      game:gg,
      court:id,

    });

    // 변경된 active/queue 상태와 현재 대기 정원을 서버에 확실히 저장
    await save(s);

  /* 2번째 화면: 대기 중 */

      : `${expectedSecPart}초`;

    w.innerHTML=`
      <div style="font-size:11px;color:#1565ff;font-weight:800;text-align:center;margin-bottom:8px">
        ● 개선 화면 (해당 코트만 간결하게)
      </div>
      <div class="doneScreen" style="padding:12px 14px;background:#061b4f;text-align:left">
        <div style="text-align:center;font-size:13px;font-weight:900;margin-bottom:10px">고객용 QR 스마트등록</div>
        <div style="text-align:center;font-size:10px;margin-bottom:12px">간편하게 코트 대기를 확인하세요.</div>

        <div style="background:#fff;color:#071633;border-radius:12px;padding:12px">
          <div style="font-size:13px;font-weight:900;margin-bottom:8px">내 대기 정보</div>

          <div class="row"><span>이용 시간</span><b>${Number(s.settings?.[q.game]||15)}분</b></div>

          <div class="my" style="margin-top:12px">
            <small>나의 순번</small>
            <strong>${pos}번</strong>
            <small>(현재 대기 중)</small>
          </div>

          <div style="display:flex;justify-content:space-between;font-size:11px;margin:10px 2px 4px">

              for(let k=0;k<i;k++) waitSec+=Number(s.settings?.[arr[k].game]||15)*60;

        </div>
      </div>`;
    return;
  }

  w.innerHTML='대기 등록 정보가 없습니다.';
}
async function cancelWait(){
  try{
    let s=await get();
    s.finished=s.finished||{};
    resetHistoryForNewDay(s);
    let removed=null;
    for(const c of s.courts){
      const q=c.queue||[];
      const found=q.find(x=>x.ticket===ticket);
      if(found)removed={...found,court:c.id};
      c.queue=q.filter(x=>x.ticket!==ticket);
    }
    if(removed){
      const endedAt=Date.now();
      const record={
        ...removed,
        source:"qr",
        endedAt,
        canceled:true,
        deviceId:(removed.deviceId||getDeviceToken()),
        reRegisterUntil:endedAt+getReRegisterMinutes(s)*60000
      };
      s.finished[ticket]=record;
      s.finished._history=s.finished._history||{};
      s.finished._history[ticket]=record;
    }
    await save(s);
    location.replace(location.pathname+"?page=waiting&ticket="+encodeURIComponent(ticket));
  }catch(e){showError(e)}
}
async function leave(){
  try{
    let s=await get();
    s.finished=s.finished||{};
    resetHistoryForNewDay(s);
    for(const c of s.courts){
      if(c.active?.ticket===ticket){
        const endedAt=Date.now(); const record={...c.active,source:"qr",endedAt,deviceId:(c.active.deviceId||getDeviceToken()),reRegisterUntil:endedAt+getReRegisterMinutes(s)*60000};
        s.finished[ticket]=record;
        s.finished._history=s.finished._history||{};
        s.finished._history[ticket]=record;
        c.active=null;
      }
    }
    await advance(s);
    await save(s);
  }catch(e){showError(e)}
}
async function finish(){
  try{let s=await get();if(s.finished)delete s.finished[ticket];await save(s);location.href="#register"}catch(e){showError(e)}
}

function jgbKstNow(){return new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Seoul"}))}
function jgbDateKey(d=new Date()){const x=new Date(d),y=x.getFullYear(),m=String(x.getMonth()+1).padStart(2,"0"),day=String(x.getDate()).padStart(2,"0");return y+"-"+m+"-"+day}
const JGB_HOLIDAYS_2026=new Set(["2026-01-01","2026-02-16","2026-02-17","2026-02-18","2026-03-01","2026-03-02","2026-05-05","2026-05-24","2026-05-25","2026-06-03","2026-06-06","2026-08-15","2026-08-17","2026-09-24","2026-09-25","2026-09-26","2026-10-03","2026-10-05","2026-10-09","2026-12-25"]);
function jgbIsWeekendOrHoliday(d){const x=new Date(d);return x.getDay()===0||x.getDay()===6||JGB_HOLIDAYS_2026.has(jgbDateKey(x))}
function jgbSchedule(d=new Date()){return jgbIsWeekendOrHoliday(d)?{label:"주말·공휴일",courts:5,start:"16:00",end:"21:50",minutes:350}:{label:"평일",courts:1,start:"19:00",end:"21:50",minutes:170}}
function jgbClockDate(d,clock){const x=new Date(d),a=clock.split(":").map(Number);x.setHours(a[0],a[1],0,0);return x}
function jgbOverlapMinutes(a,b,start,end){const s=Math.max(Number(a||0),start.getTime()),e=Math.min(Number(b||0),end.getTime());return Math.max(0,(e-s)/60000)}
function jgbFormatMin(n){n=Math.max(0,Math.round(Number(n)||0));const h=Math.floor(n/60),m=n%60;return h?h+"시간 "+m+"분":m+"분"}
function jgbInsightRecords(s){const out=[],hist=s?.finished?._history||{};for(const [ticket,r] of Object.entries(hist)){if(ticket.startsWith("_")||!r||typeof r!=="object")continue;out.push({...r,ticket})}for(const c of (s?.courts||[])){if(c.active)out.push({...c.active,court:c.id,_active:true});for(const q of (c.queue||[]))out.push({...q,court:c.id,_waiting:true})}return out}
function jgbInsightMetrics(s,now=new Date()){const sch=jgbSchedule(now),today=jgbDateKey(now),start=jgbClockDate(now,sch.start),end=jgbClockDate(now,sch.end),elapsed=Math.max(0,Math.min(sch.minutes,(now-start)/60000)),usable=sch.courts*elapsed,recs=jgbInsightRecords(s),todayRecs=recs.filter(r=>r.createdAt?jgbDateKey(r.createdAt)===today:true);let used=0,waits=[],games=0;for(const r of todayRecs){if(r.startAt){const ea=r.endedAt||r.endAt||now.getTime();used+=jgbOverlapMinutes(r.startAt,ea,start,end);waits.push(Math.max(0,(Number(r.startAt)-Number(r.createdAt||r.startAt))/60000));if(!r._waiting)games++}else if(r._waiting)waits.push(Math.max(0,(now.getTime()-Number(r.createdAt||now.getTime()))/60000))}return{sch,today,recs:todayRecs,used,elapsed,usable,avgWait:waits.length?waits.reduce((a,b)=>a+b,0)/waits.length:0,games,utilElapsed:usable>0?Math.min(100,used/usable*100):0}}
function jgbHourlyData(m,now=new Date()){const out=[],h0=+m.sch.start.slice(0,2),h1=+m.sch.end.slice(0,2);for(let h=h0;h<=h1;h++){const hs=jgbClockDate(now,String(h).padStart(2,"0")+":00"),he=new Date(hs.getTime()+3600000);let teams=0;for(const r of m.recs){if(r.startAt){const st=new Date(Number(r.startAt));if(st>=hs&&st<he)teams++}}out.push({label:String(h).padStart(2,"0")+"시",teams})}return out}

function renderInsight(s){const body=document.getElementById("jgbInsightBody");if(!body)return;const now=jgbKstNow(),m=jgbInsightMetrics(s,now),sch=m.sch,data=jgbHourlyData(m,now),maxTeams=Math.max(1,...data.map(x=>x.teams)),queueCount=(s.courts||[]).reduce((n,c)=>n+(c.queue||[]).length,0),activeCount=(s.courts||[]).filter(c=>c.active).length,status=m.elapsed<=0?"운영 전":m.elapsed>=sch.minutes?"운영 종료":"운영 중";const bars=data.map(x=>`<div class="insightBarCol"><div class="insightBarValue">${x.teams}</div><div class="insightBar" style="height:${Math.max(2,x.teams/maxTeams*140)}px"></div><div class="insightBarLabel">${x.label}</div></div>`).join("");const start=jgbClockDate(now,sch.start),end=jgbClockDate(now,sch.end);const courtRows=(s.courts||[]).slice(0,5).map(c=>{let used=0;for(const r of m.recs.filter(r=>Number(r.court)===Number(c.id))){if(r.startAt)used+=jgbOverlapMinutes(r.startAt,r.endedAt||r.endAt||Date.now(),start,end)}const open=sch.courts===5||c.id===1,pct=open?Math.min(100,used/Math.max(1,m.elapsed)*100):0;return `<div class="insightCourt"><div class="insightCourtName">${c.id}번 코트${open?"":" (평일 미운영)"}</div><div class="insightTrack"><div class="insightFill" style="width:${pct}%"></div></div><div class="insightPct">${open?Math.round(pct)+"%":"-"}</div></div>`}).join("");body.innerHTML=`<div class="insightKpis"><div class="insightKpi"><div class="insightKpiTitle">오늘 운영 기준</div><div class="insightKpiValue">${sch.label}</div><div class="insightKpiSub">${sch.courts}코트 · ${sch.start} ~ ${sch.end} · ${jgbFormatMin(sch.minutes)}</div></div><div class="insightKpi"><div class="insightKpiTitle">이용 팀</div><div class="insightKpiValue">${m.recs.filter(r=>!r._waiting).length}팀</div><div class="insightKpiSub">오늘 현재 기준</div></div><div class="insightKpi"><div class="insightKpiTitle">게임 수</div><div class="insightKpiValue">${m.games}게임</div><div class="insightKpiSub">완료 + 현재 이용</div></div><div class="insightKpi"><div class="insightKpiTitle">평균 대기</div><div class="insightKpiValue async function resetHistory(){
  if(!confirm("오늘 이용 기록을 모두 초기화할까요?\n현재 이용 중/대기 중인 팀은 삭제하지 않습니다."))return;
  try{
    const s=await get();
    s.finished=s.finished||{};
    s.finished._history={};
    s.finished._historyDate=kstDateKey();
    await save(s);
    renderAdmin(await get());
    alert("이용 기록이 초기화되었습니다.");
  }catch(e){showError(e)}
}
function changeTime(game,delta){
  const el=game==="난타"?document.getElementById("g1"):game==="4인 복식"?document.getElementById("g2"):document.getElementById("g3");
  if(!el)return;
  const value=Math.max(1,Math.min(20,Number(el.textContent||15)+delta));
  el.textContent=value;
  adminSettingsDirty=true;
  if(game==="난타")adminDraft.g1=value;
  else if(game==="4인 복식")adminDraft.g2=value;
  else adminDraft.g3=value;
}
function changeMax(delta){
  const el=document.getElementById("mx"); if(!el)return;
  const value=Math.max(1,Math.min(20,Number(el.textContent||5)+delta));
  el.textContent=value; adminDraft.mx=value; adminSettingsDirty=true;
}
function changeCooldown(delta){
  const el=document.getElementById("rc"); if(!el)return;
  const value=Math.max(1,Math.min(20,Number(el.textContent||5)+delta));
  el.textContent=value; adminDraft.rc=value; adminSettingsDirty=true;
}

async function saveWithSettings(s){
  /* 관리자 설정은 해당 필드만 저장하여 고객 상태 저장과 충돌하지 않게 합니다. */
  await sbUpsert({
    id:ROOT,
    settings:s.settings,
    max_per_court:s.max_per_court,
    re_register_minutes:Math.max(1,Math.min(20,Number(s.re_register_minutes||5))),
    finished:s.finished||{},
    courts:s.courts
  });
}

async function saveGameTime(){
  try{
    let s=await get();
    s.settings=s.settings||{"난타":15,"4인 복식":15,"2인 단식":15};
    s.settings["난타"]=Math.max(1,Math.min(20,Number(document.getElementById("g1").textContent||15)));
    s.settings["4인 복식"]=Math.max(1,Math.min(20,Number(document.getElementById("g2").textContent||15)));
    s.settings["2인 단식"]=Math.max(1,Math.min(20,Number(document.getElementById("g3").textContent||15)));
    await saveWithSettings(s);
    adminSettingsDirty=false;
    const saved=await get();
    renderAdmin(saved);
    alert("게임 시간 설정이 저장되었습니다.");
  }catch(e){showError(e)}
}

async function saveWaitMax(){
  try{
    let s=await get();
    if(!s) s=cloneDef();

    // 대기 정원만 변경하고 기존 게임시간/재등록시간은 그대로 보존
    const value=Math.max(1,Math.min(20,Number(document.getElementById("mx").textContent||5)));
    s.max_per_court=value;

    await saveWithSettings(s);
    adminSettingsDirty=false;

    // 저장 후 서버값으로 다시 읽어 5명으로 되돌아가는 현상 방지

    alert("대기 정원 설정이 저장되었습니다. 현재 정원: "+Number(saved.max_per_court||value)+"명");
  }catch(e){showError(e)}
}

async function saveCooldown(){

async function saveAdmin(){
  try{
    let s=await get();
    const reRegisterMinutes=Math.max(1,Math.min(20,Number(document.getElementById("rc").textContent||5)));
    s.settings=s.settings||{"난타":15,"4인 복식":15,"2인 단식":15};
    s.settings["난타"]=Math.max(1,Math.min(20,Number(document.getElementById("g1").textContent||15)));
    s.settings["4인 복식"]=Math.max(1,Math.min(20,Number(document.getElementById("g2").textContent||15)));
    s.settings["2인 단식"]=Math.max(1,Math.min(20,Number(document.getElementById("g3").textContent||15)));
    s.max_per_court=Math.max(1,Math.min(20,Number(document.getElementById("mx").textContent||5)));
    s.re_register_minutes=reRegisterMinutes;

    // 게임시간/정원과 함께 재등록 제한시간도 waiting_state에 확실히 저장
    await save(s);

    // 저장 직후 DB에서 다시 읽어 화면을 갱신하여 5분으로 되돌아가는 현상 방지
    const saved=await get();
    renderAdmin(saved);
    alert("변경사항이 저장되었습니다.");
  }catch(e){showError(e)}
}
async function block(id,b){
  try{
    let s=await get();
    const c=s.courts.find(c=>c.id===id);
    if(!c)return;
    c.blocked=!!b;
    await save(s);
  }catch(e){showError(e)}
}
window.jgbBlock=function(id,b){ return block(id,b); };
async function force(id){
  try{
    let s=await get(),c=s.courts.find(c=>c.id===id);
    if(c.active){
      s.finished=s.finished||{};
      resetHistoryForNewDay(s);
      const endedAt=Date.now(); const record={...c.active,endedAt,deviceId:(c.active.deviceId||getDeviceToken()),forced:true,reRegisterUntil:endedAt+getReRegisterMinutes(s)*60000};
      s.finished[c.active.ticket]=record;
      s.finished._history=s.finished._history||{};
      s.finished._history[c.active.ticket]=record;
      c.active=null;
    }
    await advance(s); await save(s);
  }catch(e){showError(e)}
}

<script id="JGB_OPERATIONAL_RESET">
async function resetOperationalState(){
  const ok=confirm("⚠️ 오늘 운영 상태를 초기화할까요?\n\n현재 진행 중인 게임과 모든 대기 순번이 삭제됩니다.\n게임시간·대기정원·재등록 제한시간·코트 잠금 설정은 그대로 유지됩니다.\n이용 기록도 삭제하지 않습니다.");
  if(!ok)return;
  const ok2=confirm("정말 초기화하시겠습니까?\n\n초기화 후에는 현재 게임과 대기 순번을 복구할 수 없습니다.");
  if(!ok2)return;
  try{
    let s=await get();
    if(!s||!Array.isArray(s.courts)) s=cloneDef();
    s.courts=(s.courts||[]).map(c=>({
      ...c,
      active:null,
      queue:[]
    }));
    // 설정값(settings/max_per_court/re_register_minutes)과 코트 잠금(blocked),
    // 이용 기록(finished)은 그대로 유지합니다.
    await save(s);
    const saved=await get();
    renderAdmin(saved);
    alert("오늘 운영 상태가 초기화되었습니다.\n게임시간 및 관리자 설정은 그대로 유지됩니다.");
  }catch(e){
    showError(e);
  }
}
</script>

<script id="JGB_ACCESS_GATE">
(function(){
  const AUTH_KEY="jgb_route_auth_v1";
  const SUPABASE_URL="https://jvurwckjumnzzecazgku.supabase.co";
  const SUPABASE_ANON_KEY="sb_publishable_ATg2EbcVch2360kEit3w4g_IcHAWHIL";

  function targetRoute(){
    const p=new URLSearchParams(location.search);
    const page=p.get("page")||"";
    if(page==="admin" || page==="insight") return "admin";
    if(page==="management" && (p.get("view")||"display")==="display") return "display";
    return "";
  }

  function authKey(route){ return AUTH_KEY+"_"+route; }

  function isAuthed(route){
    return localStorage.getItem(authKey(route))==="ok";
  }

  function showGate(route){
    if(document.getElementById("jgbAccessGate")) return;
    const gate=document.createElement("div");
    gate.id="jgbAccessGate";
    gate.style.cssText="position:fixed;inset:0;z-index:2147483647;background:#fff;display:flex;align-items:center;justify-content:center;font-family:inherit;";
    gate.innerHTML='<div style="width:min(420px,88vw);text-align:center;padding:28px;box-sizing:border-box;">'
      +'<div style="font-size:28px;margin-bottom:12px;">🔒</div>'
      +'<div style="font-size:22px;font-weight:700;margin-bottom:8px;">접근 확인</div>'
      +'<div style="font-size:14px;margin-bottom:18px;">비밀번호를 입력해주세요.</div>'
      +'<input id="jgbGatePw" type="password" inputmode="numeric" autocomplete="off" style="width:100%;box-sizing:border-box;padding:12px;font-size:18px;text-align:center;border:1px solid #ccc;border-radius:8px;">'
      +'<button id="jgbGateBtn" type="button" style="width:100%;margin-top:12px;padding:12px;font-size:16px;border:0;border-radius:8px;cursor:pointer;">확인</button>'
      +'<div id="jgbGateErr" style="min-height:20px;margin-top:10px;font-size:13px;"></div>'
      +'</div>';
    document.body.appendChild(gate);

    const input=gate.querySelector("#jgbGatePw");
    const btn=gate.querySelector("#jgbGateBtn");
    const err=gate.querySelector("#jgbGateErr");

    async function verify(){
      btn.disabled=true;
      err.textContent="";
      try{
        const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/verify_jgb_route_password",{
          method:"POST",
          headers:{
            "apikey":SUPABASE_ANON_KEY,
            "Authorization":"Bearer "+SUPABASE_ANON_KEY,
            "Content-Type":"application/json"
          },
          body:JSON.stringify({p_route:route,p_password:input.value})
        });
        const raw=await r.text();
        let ok=false;
        try{ ok=raw==="true" || JSON.parse(raw)===true; }catch(_){}
        if(!r.ok || !ok) throw new Error("비밀번호가 올바르지 않습니다.");
        localStorage.setItem(authKey(route),"ok");
        gate.remove();
      }catch(e){
        err.textContent=e.message||"인증에 실패했습니다.";
        input.value="";
        input.focus();
      }finally{
        btn.disabled=false;
      }
    }
    btn.addEventListener("click",verify);
    input.addEventListener("keydown",e=>{if(e.key==="Enter")verify()});
    input.focus();
  }

  function run(){
    const route=targetRoute();
    if(!route || isAuthed(route)) return;
    showGate(route);
  }

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",run);
  else run();
})();
</script>
