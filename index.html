<script id="JGB_EAM_PUBLIC_REFINEMENT">
(function(){
  const META_KEY='JGB_EAM_ASSET_META_V39';
  const CATMAP={
    '냉난방':'cooling','냉방':'cooling',
    '소방·방재':'fire','소방':'fire','소방장비':'fire','소방제어':'fire','저수조':'fire',
    '온수·난방':'water','온수기':'water','보일러':'water',
    '전기설비':'electrical','전기':'electrical',
    '코트조명':'lighting','조명':'lighting',
    '방수':'waterproof','기타설비':'other','기타':'other'
  };
  const CATLABEL={
    cooling:'냉난방',fire:'소방·방재',water:'온수·난방',
    electrical:'전기설비',lighting:'코트조명',waterproof:'방수',other:'기타설비'
  };
  const PREFIX={cooling:'AC',fire:'FI',water:'BO',electrical:'EL',lighting:'LT',waterproof:'WP',other:'OT'};

  function val(x){return String(x??'').trim()}
  function metaRead(){try{return JSON.parse(localStorage.getItem(META_KEY)||'{}')||{}}catch(e){return {}}}
  function metaWrite(x){try{localStorage.setItem(META_KEY,JSON.stringify(x||{}))}catch(e){console.warn(e)}}
  function esc(x){return typeof xEsc==='function'?xEsc(x):val(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

  function selectedSource(){
    const code=val(window.__eamSelCode);
    if(typeof eamSourceAssets==='function') return eamSourceAssets().find(x=>val(x.code)===code)||null;
    return null;
  }
  function selectedDb(){
    const code=val(window.__eamSelCode);
    return (window.__eamA||[]).find(x=>val(x.asset_code)===code)||null;
  }
  function categoryKey(category){
    return CATMAP[val(category)]||'other';
  }
  function unifiedCodeFor(source){
    if(typeof eamUnifiedCode==='function') return eamUnifiedCode(source);
    const k=categoryKey(source?.category||source?.type);
    return PREFIX[k]+'-01';
  }
  function placeCode(place){
    const p=val(place);
    if(p.includes('유수장치실'))return 'E';
    if(p.includes('옥상'))return 'D';
    if(p.includes('사무실'))return 'C';
    if(p.includes('복도'))return 'B';
    if(p.includes('코트'))return 'A';
    return '-';
  }
  function placeOptions(code){
    const m={
      A:['1번 코트(좌측)','1번 코트(우측)','2번 코트(좌측)','2번 코트(우측)','3번 코트(좌측)','3번 코트(우측)','4번 코트(좌측)','4번 코트(우측)','5번 코트(좌측)','5번 코트(우측)','코트'],
      B:['복도'],C:['사무실'],D:['옥상'],E:['유수장치실']
    };
    return m[code]||['유수장치실'];
  }

  /* ---------- 화면 스타일 ---------- */
  const css=document.createElement('style');
  css.id='JGB_EAM_PUBLIC_REFINEMENT_CSS';
  css.textContent=`
    .jgb-eam-code-guide{
      display:flex;gap:7px;flex-wrap:wrap;align-items:center;
      margin:10px 0 14px;padding:10px 12px;border:1px solid #d9e5f1;
      border-radius:13px;background:linear-gradient(135deg,#f8fbff,#eef6ff);
      box-shadow:0 6px 18px rgba(36,91,140,.06);font-size:10px;color:#52677b
    }
    .jgb-eam-code-guide b{font-size:11px;color:#173b5d;margin-right:3px}
    .jgb-eam-code-guide span{padding:5px 8px;border-radius:8px;background:#fff;border:1px solid #dce7f1}
    .jgb-eam-code-guide strong{color:#1769c1}
    .eam-type{transition:.2s!important}
    .eam-type:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(38,91,138,.12)!important}
    .eam-type-cooling.on{background:linear-gradient(145deg,#edf8ff,#dff1ff)!important;border-color:#62aee8!important}
    .eam-type-fire.on{background:linear-gradient(145deg,#fff4f2,#ffe7e2)!important;border-color:#ef8c7d!important}
    .eam-type-water.on{background:linear-gradient(145deg,#fff8ec,#ffedd1)!important;border-color:#e9a950!important}
    .eam-type-electrical.on{background:linear-gradient(145deg,#fffbe9,#fff3bc)!important;border-color:#e2c14f!important}
    .eam-type-lighting.on{background:linear-gradient(145deg,#fffdf0,#fff5bf)!important;border-color:#e3c95a!important}
    .eam-type-waterproof.on{background:linear-gradient(145deg,#f3fbf8,#def2ea)!important;border-color:#75bda1!important}
    .eam-type-other.on{background:linear-gradient(145deg,#f7f8fb,#eceff4)!important;border-color:#aab6c4!important}

    .jgb-history-card{
      margin-top:15px;border:1px solid #cbdceb;border-radius:17px;overflow:hidden;
      background:#fff;box-shadow:0 10px 26px rgba(32,78,116,.09)
    }
    .jgb-history-head{
      display:flex;justify-content:space-between;align-items:center;gap:12px;
      padding:13px 15px;background:linear-gradient(135deg,#edf6ff,#e4f0fb);
      border-bottom:1px solid #d3e1ee
    }
    .jgb-history-head .title{display:flex;align-items:center;gap:8px;font-weight:900;color:#183d5f;font-size:14px}
    .jgb-history-head small{display:block;margin-top:3px;color:#72879a;font-size:9px}
    .jgb-history-edit{
      border:0;border-radius:9px;padding:8px 13px;background:#1469bb;color:#fff;
      font-weight:800;cursor:pointer;box-shadow:0 5px 12px rgba(20,105,187,.2)
    }
    .jgb-history-grid{
      display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:#dbe5ee
    }
    .jgb-history-cell{min-height:64px;padding:10px 12px;background:#fff}
    .jgb-history-cell small{display:block;color:#71869a;font-size:9px;margin-bottom:7px}
    .jgb-history-cell b{display:block;color:#183b5b;font-size:12px;line-height:1.35}
    .jgb-history-cell.wide{grid-column:span 2}
    .jgb-history-section{
      padding:9px 13px;background:#f7faff;border-top:1px solid #dbe5ee;
      color:#60768b;font-size:9px;font-weight:800
    }

    .jgb-eam-edit-mask{
      position:fixed;inset:0;z-index:99999;background:rgba(15,35,55,.46);
      display:flex;align-items:center;justify-content:center;padding:18px
    }
    .jgb-eam-edit-modal{
      width:min(920px,96vw);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;
      box-shadow:0 24px 70px rgba(0,0,0,.25)
    }
    .jgb-eam-edit-top{
      position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;
      padding:16px 18px;background:linear-gradient(135deg,#0f5fa9,#1777c8);color:#fff
    }
    .jgb-eam-edit-top h3{margin:3px 0 0;font-size:18px}
    .jgb-eam-edit-top small{opacity:.82}
    .jgb-eam-edit-close{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:9px;font-size:20px;width:34px;height:34px;cursor:pointer}
    .jgb-eam-edit-body{padding:17px}
    .jgb-eam-edit-note{padding:10px 12px;border-radius:10px;background:#f2f8ff;border:1px solid #d7e7f5;color:#4e6a80;font-size:10px;margin-bottom:14px}
    .jgb-eam-edit-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
    .jgb-eam-edit-grid label{display:block;color:#5d7286;font-size:10px;font-weight:800}
    .jgb-eam-edit-grid label.wide{grid-column:span 3}
    .jgb-eam-edit-grid input,.jgb-eam-edit-grid select,.jgb-eam-edit-grid textarea{
      width:100%;box-sizing:border-box;margin-top:5px;border:1px solid #cfdae5;border-radius:9px;
      padding:9px 10px;background:#fbfdff;color:#183b5b;font:inherit;outline:none
    }
    .jgb-eam-edit-grid input:focus,.jgb-eam-edit-grid select:focus,.jgb-eam-edit-grid textarea:focus{
      border-color:#4d9be0;box-shadow:0 0 0 3px rgba(77,155,224,.12)
    }
    .jgb-eam-edit-grid input[readonly]{background:#eef4f9;color:#718294}
    .jgb-eam-edit-actions{
      display:flex;justify-content:flex-end;gap:8px;padding:14px 17px;border-top:1px solid #e3eaf0
    }
    .jgb-eam-edit-actions button{border:0;border-radius:9px;padding:9px 15px;font-weight:800;cursor:pointer}
    .jgb-eam-edit-actions .cancel{background:#edf1f5;color:#526679}
    .jgb-eam-edit-actions .save{background:#1469bb;color:#fff}
    @media(max-width:760px){
      .jgb-history-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .jgb-history-cell.wide{grid-column:span 2}
      .jgb-eam-edit-grid{grid-template-columns:1fr 1fr}
      .jgb-eam-edit-grid label.wide{grid-column:span 2}
    }
    @media(max-width:500px){
      .jgb-eam-edit-grid{grid-template-columns:1fr}
      .jgb-eam-edit-grid label.wide{grid-column:span 1}
    }
  `;
  document.head.appendChild(css);

  /* ---------- 관리 메뉴: 자산 수정/내부수리 제거 ---------- */
  window.eamOpenManageMenu=function(){
    document.getElementById('eamManageModal')?.remove();
    const src=selectedSource(), reg=selectedDb();
    if(!src){alert('관리할 시설·설비를 선택하세요.');return}
    const exists=!!reg;
    document.body.insertAdjacentHTML('beforeend',`
      <div id="eamManageModal" class="eam-manage-modal" onclick="if(event.target===this)this.remove()">
        <div class="eam-manage-card">
          <div class="eam-manage-head">
            <div><span>EAM ASSET MANAGEMENT</span><h3>${esc(src.name||'시설·설비')}</h3><small>${exists?'등록 자산 관리':'원본 자산 관리'}</small></div>
            <button onclick="document.getElementById('eamManageModal').remove()">×</button>
          </div>
          <div class="eam-manage-grid">
            <button onclick="eamHistoryCardEdit();document.getElementById('eamManageModal')?.remove()">
              ✏️ <b>주요설비 이력카드 수정</b><small>기본정보·설비사양·관리정보를 통합 수정</small>
            </button>
            <button onclick="eamRegisterMaintenance('${esc(src.code)}');document.getElementById('eamManageModal')?.remove()">
              🛠️ <b>외부정비 등록</b><small>업체 정비·점검·부품교체 및 비용 기록</small>
            </button>
            <button onclick="eamShowHistory();document.getElementById('eamManageModal')?.remove()">
              📋 <b>정비 이력</b><small>해당 자산의 유지관리 이력 확인</small>
            </button>
            <button onclick="eamRetireSelectedAsset?.();document.getElementById('eamManageModal')?.remove()">
              ♻️ <b>폐기·교체</b><small>자산 수명주기 종료 처리</small>
            </button>
            <button class="danger" onclick="eamDeleteSelectedAsset?.();document.getElementById('eamManageModal')?.remove()">
              🗑 <b>자산 삭제</b><small>관리자 확인 후 삭제</small>
            </button>
          </div>
        </div>
      </div>`);
  };

  /* ---------- 이력카드 데이터 계산 ---------- */
  function getCardData(){
    const src=selectedSource();
    const a=selectedDb()||{};
    const meta=Object.assign({},metaRead()[val(src?.code)]||{});
    const merged=Object.assign({},src||{},a||{},meta||{});
    const H=window.__eamH||[], I=window.__eamI||[];
    const hs=a?.id?H.filter(h=>val(h.asset_id)===val(a.id)&&h.event_type!=='자산정보수정'):H.filter(h=>val(h.asset_code)===val(src?.code)&&h.event_type!=='자산정보수정');
    const ins=a?.id?I.filter(i=>val(i.asset_id)===val(a.id)):[];
    const ext=hs.filter(h=>{
      const t=val(h.event_type)+' '+val(h.action_type);
      return /외부정비|외부수리|업체/.test(t);
    });
    const lastExt=ext[0]||null, lastIns=ins[0]||null;
    const lastAction=lastExt?.description||merged.recentAction||'-';
    return {
      ...merged,
      code:val(src?.code||a?.asset_code),
      displayCode:src?unifiedCodeFor(src):val(a?.asset_code),
      category:CATLABEL[categoryKey(merged.category||merged.type)]||val(merged.category||merged.type)||'기타설비',
      place:val(merged.place)||'-',
      recentInspection:val(merged.recentInspection)||val(lastIns?.inspection_date)||'-',
      recentExternal:val(merged.recentExternal)||val(lastExt?.event_date)||'-',
      externalCount:val(merged.externalCount)||String(ext.length),
      recentAction:lastAction||'-',
      nextInspection:val(merged.nextInspection)||'-',
      replacementPlan:val(merged.replacementPlan)||'미정',
      improvementPlan:val(merged.improvementPlan)||'-',
      note:val(merged.note)||'-'
    };
  }

  /* ---------- 이력카드 DOM 생성/교체 ---------- */
  function decorateHistoryCard(){
    const panel=document.querySelector('.eam-detail-panel');
    if(!panel)return;
    const old=panel.querySelector('.eam-source-card,.jgb-history-card');
    if(!old)return;
    const d=getCardData();
    const cell=(label,value,wide=false)=>`<div class="jgb-history-cell${wide?' wide':''}"><small>${label}</small><b>${esc(value||'-')}</b></div>`;
    const html=`
      <section class="jgb-history-card">
        <div class="jgb-history-head">
          <div><div class="title">📋 주요설비 이력카드</div><small>자산 기본정보와 유지관리 정보를 통합 관리</small></div>
          <button type="button" class="jgb-history-edit" onclick="eamHistoryCardEdit()">✏️ 수정</button>
        </div>
        <div class="jgb-history-section">① 자산·설비 정보</div>
        <div class="jgb-history-grid">
          ${cell('관리코드',d.displayCode)}
          ${cell('자산명',typeof eamDisplayName==='function'?eamDisplayName(d):d.name)}
          ${cell('설비종류',d.category)}
          ${cell('위치',d.place)}
          ${cell('모델·규격',d.model)}
          ${cell('용량',d.capacity)}
          ${cell('수량',d.qty??d.quantity)}
          ${cell('제조사',d.vendor||d.maker)}
        </div>
        <div class="jgb-history-section">② 취득·수명·상태</div>
        <div class="jgb-history-grid">
          ${cell('제조일',d.date||d.manufactureDate)}
          ${cell('설치일',d.installDate)}
          ${cell('내용연수',d.life)}
          ${cell('평가등급',d.grade)}
          ${cell('자산상태',d.status||'정상')}
          ${cell('보증',d.warranty)}
        </div>
        <div class="jgb-history-section">③ 유지관리 현황</div>
        <div class="jgb-history-grid">
          ${cell('최근 점검일',d.recentInspection)}
          ${cell('최근 외부정비일',d.recentExternal)}
          ${cell('누적 외부정비',d.externalCount+'건')}
          ${cell('최근 조치내용',d.recentAction,true)}
          ${cell('차기 점검일',d.nextInspection)}
          ${cell('교체·폐기 예정',d.replacementPlan)}
        </div>
        <div class="jgb-history-section">④ 시설관리</div>
        <div class="jgb-history-grid">
          ${cell('시설개선계획',d.improvementPlan,true)}
          ${cell('A/S 연락처',d.asContact)}
          ${cell('기존 A/S 기록',d.asHistory)}
          ${cell('특이사항',d.note,true)}
        </div>
      </section>`;
    old.outerHTML=html;
  }

  /* ---------- 이력카드 수정/저장 ---------- */
  window.eamHistoryCardEdit=async function(){
    const src=selectedSource();
    if(!src){alert('수정할 시설·설비를 선택하세요.');return}
    let a=selectedDb();
    if(!a && typeof eamEnsureEditableAsset==='function'){
      a=await eamEnsureEditableAsset();
    }
    if(!a){alert('자산 저장을 위한 DB 연결을 확인하세요.');return}
    const d=getCardData();
    const cats=['냉난방','소방·방재','온수·난방','전기설비','코트조명','방수','기타설비'];
    const lc=placeCode(d.place);
    const detail=placeOptions(d.category==='소방·방재'?'E':lc);
    document.getElementById('jgbEamEditMask')?.remove();
    document.body.insertAdjacentHTML('beforeend',`
      <div id="jgbEamEditMask" class="jgb-eam-edit-mask" onclick="if(event.target===this)this.remove()">
        <div class="jgb-eam-edit-modal">
          <div class="jgb-eam-edit-top">
            <div><small>MAJOR EQUIPMENT HISTORY CARD</small><h3>주요설비 이력카드 수정</h3></div>
            <button class="jgb-eam-edit-close" onclick="document.getElementById('jgbEamEditMask').remove()">×</button>
          </div>
          <div class="jgb-eam-edit-body">
            <div class="jgb-eam-edit-note">
              관리코드는 직접 입력하지 않습니다. <b>설비종류를 변경하면 AC / FI / BO / EL / LT / WP / OT 체계로 자동 정합화</b>됩니다.
              기존 원본 자산코드는 내부 식별값으로 유지합니다.
            </div>
            <div class="jgb-eam-edit-grid">
              <label>관리코드<input value="${esc(d.displayCode)}" readonly></label>
              <label>기존 자산코드<input value="${esc(d.code)}" readonly></label>
              <label>설비종류<select id="jgbHC_category">${cats.map(x=>`<option ${x===d.category?'selected':''}>${x}</option>`).join('')}</select></label>

              <label class="wide">자산명<input id="jgbHC_name" value="${esc(d.name||'')}"></label>
              <label>위치코드<select id="jgbHC_loc" onchange="jgbHC_refreshDetail()">
                ${['A · 코트','B · 복도','C · 사무실','D · 옥상','E · 유수장치실'].map(x=>`<option value="${x[0]}" ${x[0]===((d.category==='소방·방재')?'E':lc)?'selected':''}>${x}</option>`).join('')}
              </select></label>
              <label>상세위치<select id="jgbHC_place"></select></label>

              <label>모델·규격<input id="jgbHC_model" value="${esc(d.model||'')}"></label>
              <label>용량<input id="jgbHC_capacity" value="${esc(d.capacity||'')}"></label>
              <label>수량<input id="jgbHC_qty" value="${esc(d.qty??d.quantity??'')}"></label>
              <label>제조사<input id="jgbHC_vendor" value="${esc(d.vendor||d.maker||'')}"></label>
              <label>A/S 연락처<input id="jgbHC_as" value="${esc(d.asContact||'')}"></label>
              <label>제조일<input id="jgbHC_date" value="${esc(d.date||d.manufactureDate||'')}"></label>
              <label>설치일<input id="jgbHC_install" value="${esc(d.installDate||'')}"></label>
              <label>내용연수<input id="jgbHC_life" value="${esc(d.life||'')}"></label>
              <label>평가등급<input id="jgbHC_grade" value="${esc(d.grade||'')}"></label>
              <label>보증<input id="jgbHC_warranty" value="${esc(d.warranty||'')}"></label>
              <label>기존 A/S 기록<input id="jgbHC_asHistory" value="${esc(d.asHistory||'')}"></label>
              <label>자산상태<select id="jgbHC_status">
                ${['정상','점검필요','조치필요','교체검토'].map(x=>`<option ${x===String(d.status||'정상')?'selected':''}>${x}</option>`).join('')}
              </select></label>

              <label>최근 점검일<input id="jgbHC_recentInspection" value="${esc(d.recentInspection==='-'?'':d.recentInspection)}"></label>
              <label>차기 점검일<input id="jgbHC_nextInspection" value="${esc(d.nextInspection==='-'?'':d.nextInspection)}"></label>
              <label>교체·폐기 예정<input id="jgbHC_replacementPlan" value="${esc(d.replacementPlan==='미정'?'':d.replacementPlan)}"></label>
              <label class="wide">시설개선계획<textarea id="jgbHC_improvement" rows="2">${esc(d.improvementPlan==='-'?'':d.improvementPlan)}</textarea></label>
              <label class="wide">특이사항<textarea id="jgbHC_note" rows="2">${esc(d.note==='-'?'':d.note)}</textarea></label>
            </div>
          </div>
          <div class="jgb-eam-edit-actions">
            <button class="cancel" onclick="document.getElementById('jgbEamEditMask').remove()">취소</button>
            <button class="save" id="jgbHC_save" onclick="eamHistoryCardSave('${esc(d.code)}')">저장</button>
          </div>
        </div>
      </div>`);
    document.getElementById('jgbHC_category').addEventListener('change',jgbHC_refreshDetail);
    jgbHC_refreshDetail(true,d.place);
  };

  window.jgbHC_refreshDetail=function(initial,currentPlace){
    const cat=document.getElementById('jgbHC_category')?.value||'기타설비';
    const forced=cat==='소방·방재'?'E':(document.getElementById('jgbHC_loc')?.value||'A');
    const box=document.getElementById('jgbHC_place');if(!box)return;
    const opts=placeOptions(forced);
    box.innerHTML=opts.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
    if(cat==='소방·방재'){
      const lc=document.getElementById('jgbHC_loc');if(lc)lc.value='E';
      box.value='유수장치실';
    }else if(initial && currentPlace && opts.includes(currentPlace)){
      box.value=currentPlace;
    }
  };

  window.eamHistoryCardSave=async function(code){
    const a=(window.__eamA||[]).find(x=>val(x.asset_code)===val(code));
    if(!a){alert('자산을 찾을 수 없습니다.');return}
    if(typeof SUPA==='undefined'||!SUPA){alert('Supabase 연결이 필요합니다.');return}
    const g=id=>val(document.getElementById(id)?.value);
    const category=g('jgbHC_category')||'기타설비';
    const name=g('jgbHC_name');
    if(!name){alert('자산명을 입력하세요.');return}
    const lc=category==='소방·방재'?'E':g('jgbHC_loc');
    const place=category==='소방·방재'?'유수장치실':g('jgbHC_place');
    const m={
      asset_code:val(code),name,category,locationCode:lc,place,
      model:g('jgbHC_model'),capacity:g('jgbHC_capacity'),qty:g('jgbHC_qty'),
      quantity:g('jgbHC_qty'),vendor:g('jgbHC_vendor'),maker:g('jgbHC_vendor'),
      asContact:g('jgbHC_as'),date:g('jgbHC_date'),manufactureDate:g('jgbHC_date'),
      installDate:g('jgbHC_install'),life:g('jgbHC_life'),grade:g('jgbHC_grade'),
      warranty:g('jgbHC_warranty'),asHistory:g('jgbHC_asHistory'),status:g('jgbHC_status')||'정상',
      recentInspection:g('jgbHC_recentInspection'),nextInspection:g('jgbHC_nextInspection'),
      replacementPlan:g('jgbHC_replacementPlan')||'미정',
      improvementPlan:g('jgbHC_improvement'),note:g('jgbHC_note')
    };
    const btn=document.getElementById('jgbHC_save');
    if(btn){btn.disabled=true;btn.textContent='저장 중…'}
    try{
      const up=await SUPA.from('assets').update({
        name,category,place,status:m.status,product_name:m.model||category
      }).eq('id',a.id);
      if(up.error)throw up.error;

      const all=Object.assign({},metaRead());all[val(code)]=m;metaWrite(all);
      window.__eamMetaByCode=Object.assign({},window.__eamMetaByCode||{},all);

      const h=await SUPA.from('asset_history').insert({
        asset_id:a.id,event_type:'자산정보수정',
        description:'META::'+JSON.stringify(m),
        worker_name:'관리자',action_type:'자산마스터수정',
        cost:0,event_date:new Date().toISOString().slice(0,10)
      });
      if(h.error)throw h.error;

      document.getElementById('jgbEamEditMask')?.remove();
      if(typeof eamLoad==='function')await eamLoad();
      window.__eamSelCode=val(code);
      const k=categoryKey(category);window.__eamCat=k;
      render();
      alert('주요설비 이력카드 정보가 저장되었습니다. 관리코드와 설비 분류도 자동 정합화되었습니다.');
    }catch(e){
      console.error(e);alert('이력카드 저장에 실패했습니다.\n'+(e?.message||''));
    }finally{
      if(btn){btn.disabled=false;btn.textContent='저장'}
    }
  };

  /* ---------- 외부정비만 등록 ---------- */
  window.eamRegisterMaintenance=async function(assetId){
    const code=val(assetId||window.__eamSelCode);
    const a=(window.__eamA||[]).find(x=>val(x.asset_code)===code);
    if(!a){alert('먼저 해당 자산을 등록·선택하세요.');return}
    if(typeof SUPA==='undefined'||!SUPA){alert('Supabase 연결이 필요합니다.');return}
    const type=prompt('정비구분을 입력하세요.\n\n수리 / 점검 / 부품교체 / 기타','수리');
    if(type===null)return;
    const work=val(prompt('정비내용을 입력하세요.',''));
    if(!work){alert('정비내용을 입력하세요.');return}
    const vendor=val(prompt('정비업체/담당자를 입력하세요.',''));
    const cost=val(prompt('정비비용을 입력하세요.','0'))||'0';
    const next=val(prompt('차기 점검일을 입력하세요. (예: 2026-12-01)',''));
    try{
      const r=await SUPA.from('asset_history').insert({
        asset_id:a.id,event_type:'외부정비',
        description:`[${type}] ${work}${next?' · 차기점검 '+next:''}`,
        worker_name:vendor,action_type:'외부정비',cost:Number(cost.replace(/,/g,''))||0,
        event_date:new Date().toISOString().slice(0,10)
      });
      if(r.error)throw r.error;
      await eamLoad();render();
      alert('외부정비 이력이 등록되었습니다.');
    }catch(e){console.error(e);alert('외부정비 등록에 실패했습니다.\n'+(e?.message||''))}
  };

  /* ---------- 기존 렌더 이후 이력카드 장식 ---------- */
  function decorate(){
    if((typeof page!=='undefined' && page!=='eam'))return;
    requestAnimationFrame(()=>requestAnimationFrame(decorateHistoryCard));
  }
  const observer=new MutationObserver(()=>{
    if(document.querySelector('.eam-detail-panel'))decorate();
  });
  observer.observe(document.body,{childList:true,subtree:true});
  window.addEventListener('load',decorate);
  decorate();

  /* 기존 자산 수정 함수가 다른 곳에서 호출되어도 이력카드 수정으로 통일 */
  window.eamEditSelectedAsset=window.eamHistoryCardEdit;
})();
</script>
