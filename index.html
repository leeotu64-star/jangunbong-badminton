<style id="adminPolish">
/* 관리자 화면 정리용 디자인 - 기능/동작은 변경하지 않음 */
.admin{
  min-height:calc(100vh - 72px);
  background:#f3f6fa;
  display:grid;
  grid-template-columns:150px 1fr;
}
.side{
  background:#071b45;
  padding:22px 10px;
  position:sticky;
  top:0;
  height:calc(100vh - 72px);
  box-sizing:border-box;
}
.side h2{
  font-size:15px;
  margin:0 0 16px;
  padding:8px 10px;
  color:#fff;
}
.nav{
  padding:13px 12px;
  margin:5px 0;
  border-radius:8px;
  font-size:14px;
  transition:.15s;
}
.nav.on{background:#1466e8}
.nav:hover{background:#123b7f}
.main{
  padding:20px 22px 35px;
  max-width:1700px;
  width:100%;
  box-sizing:border-box;
}
.panel{
  background:#fff;
  border:1px solid #dbe3ee;
  border-radius:12px;
  margin-bottom:14px;
  padding:18px;
  box-shadow:0 2px 8px rgba(18,38,70,.05);
}
.panel h2{
  font-size:20px;
  margin:0 0 5px;
  color:#10244b;
}
.hint{color:#718096;font-size:12px}
.lockGrid,.controlRow,.grid{
  gap:10px;
}
.lockCard{
  border:1px solid #dce4ee;
  border-radius:10px;
  background:#fbfcfe;
  padding:14px;
  box-shadow:none;
}
.lockCard h3{
  font-size:17px;
  margin:0 0 8px;
}
.lockCard p{
  color:#64748b;
  margin:5px 0 12px;
  font-size:12px;
}
.lockCard button{
  width:100%;
  min-height:38px;
  border-radius:7px;
  font-weight:900;
}
.controlBox{
  background:#fbfcfe;
  border:1px solid #dce4ee;
  border-radius:10px;
  padding:16px;
}
.controlBox h3{
  margin:0 0 12px;
  font-size:16px;
}
.stepper{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}
.stepper button{
  width:38px;
  height:36px;
  border-radius:7px;
  font-size:18px;
  font-weight:900;
}
.stepper strong{
  min-width:38px;
  text-align:center;
  font-size:21px;
}
.adminSave{
  margin-top:13px;
  min-width:130px;
}
.adminTable .grid{
  align-items:stretch;
}
.adminTable .card{
  min-height:145px;
  background:#fbfcfe;
  border:1px solid #d9e2ee;
  border-radius:10px;
  padding:13px;
  box-sizing:border-box;
}
.adminTable .card h3{
  font-size:16px;
  color:#10244b;
  padding-bottom:9px;
  margin-bottom:8px;
  border-bottom:1px solid #e6ebf2;
}
.adminTable .card p{
  margin:7px 0;
  font-size:12px;
  line-height:1.5;
}
.adminTable .card p:first-of-type{
  background:#eef4ff;
  border-radius:7px;
  padding:8px;
  font-weight:800;
}
.adminTable .smallbtn{
  float:right;
  background:#e53935;
  color:#fff;
  border:0;
  border-radius:6px;
  padding:6px 9px;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
}
.adminTable .smallbtn:hover{background:#c62828}
.adminTop a{
  background:#1466e8;
  border-radius:7px;
  padding:9px 15px;
  font-weight:900;
}
@media(max-width:950px){
  .admin{grid-template-columns:1fr}
  .side{position:relative;height:auto}
  .main{padding:14px}
  .grid{grid-template-columns:repeat(2,1fr)}
}
</style>

  try{

    if(!v){
      v=(crypto&&crypto.randomUUID)?crypto.randomUUID():
        ("D"+Date.now()+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2));
      localStorage.setItem(DEVICE_KEY,v);

}
function findDeviceRegistration(s,deviceId){
  for(const c of (s.courts||[])){
    if(c.active?.deviceId===deviceId) return {type:"active",court:c,entry:c.active};
    const q=(c.queue||[]).find(x=>x.deviceId===deviceId);
    if(q) return {type:"queue",court:c,entry:q};
  }
  return null;
}


function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function tm(t){return new Date(t).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}
function left(t){let n=Math.max(0,Math.ceil((t-Date.now())/1000));return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")}
function cloneDef(){return JSON.parse(JSON.stringify(def))}
function showError(err){
  const msg=err?.message||String(err||"알 수 없는 오류");

  const box=document.getElementById("app");

  }
}
async function get(){
  const data=await sbGet();
  return data?data:cloneDef();
}
async function save(s){
  await sbUpsert({
    id:ROOT,
    settings:s.settings,
    max_per_court:s.max_per_court,
    finished:s.finished||{},
    courts:s.courts
  });
}
async function ensure(){
  const data=await sbGet();
  if(!data) await save(cloneDef());
}
async function advance(s,doSave=true){
  s.finished=s.finished||{};
  let ch=false;
  for(const c of s.courts){
    if(c.active && Date.now()>=Number(c.active.endAt)){
      const a=c.active;
      s.finished[a.ticket]={...a,endedAt:Date.now()};
      c.active=null; ch=true;
    }
    if(!c.active && !c.blocked && (c.queue||[]).length){
      const x=c.queue.shift();
      const m=Number(s.settings[x.game]||15);
      const st=Date.now();
      c.active={...x,startAt:st,endAt:st+m*60000};
      ch=true;
    }
  }
  if(ch && doSave) await save(s);
  return s;
}

function route(){

  if(path==="/waiting" || path.endsWith("/waiting") || page==="waiting" || ticket) return "waiting";

}

function renderCustomer(s){
  const stats=document.getElementById("stats"), courts=document.getElementById("courts");
  if(!stats||!courts)return;

  const activeCount=s.courts.filter(c=>c.active).length;
  const waitingTeams=s.courts.reduce((n,c)=>n+(c.queue||[]).length,0);
  const waitingPeople=s.courts.reduce((n,c)=>n+(c.queue||[]).reduce((m,x)=>m+(Number(x.people)||1),0),0);

  stats.innerHTML=
    '<div class="stat">전체 코트<b>5 개</b></div>'+
    '<div class="stat">이용 중 코트<b>'+activeCount+' 개</b></div>'+
    '<div class="stat">대기 중 팀<b>'+waitingTeams+' 팀</b></div>'+
    '<div class="stat">전체 대기 인원<b>'+waitingPeople+' 명</b></div>';

  const minutesLeft=(endAt)=>{
    if(!endAt)return 0;
    return Math.max(0,Math.ceil((Number(endAt)-Date.now())/60000));
  };

  courts.innerHTML=s.courts.map((c,i)=>{
    const q=Array.isArray(c.queue)?c.queue:[];
    const a=c.active;
    const activeRemain=minutesLeft(a?.endAt);

    // 예상 대기시간 = 현재 이용 중인 남은 시간 + 앞선 대기팀의 게임시간

      const duration=Number(s.settings?.[x.game]||15);
      const expected=Math.max(0,accumulated);
      accumulated+=duration;
      return '<div class="qrow"><b>'+(j+1)+'</b><span>'+
        esc(x.nickname)+' · '+esc(x.game)+'</span><span>약 '+expected+'분 후 입장</span></div>';
    }).join('');

    let main;
    if(a){
      main=
        '<div class="row"><span class="label">닉네임</span><span class="val">'+esc(a.nickname)+'</span></div>'+
        '<div class="row"><span class="label">게임 방식</span><span class="val">'+esc(a.game)+'</span></div>'+
        '<div class="row"><span class="label">이용 시간</span><span class="val">'+tm(a.startAt)+' ~ '+tm(a.endAt)+'</span></div>'+
        '<div class="row"><span class="label">남은 시간</span><span class="val remain">'+left(a.endAt)+'</span></div>'+
        '<div class="row"><span class="label">예상 대기 시간</span><span class="val">약 '+(q.length?activeRemain:'0')+'분</span></div>';
    }else{
      main=
        '<div class="row"><span class="label">현재 대기 팀</span><span class="val">'+q.length+'팀</span></div>'+
        '<div class="row"><span class="label">예상 대기 시간</span><span class="val">'+(q.length?'약 '+(accumulated-(Number(s.settings?.[q[q.length-1]?.game]||15)))+'분':'0분')+'</span></div>';
    }

    return '<section class="court">'+
      '<div class="head"><span><span class="num" style="background:'+colors[i]+'">'+c.id+'</span>'+c.id+'번 코트</span>'+
      '<span class="badge" style="background:'+(c.blocked?'#d71920':a?colors[i]:'#718096')+'">'+
      (c.blocked?'사용 불가':a?'이용 중':'대기 중')+'</span></div>'+
      '<div class="body">'+main+
      '<div class="qbox"><div class="qtitle">'+c.id+'번 코트 대기 현황 · 총 '+q.length+'팀</div>'+
      (q.length?queueRows:'<div class="qrow" style="display:block;text-align:center;color:#718096">대기자가 없습니다.</div>')+
      '</div></div></section>';
  }).join('');
}

async function loadRegisterDuration(){
  const game=document.getElementById("g"), out=document.getElementById("duration");
  if(!game||!out)return;
  let timer=null;
  const sync=async()=>{
    try{
      const s=await get();
      out.textContent=(s.settings?.[game.value]||15)+"분";
    }catch(e){}
  };
  game.addEventListener("change",sync);
  await sync();
  timer=setInterval(sync,2000);
  window.addEventListener("beforeunload",()=>{if(timer)clearInterval(timer)},{once:true});
}

async function reg(){
  const btn=document.getElementById("regBtn"), ee=document.getElementById("e");
  const nn=document.getElementById("n").value.trim();
  const gg=document.getElementById("g").value;
  const id=Number(document.getElementById("c").value);
  const deviceId=getDeviceToken();

  const err=(msg)=>{
    ee.style.display="block";
    ee.textContent=msg;
    btn.disabled=false; btn.style.opacity="1";
  };

  if(!nn||!gg||!id){err("닉네임, 게임 방식, 코트를 모두 선택해주세요.");return}

  /* 같은 스마트폰의 5분 재등록 제한 */
  const cooldown=getCooldownUntil();
  if(cooldown>Date.now()){
    err("⚠️ 이미 등록했습니다. "+cooldownMessage(cooldown));
    return;
  }

  btn.disabled=true; btn.style.opacity=".65"; ee.style.display="none";

  try{
    let s=await get();
    if(!s || !Array.isArray(s.courts)) s=cloneDef();
    s.settings=s.settings||{"난타":15,"4인 복식":15,"2인 단식":15};
    s.max_per_court=Math.max(1,Math.min(20,Number(s.max_per_court||5)));
    s.finished=s.finished||{};

    /* 서버에 저장된 익명 기기 토큰으로 모든 코트의 중복 대기/이용 여부 검사 */
    const existing=findDeviceRegistration(s,deviceId);
    if(existing){
      err("⚠️ 이미 대기 등록되어 있습니다.\n기존 대기를 취소하거나 이용을 마친 후 다시 등록해주세요.");
      return;
    }

    const x=s.courts.find(v=>Number(v.id)===id);
    if(!x){err("선택한 코트를 찾을 수 없습니다.");return}
    if(x.blocked){err("현재 이용할 수 없는 코트입니다. 다른 코트를 선택해주세요.");return}

    x.queue=Array.isArray(x.queue)?x.queue:[];
    const total=x.queue.length+(x.active?1:0);
    if(total>=s.max_per_court){err("선택한 코트의 대기가 마감되었습니다.");return}

    const t=(crypto&&crypto.randomUUID)?crypto.randomUUID():
      ("T"+Date.now()+Math.random().toString(36).slice(2));

    /* QR에는 개인정보가 없고, 대기 데이터에도 익명 랜덤 토큰만 저장 */
    x.queue.push({
      ticket:t,
      nickname:nn,
      game:gg,
      court:id,
      createdAt:Date.now(),
      deviceId:deviceId
    });

    await advance(s,false);
    await save(s);

    /* 등록 성공 후 5분 동안 같은 브라우저의 재등록 차단 */
    setCooldown();

    location.replace(location.pathname+"?page=waiting&ticket="+encodeURIComponent(t));
  }catch(e){
    console.error(e);
    err(String(e?.message||e));
  }
}

function renderWaiting(s){
  const w=document.getElementById("w"); if(!w)return;
  let a=null,q=null,c=null,fin=s.finished?.[ticket];

  for(const x of s.courts){
    if(x.active?.ticket===ticket){a=x.active;c=x}
    const z=(x.queue||[]).find(y=>y.ticket===ticket);
    if(z){q=z;c=x}
  }

  /* 3번째 화면: 15분 종료 */
  if(fin){
    w.innerHTML=`
      <div style="font-size:11px;color:#1565ff;font-weight:800;text-align:center;margin-bottom:8px">
        ● 15분 경과 후 퇴장 (자동 안내)
      </div>
      <div class="doneScreen">
        <div class="doneIcon">✓</div>
        <h2>장군봉 체육관을<br>이용해주셔서<br>대단히 감사합니다!</h2>

      </div>`;
    return;
  }

  /* 현재 이용 중 - 기존 고객등록 화면은 그대로 두고 이 화면만 변경 */
  if(a){
    const remain=left(a.endAt);
    const duration=Math.max(1,Math.round((Number(a.endAt)-Number(a.startAt))/60000));

    w.innerHTML=`
      <div class="activeOnlyScreen">
        <div class="activeOnlyTitle">현재 이용 중</div>

        <div class="activeOnlyInfo">
          <div class="activeOnlyRow">
            <span>닉네임</span>
            <b>${esc(a.nickname)}</b>
          </div>

            <span>선택 코트</span>
            <b>${a.court}번 코트</b>

        </div>

        <div class="activeOnlyTimer">
          <div>남은 시간</div>
          <strong>${remain}</strong>
        </div>

        <div class="activeOnlyExitNotice">
          <strong>⚠ ${duration}분 후 자동 퇴장</strong>
          <span>이용 시간이 종료되면 자동으로 퇴장 처리됩니다.</span>
        </div>

        <button class="activeOnlyExit" onclick="leave()">퇴장하기</button>
      </div>`;
    return;
  }

  /* 2번째 화면: 대기 중 */
  if(q){
    const arr=c.queue||[];
    const pos=arr.findIndex(x=>x.ticket===ticket)+1;
    const duration=Number(s.settings[q.game]||15);
    let activeRemain=0;
    if(c.active && c.active.endAt){
      activeRemain=Math.max(0,Math.ceil((Number(c.active.endAt)-Date.now())/60000));
    }
    const expected=Math.max(0,activeRemain+(pos-1)*duration);
    const now=new Date();
    const eta=new Date(Date.now()+expected*60000);

    w.innerHTML=`
      <div style="font-size:11px;color:#1565ff;font-weight:800;text-align:center;margin-bottom:8px">
        ● 개선 화면 (해당 코트만 간결하게)
      </div>

        <div style="text-align:center;font-size:13px;font-weight:900;margin-bottom:10px">고객용 QR 스마트등록</div>
        <div style="text-align:center;font-size:10px;margin-bottom:12px">간편하게 코트 대기를 확인하세요.</div>

          <div class="my" style="margin-top:12px">
            <small>나의 순번</small>
            <strong>${pos}번</strong>
            <small>(현재 대기 중)</small>
          </div>

          <div style="display:flex;justify-content:space-between;font-size:11px;margin:10px 2px 4px">
            <span>착 ${now.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}</span>
            <span>종료 ${eta.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}</span>
          </div>

          <div style="text-align:center;font-size:11px;color:#333">남은 시간</div>
          <div class="timer" style="color:#07854b">${String(expected).padStart(2,"0")}:00</div>

          <div class="qbox">
            <div class="qtitle">${c.id}번 코트 대기 현황 (총 ${arr.length}팀)</div>
            <div class="qrow" style="font-weight:800"><span>순번</span><span>닉네임</span><span>예상 대기 시간</span></div>
            ${arr.map((x,i)=>{
              const wait=Math.max(0,activeRemain+i*duration);
              return `<div class="qrow"><b>${i+1}</b><span>${esc(x.nickname)}${x.ticket===ticket?' <b>(나)</b>':''}</span><span>약 ${wait}분 후 입장</span></div>`;
            }).join("")}
          </div>

          <button class="btn cancel" onclick="cancelWait()">예약 대기 취소</button>
        </div>
      </div>`;
    return;
  }

  w.innerHTML='대기 등록 정보가 없습니다.';

async function cancelWait(){

async function leave(){
  try{let s=await get();for(const c of s.courts)if(c.active?.ticket===ticket){s.finished=s.finished||{};s.finished[ticket]={...c.active,endedAt:Date.now()};c.active=null}await advance(s);await save(s)}catch(e){showError(e)}
}
async function finish(){
  try{let s=await get();if(s.finished)delete s.finished[ticket];await save(s);location.href="?page=register"}catch(e){showError(e)}
}

    if(!target) return;

    const buttons=[...wrap.querySelectorAll("button[data-game]")];
    function setActive(){
      const value=target.value || "4인 복식";
      buttons.forEach(b=>b.classList.toggle("active",b.dataset.game===value));
    }
    buttons.forEach(b=>{
      b.addEventListener("click",()=>{
        target.value=b.dataset.game;
        target.dispatchEvent(new Event("change",{bubbles:true}));
        setActive();
      });
    });
    setActive();
  }

})();
