<script>
const SB_HEADERS={"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY,"Content-Type":"application/json"};
async function sbGet(){
  const url=SUPABASE_URL+"/rest/v1/waiting_state?id=eq.waiting_state&select=*";
  const r=await fetch(url,{
    method:"GET",
    headers:{
      "apikey":SUPABASE_ANON_KEY,
      "Authorization":"Bearer "+SUPABASE_ANON_KEY,
      "Accept":"application/json"
    },
    cache:"no-store"
  });
  const text=await r.text();
  if(!r.ok) throw new Error("조회 오류 "+r.status+" : "+text);
  const rows=text?JSON.parse(text):[];
  return rows[0]||null;
}
async function sbUpsert(row){
  const payload={
    settings:row.settings||{"난타":15,"4인 복식":15,"2인 단식":15},
    max_per_court:Number(row.max_per_court||5),
    finished:row.finished||{},
    courts:Array.isArray(row.courts)?row.courts:[]
  };
  const url=SUPABASE_URL+"/rest/v1/waiting_state?id=eq.waiting_state";
  const r=await fetch(url,{
    method:"PATCH",
    headers:{
      "apikey":SUPABASE_ANON_KEY,
      "Authorization":"Bearer "+SUPABASE_ANON_KEY,
      "Content-Type":"application/json",
      "Accept":"application/json",
      "Prefer":"return=representation"
    },
    body:JSON.stringify(payload)
  });
  const text=await r.text();
  if(!r.ok) throw new Error("저장 오류 "+r.status+" : "+text);
  const rows=text?JSON.parse(text):[];
  if(!Array.isArray(rows)||rows.length===0)
    throw new Error("저장 오류 : waiting_state가 수정되지 않았습니다.");
  return true;
}const ROOT="waiting_state";
const params=new URLSearchParams(location.search);
const REGISTER_URL=location.origin+location.pathname+"?page=register";
const ticket=params.get("ticket")||"";
const colors=["#07854b","#1461e8","#6332d7","#ff7900","#e51e2a"];
const def={id:ROOT,settings:{"난타":15,"4인 복식":15,"2인 단식":15},max_per_court:5,finished:{},courts:[1,2,3,4,5].map(id=>({id,blocked:false,active:null,queue:[]}))};

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function tm(t){return new Date(t).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}
function left(t){let n=Math.max(0,Math.ceil((t-Date.now())/1000));return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")}
function cloneDef(){return JSON.parse(JSON.stringify(def))}
function showError(err){
  const msg=err?.message||String(err||"알 수 없는 오류");
  console.error("Supabase error:",err);
  const box=document.getElementById("app");
  if(box && !box.innerHTML.includes("장군봉 배드민턴")) {
    box.innerHTML='<div style="max-width:720px;margin:60px auto;padding:28px;font-family:Arial;text-align:center"><h2>장군봉 배드민턴 스마트 대기</h2><p>데이터 연결을 준비하는 중입니다.</p><small>'+esc(msg)+'</small></div>';
  }
}
async function get(){
  const data=await sbGet();
  return data?data:cloneDef();
}
async function save(s){
  await sbUpsert({
    id:ROOT,
    settings:s.settings,
    max_per_court:s.max_per_court,
    finished:s.finished||{},
    courts:s.courts
  });
}
async function ensure(){
  const data=await sbGet();
  if(!data) await save(cloneDef());
}
async function advance(s,doSave=true){
  s.finished=s.finished||{};
  let ch=false;
  for(const c of s.courts){
    if(c.active && Date.now()>=Number(c.active.endAt)){
      const a=c.active;
      s.finished[a.ticket]={...a,endedAt:Date.now()};
      c.active=null; ch=true;
    }
    if(!c.active && !c.blocked && (c.queue||[]).length){
      const x=c.queue.shift();
      const m=Number(s.settings[x.game]||15);
      const st=Date.now();
      c.active={...x,startAt:st,endAt:st+m*60000};
      ch=true;
    }
  }
  if(ch && doSave) await save(s);
  return s;
}
let liveTimer=null;
function sub(fn){
  if(liveTimer) clearInterval(liveTimer);
  const refresh=async()=>{try{fn(await advance(await get()))}catch(e){showError(e)}};
  refresh();
  liveTimer=setInterval(refresh,2000);
}

/* GitHub Pages compatible routing:
   /?page=register
   /?page=admin
   /?page=waiting&ticket=...
   Existing /register, /admin, /waiting paths are also supported. */
function route(){
  const path=location.pathname.replace(/\/+$/,"");
  const page=params.get("page")||"";
  if(path==="/admin" || path.endsWith("/admin") || page==="admin") return "admin";
  if(path==="/register" || path.endsWith("/register") || page==="register") return "register";
  if(path==="/waiting" || path.endsWith("/waiting") || page==="waiting" || ticket) return "waiting";
  return "customer";
}

  renderCustomer(cloneDef());
  sub(renderCustomer);
  setInterval(()=>{const el=document.getElementById("clock");if(el)el.textContent=new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})},1000);
}
function renderCustomer(s){
  const stats=document.getElementById("stats"), courts=document.getElementById("courts");
  if(!stats||!courts)return;
  let a=s.courts.filter(c=>c.active).length;
  let w=s.courts.reduce((n,c)=>n+(c.queue||[]).length,0);
  stats.innerHTML='<div class="stat">전체 코트<b>5 개</b></div><div class="stat">이용 중 코트<b>'+a+' 개</b></div><div class="stat">대기 중 팀<b>'+w+' 팀</b></div><div class="stat">전체 대기 인원<b>'+w+' 팀</b></div>';
  courts.innerHTML=s.courts.map((c,i)=>{
    let q=c.queue||[],a=c.active;
    return '<section class="court"><div class="head"><span><span class="num" style="background:'+colors[i]+'">'+c.id+'</span>'+c.id+'번 코트</span><span class="badge" style="background:'+(a?colors[i]:'#718096')+'">'+(c.blocked?'사용 불가':a?'이용 중':'대기 중')+'</span></div><div class="body">'+
    (a?'<div class="row"><span class="label">닉네임</span><span class="val">'+esc(a.nickname)+'</span></div><div class="row"><span class="label">게임 방식</span><span class="val">'+esc(a.game)+'</span></div><div class="row"><span class="label">이용 시간</span><span class="val">'+tm(a.startAt)+' ~ '+tm(a.endAt)+'</span></div><div class="row"><span class="label">남은 시간</span><span class="val remain">'+left(a.endAt)+'</span></div>':
    '<div class="row"><span class="label">현재 대기 팀</span><span class="val">'+q.length+'팀</span></div><div class="row"><span class="label">예상 대기 시간</span><span class="val">약 '+q.length*5+'분</span></div>')+
    '<div class="qbox"><div class="qtitle">'+c.id+'번 코트 대기 현황 (총 '+q.length+'팀)</div>'+q.map((x,j)=>'<div class="qrow"><b>'+(j+1)+'</b><span>'+esc(x.nickname)+'</span><span>'+esc(x.game)+'</span></div>').join('')+'</div></div></section>'
  }).join('');
}

async function loadRegisterDuration(){
  try{
    const s=await get();
    const game=document.getElementById("g"), out=document.getElementById("duration");
    if(!game||!out)return;
    const sync=()=>{out.textContent=(s.settings[game.value]||15)+"분"};
    game.addEventListener("change",sync); sync();
  }catch(e){}
}

async function reg(){
  const btn=document.getElementById("regBtn"), ee=document.getElementById("e");
  const nn=document.getElementById("n").value.trim();
  const gg=document.getElementById("g").value;
  const id=Number(document.getElementById("c").value);

  const err=(msg)=>{
    ee.style.display="block";
    ee.textContent=msg;
    btn.disabled=false; btn.style.opacity="1";
  };

  if(!nn||!gg||!id){err("닉네임, 게임 방식, 코트를 모두 선택해주세요.");return}
  btn.disabled=true; btn.style.opacity=".65"; ee.style.display="none";

  try{
    let s=await get();
    if(!s || !Array.isArray(s.courts)){
      s=cloneDef();
    }
    s.settings=s.settings||{"난타":15,"4인 복식":15,"2인 단식":15};
    s.max_per_court=Number(s.max_per_court||5);
    s.finished=s.finished||{};
    const x=s.courts.find(v=>Number(v.id)===id);

    if(!x){err("선택한 코트를 찾을 수 없습니다.");return}
    if(x.blocked){err("현재 이용할 수 없는 코트입니다. 다른 코트를 선택해주세요.");return}

    x.queue=Array.isArray(x.queue)?x.queue:[];
    const total=x.queue.length+(x.active?1:0);
    if(total>=s.max_per_court){err("선택한 코트의 대기가 마감되었습니다.");return}

    let t=(crypto&&crypto.randomUUID)?crypto.randomUUID():("T"+Date.now()+Math.random().toString(36).slice(2));
    x.queue.push({ticket:t,nickname:nn,game:gg,court:id,createdAt:Date.now()});

    // Normalize and start the first waiting customer if the court is empty.
    await advance(s,false);
    await save(s);

    location.replace(location.pathname+"?page=waiting&ticket="+encodeURIComponent(t));
  }catch(e){
    console.error(e);
    const msg=String(e?.message||e);
    err(msg);
  }
}

  renderWaiting(cloneDef());
  sub(renderWaiting);
}
function renderWaiting(s){
  const w=document.getElementById("w"); if(!w)return;
  let a=null,q=null,c=null,fin=s.finished?.[ticket];

  for(const x of s.courts){
    if(x.active?.ticket===ticket){a=x.active;c=x}
    const z=(x.queue||[]).find(y=>y.ticket===ticket);
    if(z){q=z;c=x}
  }

  /* 3번째 화면: 15분 종료 */
  if(fin){
    w.innerHTML=`
      <div style="font-size:11px;color:#1565ff;font-weight:800;text-align:center;margin-bottom:8px">
        ● 15분 경과 후 퇴장 (자동 안내)

      <div class="doneScreen">
        <div class="doneIcon">✓</div>
        <h2>장군봉 체육관을<br>이용해주셔서<br>대단히 감사합니다!</h2>
        <p>이용 시간이 종료되었습니다.<br>다음 고객을 위해<br>퇴장 버튼을 눌러주세요.</p>
        <div class="notice">퇴장을 눌러야<br>다시 이용 가능합니다.</div>
        <button class="btn" onclick="finish()">퇴장하기</button>
      </div>
      <div style="font-size:10px;color:#777;text-align:center;margin-top:8px">
        ※ 퇴장 버튼을 눌러야 다음 대기자가 이용을 시작합니다.
      </div>`;
    return;
  }

  /* 현재 이용 중 */
  if(a){
    const remain=left(a.endAt);
    w.innerHTML=`
      <div style="font-size:11px;color:#1565ff;font-weight:800;text-align:center;margin-bottom:8px">
        ● 15분 경과 후 퇴장 (자동 안내)
      </div>
      <div class="doneScreen" style="background:#061b4f;text-align:left">
        <div style="text-align:center;font-size:12px;font-weight:800;margin-bottom:12px">장군봉 배드민턴 스마트 대기</div>
        <div class="row"><span style="color:#fff">닉네임</span><b style="color:#fff">${esc(a.nickname)}</b></div>
        <div class="row"><span style="color:#fff">선택 코트</span><b style="color:#fff">${a.court}번 코트</b></div>
        <div class="row"><span style="color:#fff">이용 시간</span><b style="color:#fff">${tm(a.startAt)} ~ ${tm(a.endAt)}</b></div>
        <div class="my">
          <small>현재 이용 중</small>
          <strong>${esc(a.nickname)}</strong>
          <small>남은 시간</small>
        </div>
        <div class="timer" style="color:#fff">${remain}</div>
        <button class="btn cancel" onclick="leave()">퇴장하기</button>
      </div>`;
    return;
  }

  /* 2번째 화면: 대기 중 */
  if(q){
    const arr=c.queue||[];
    const pos=arr.findIndex(x=>x.ticket===ticket)+1;
    const duration=Number(s.settings[q.game]||15);
    let activeRemain=0;
    if(c.active && c.active.endAt){
      activeRemain=Math.max(0,Math.ceil((Number(c.active.endAt)-Date.now())/60000));
    }
    const expected=Math.max(0,activeRemain+(pos-1)*duration);
    const now=new Date();
    const eta=new Date(Date.now()+expected*60000);

    w.innerHTML=`
      <div style="font-size:11px;color:#1565ff;font-weight:800;text-align:center;margin-bottom:8px">
        ● 개선 화면 (해당 코트만 간결하게)
      </div>
      <div class="doneScreen" style="padding:12px 14px;background:#061b4f;text-align:left">
        <div style="text-align:center;font-size:13px;font-weight:900;margin-bottom:10px">장군봉 배드민턴 스마트 대기</div>
        <div style="text-align:center;font-size:10px;margin-bottom:12px">간편하게 코트 대기를 확인하세요.</div>

        <div style="background:#fff;color:#071633;border-radius:12px;padding:12px">
          <div style="font-size:13px;font-weight:900;margin-bottom:8px">내 대기 정보</div>
          <div class="row"><span>닉네임</span><b>${esc(q.nickname)}</b></div>
          <div class="row"><span>선택 코트</span><b>${q.court}번 코트</b></div>
          <div class="row"><span>이용 시간</span><b>${duration}분</b></div>

          <div class="my" style="margin-top:12px">
            <small>나의 순번</small>
            <strong>${pos}번</strong>
            <small>(현재 대기 중)</small>
          </div>

          <div style="display:flex;justify-content:space-between;font-size:11px;margin:10px 2px 4px">
            <span>착 ${now.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}</span>
            <span>종료 ${eta.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}</span>
          </div>

          <div style="text-align:center;font-size:11px;color:#333">남은 시간</div>
          <div class="timer" style="color:#07854b">${String(expected).padStart(2,"0")}:00</div>

          <div class="qbox">
            <div class="qtitle">${c.id}번 코트 대기 현황 (총 ${arr.length}팀)</div>
            <div class="qrow" style="font-weight:800"><span>순번</span><span>닉네임</span><span>예상 대기 시간</span></div>
            ${arr.map((x,i)=>{
              const wait=Math.max(0,activeRemain+i*duration);
              return `<div class="qrow"><b>${i+1}</b><span>${esc(x.nickname)}${x.ticket===ticket?' <b>(나)</b>':''}</span><span>약 ${wait}분 후 입장</span></div>`;
            }).join("")}
          </div>

          <button class="btn cancel" onclick="cancelWait()">예약 대기 취소</button>
        </div>
      </div>`;
    return;
  }

  w.innerHTML='대기 등록 정보가 없습니다.';
}
async function cancelWait(){
  try{let s=await get();for(const c of s.courts)c.queue=(c.queue||[]).filter(x=>x.ticket!==ticket);await save(s);location.href="?page=register"}catch(e){showError(e)}
}
async function leave(){
  try{let s=await get();for(const c of s.courts)if(c.active?.ticket===ticket){s.finished=s.finished||{};s.finished[ticket]={...c.active,endedAt:Date.now()};c.active=null}await advance(s);await save(s)}catch(e){showError(e)}
}
async function finish(){
  try{let s=await get();if(s.finished)delete s.finished[ticket];await save(s);location.href="?page=register"}catch(e){showError(e)}
}

function admin(){
  const app=document.getElementById("app");
  app.innerHTML=`<header class="header"><div><div class="brand">장군봉 배드민턴 관리자</div><div class="sub">스마트 대기 관리 시스템</div></div><div class="adminTop"><a href="?page=customer">고객 화면으로</a></div></header><div class="admin"><aside class="side"><h2>관리자 모드</h2><div class="nav on">코트 관리</div><div class="nav">게임 시간 설정</div><div class="nav">대기 정원 설정</div></aside><main class="main"><section class="panel"><div class="adminSectionTitle"><div><h2>코트 관리</h2><div class="hint">사용하지 않을 코트는 잠금할 수 있습니다.</div></div></div><div class="lockGrid" id="cs"></div></section><section class="panel"><div class="adminSectionTitle"><div><h2>게임 시간 설정</h2><div class="hint">기본 15분 · 1분씩 조절 · 최대 20분</div></div></div><div class="controlRow"><div class="controlBox"><h3>4인 복식</h3><div class="stepper"><button onclick="changeTime('4인 복식',-1)">−</button><strong id="g2">15</strong><span>분</span><button onclick="changeTime('4인 복식',1)">+</button></div></div><div class="controlBox"><h3>2인 단식</h3><div class="stepper"><button onclick="changeTime('2인 단식',-1)">−</button><strong id="g3">15</strong><span>분</span><button onclick="changeTime('2인 단식',1)">+</button></div></div><div class="controlBox"><h3>난타</h3><div class="stepper"><button onclick="changeTime('난타',-1)">−</button><strong id="g1">15</strong><span>분</span><button onclick="changeTime('난타',1)">+</button></div></div></div></section><section class="panel"><div class="adminSectionTitle"><div><h2>대기자 최대 정원</h2><div class="hint">전체 코트에 동일하게 적용 · 4명~20명</div></div></div><div class="controlBox"><div class="stepper"><button onclick="changeMax(-1)">−</button><strong id="mx">5</strong><span>명</span><button onclick="changeMax(1)">+</button></div></div><button class="save adminSave" onclick="saveAdmin()">변경사항 저장</button></section><section class="panel adminTable"><h2>현재 대기 현황</h2><div class="grid" id="qq"></div></section></main></div>`;
  renderAdmin(cloneDef()); sub(renderAdmin);
}
function renderAdmin(s){
  const g1=document.getElementById("g1"),g2=document.getElementById("g2"),g3=document.getElementById("g3"),mx=document.getElementById("mx"),cs=document.getElementById("cs"),qq=document.getElementById("qq");
  if(!g1||!g2||!g3||!mx||!cs||!qq)return;
  g1.textContent=s.settings["난타"];g2.textContent=s.settings["4인 복식"];g3.textContent=s.settings["2인 단식"];mx.textContent=s.max_per_court;
  cs.innerHTML=s.courts.map(c=>'<div class="lockCard"><h3>'+c.id+'번 코트</h3><p>'+(c.blocked?'현재 잠금':'현재 사용 가능')+'</p><button class="'+(c.blocked?'locked':'open')+'" onclick="block('+c.id+','+(!c.blocked)+')">'+(c.blocked?'잠금 해제':'코트 잠금')+'</button></div>').join('');
  qq.innerHTML=s.courts.map(c=>'<div class="card"><h3>'+c.id+'번 코트</h3>'+(c.active?'<p>이용 중: '+esc(c.active.nickname)+' <button class="smallbtn" onclick="force('+c.id+')">강제 퇴장</button></p>':'<p>이용 중 없음</p>')+(c.queue||[]).map((x,i)=>'<p>'+String(i+1)+'. '+esc(x.nickname)+' / '+esc(x.game)+'</p>').join('')+'</div>').join('');
}
function changeTime(game,delta){
  const el=game==="난타"?document.getElementById("g1"):game==="4인 복식"?document.getElementById("g2"):document.getElementById("g3");
  if(!el)return;
  const v=Math.max(15,Math.min(20,Number(el.textContent||15)+delta));
  el.textContent=v;
}
function changeMax(delta){
  const el=document.getElementById("mx"); if(!el)return;
  el.textContent=Math.max(4,Math.min(20,Number(el.textContent||5)+delta));
}
async function saveAdmin(){
  try{
    let s=await get();
    s.settings["난타"]=Math.max(15,Math.min(20,Number(document.getElementById("g1").textContent)));
    s.settings["4인 복식"]=Math.max(15,Math.min(20,Number(document.getElementById("g2").textContent)));
    s.settings["2인 단식"]=Math.max(15,Math.min(20,Number(document.getElementById("g3").textContent)));
    s.max_per_court=Math.max(4,Math.min(20,Number(document.getElementById("mx").textContent)));
    await save(s);
    alert("변경사항이 저장되었습니다.");
  }catch(e){showError(e)}
}
async function block(id,b){
  try{
    let s=await get();
    s.courts.find(c=>c.id===id).blocked=b;
    await save(s);
  }catch(e){showError(e)}
}
async function force(id){
  try{
    let s=await get(),c=s.courts.find(c=>c.id===id);
    if(c.active){s.finished=s.finished||{};s.finished[c.active.ticket]={...c.active,endedAt:Date.now()};c.active=null}
    await advance(s); await save(s);
  }catch(e){showError(e)}
}

(function(){
  const r=route();
  if(r==="admin")admin();
  else if(r==="register")register();
  else if(r==="waiting")waiting();
  else customer();
  ensure().catch(e=>console.error(e));
})();
</script></body></html>
