<style id="adminPolish">
/* 관리자 화면 정리용 디자인 - 기능/동작은 변경하지 않음 */
.admin{
  min-height:calc(100vh - 72px);
  background:#f3f6fa;
  display:grid;
  grid-template-columns:150px 1fr;
}
.side{
  background:#071b45;
  padding:22px 10px;
  position:sticky;
  top:0;
  height:calc(100vh - 72px);
  box-sizing:border-box;
}
.side h2{
  font-size:15px;
  margin:0 0 16px;
  padding:8px 10px;
  color:#fff;
}
.nav{
  padding:13px 12px;
  margin:5px 0;
  border-radius:8px;
  font-size:14px;
  transition:.15s;
}
.nav.on{background:#1466e8}
.nav:hover{background:#123b7f}
.main{
  padding:20px 22px 35px;
  max-width:1700px;
  width:100%;
  box-sizing:border-box;
}
.panel{
  background:#fff;
  border:1px solid #dbe3ee;
  border-radius:12px;
  margin-bottom:14px;
  padding:18px;
  box-shadow:0 2px 8px rgba(18,38,70,.05);
}
.panel h2{
  font-size:20px;
  margin:0 0 5px;
  color:#10244b;
}
.hint{color:#718096;font-size:12px}
.lockGrid,.controlRow,.grid{
  gap:10px;
}
.lockCard{
  border:1px solid #dce4ee;
  border-radius:10px;
  background:#fbfcfe;
  padding:14px;
  box-shadow:none;
}
.lockCard h3{
  font-size:17px;
  margin:0 0 8px;
}
.lockCard p{
  color:#64748b;
  margin:5px 0 12px;
  font-size:12px;
}
.lockCard button{
  width:100%;
  min-height:38px;
  border-radius:7px;
  font-weight:900;
}
.controlBox{
  background:#fbfcfe;
  border:1px solid #dce4ee;
  border-radius:10px;
  padding:16px;
}
.controlBox h3{
  margin:0 0 12px;
  font-size:16px;
}
.stepper{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}
.stepper button{
  width:38px;
  height:36px;
  border-radius:7px;
  font-size:18px;
  font-weight:900;
}
.stepper strong{
  min-width:38px;
  text-align:center;
  font-size:21px;
}
.adminSave{
  margin-top:13px;
  min-width:130px;
}
.adminTable .grid{
  align-items:stretch;
}
.adminTable .card{
  min-height:145px;
  background:#fbfcfe;
  border:1px solid #d9e2ee;
  border-radius:10px;
  padding:13px;
  box-sizing:border-box;
}
.adminTable .card h3{
  font-size:16px;
  color:#10244b;
  padding-bottom:9px;
  margin-bottom:8px;
  border-bottom:1px solid #e6ebf2;
}
.adminTable .card p{
  margin:7px 0;
  font-size:12px;
  line-height:1.5;
}
.adminTable .card p:first-of-type{
  background:#eef4ff;
  border-radius:7px;
  padding:8px;
  font-weight:800;
}
.adminTable .smallbtn{
  float:right;
  background:#e53935;
  color:#fff;
  border:0;
  border-radius:6px;
  padding:6px 9px;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
}
.adminTable .smallbtn:hover{background:#c62828}
.adminTop a{
  background:#1466e8;
  border-radius:7px;
  padding:9px 15px;
  font-weight:900;
}
@media(max-width:950px){
  .admin{grid-template-columns:1fr}
  .side{position:relative;height:auto}
  .main{padding:14px}
  .grid{grid-template-columns:repeat(2,1fr)}
}
</style>

function getDeviceToken(){
  try{
    let v=localStorage.getItem(DEVICE_KEY);
    if(!v){
      v=(crypto&&crypto.randomUUID)?crypto.randomUUID():
        ("D"+Date.now()+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2));
      localStorage.setItem(DEVICE_KEY,v);
    }
    return v;
  }catch(e){
    return (crypto&&crypto.randomUUID)?crypto.randomUUID():
      ("D"+Date.now()+Math.random().toString(36).slice(2));
  }
}
function getCooldownUntil(){
  try{return Number(localStorage.getItem(COOLDOWN_KEY)||0)}catch(e){return 0}
}
function setCooldown(minutes){
  const ms=Math.max(1,Math.min(20,Number(minutes||5)))*60*1000;
  try{localStorage.setItem(COOLDOWN_KEY,String(Date.now()+ms))}catch(e){}
}
function clearCooldown(){
  try{localStorage.removeItem(COOLDOWN_KEY)}catch(e){}
}
function cooldownMessage(until){
  const leftMs=Math.max(0,until-Date.now());
  const m=Math.ceil(leftMs/60000);
  return m<=1 ? "잠시 후 다시 등록할 수 있습니다." : m+"분 후 다시 등록할 수 있습니다.";
}
function findDeviceRegistration(s,deviceId){
  for(const c of (s.courts||[])){
    if(c.active?.deviceId===deviceId) return {type:"active",court:c,entry:c.active};

async function loadRegisterDuration(){
  const game=document.getElementById("g"), out=document.getElementById("duration");
  if(!game||!out)return;
  let timer=null;
  const sync=async()=>{
    try{
      const s=await get();
      out.textContent=(s.settings?.[game.value]||15)+"분";
      const cm=document.getElementById("cooldownMinutes");
      if(cm) cm.textContent=(Number(s.re_register_minutes)||5)+"분";
    }catch(e){}
  };
  game.addEventListener("change",sync);
  await sync();
  timer=setInterval(sync,2000);
  window.addEventListener("beforeunload",()=>{if(timer)clearInterval(timer)},{once:true});
}

async function reg(){
  const btn=document.getElementById("regBtn"), ee=document.getElementById("e");
  const nn=document.getElementById("n").value.trim();
  const gg=document.getElementById("g").value;
  const id=Number(document.getElementById("c").value);
  const deviceId=getDeviceToken();

  const err=(msg)=>{
    ee.style.display="block";
    ee.textContent=msg;
    btn.disabled=false; btn.style.opacity="1";
  };

  if(!nn||!gg||!id){err("닉네임, 게임 방식, 코트를 모두 선택해주세요.");return}

  /* 같은 스마트폰의 5분 재등록 제한 */
  const cooldown=getCooldownUntil();
  if(cooldown>Date.now()){
    err("⚠️ 이미 등록했습니다. "+cooldownMessage(cooldown));
    return;
  }

  btn.disabled=true; btn.style.opacity=".65"; ee.style.display="none";

  try{
    let s=await get();
    if(!s || !Array.isArray(s.courts)) s=cloneDef();
    s.settings=s.settings||{"난타":15,"4인 복식":15,"2인 단식":15};
    s.max_per_court=Math.max(1,Math.min(20,Number(s.max_per_court||5)));
    s.re_register_minutes=Math.max(1,Math.min(20,Number(s.re_register_minutes||5)));
    s.finished=s.finished||{};

    /* 서버에 저장된 익명 기기 토큰으로 모든 코트의 중복 대기/이용 여부 검사 */
    const existing=findDeviceRegistration(s,deviceId);
    if(existing){
      err("⚠️ 이미 대기 등록되어 있습니다.\n기존 대기를 취소하거나 이용을 마친 후 다시 등록해주세요.");
      return;
    }

    const x=s.courts.find(v=>Number(v.id)===id);
    if(!x){err("선택한 코트를 찾을 수 없습니다.");return}
    if(x.blocked){err("현재 이용할 수 없는 코트입니다. 다른 코트를 선택해주세요.");return}

    x.queue=Array.isArray(x.queue)?x.queue:[];
    const total=x.queue.length+(x.active?1:0);
    if(total>=s.max_per_court){err("선택한 코트의 대기가 마감되었습니다.");return}

    const t=(crypto&&crypto.randomUUID)?crypto.randomUUID():
      ("T"+Date.now()+Math.random().toString(36).slice(2));

    /* QR에는 개인정보가 없고, 대기 데이터에도 익명 랜덤 토큰만 저장 */
    x.queue.push({
      ticket:t,
      nickname:nn,
      game:gg,
      court:id,
      createdAt:Date.now(),
      deviceId:deviceId
    });

    await advance(s,false);
    await save(s);

    /* 등록 성공 후 관리자에서 설정한 시간 동안 같은 브라우저의 재등록 차단 */
    setCooldown(Number(s.re_register_minutes)||5);

    location.replace(location.pathname+"?page=waiting&ticket="+encodeURIComponent(t));
  }catch(e){
    console.error(e);
    err(String(e?.message||e));
  }
}

async function cancelWait(){
  try{let s=await get();for(const c of s.courts)c.queue=(c.queue||[]).filter(x=>x.ticket!==ticket);await save(s);location.href="?page=register"}catch(e){showError(e)}
}
async function leave(){
  try{let s=await get();for(const c of s.courts)if(c.active?.ticket===ticket){s.finished=s.finished||{};s.finished[ticket]={...c.active,endedAt:Date.now()};c.active=null}await advance(s);await save(s)}catch(e){showError(e)}
}
async function finish(){
  try{let s=await get();if(s.finished)delete s.finished[ticket];await save(s);location.href="?page=register"}catch(e){showError(e)}
}

  cs.innerHTML=s.courts.map(c=>'<div class="lockCard"><h3>'+c.id+'번 코트</h3><p>'+(c.blocked?'현재 잠금':'현재 사용 가능')+'</p><button class="'+(c.blocked?'locked':'open')+'" onclick="block('+c.id+','+(!c.blocked)+')">'+(c.blocked?'잠금 해제':'코트 잠금')+'</button></div>').join('');
  qq.innerHTML=s.courts.map(c=>'<div class="card"><h3>'+c.id+'번 코트</h3>'+(c.active?'<p>이용 중: '+esc(c.active.nickname)+' <button class="smallbtn" onclick="force('+c.id+')">강제 퇴장</button></p>':'<p>이용 중 없음</p>')+(c.queue||[]).map((x,i)=>'<p>'+String(i+1)+'. '+esc(x.nickname)+' / '+esc(x.game)+'</p>').join('')+'</div>').join('');
}
async function changeTime(game,delta){
  const el=game==="난타"?document.getElementById("g1"):game==="4인 복식"?document.getElementById("g2"):document.getElementById("g3");
  if(!el)return;
  const v=Math.max(1,Math.min(20,Number(el.textContent||15)+delta));
  el.textContent=v;
  try{
    const s=await get();
    s.settings=s.settings||{"난타":15,"4인 복식":15,"2인 단식":15};
    s.settings[game]=v;
    await save(s);
  }catch(e){showError(e)}
}
function changeMax(delta){
  const el=document.getElementById("mx"); if(!el)return;
  el.textContent=Math.max(1,Math.min(20,Number(el.textContent||5)+delta));
}
function changeCooldown(delta){
  const el=document.getElementById("rc"); if(!el)return;
  el.textContent=Math.max(1,Math.min(20,Number(el.textContent||5)+delta));
}
async function saveAdmin(){
  try{
    let s=await get();
    const reRegisterMinutes=Math.max(1,Math.min(20,Number(document.getElementById("rc").textContent||5)));
    s.settings=s.settings||{"난타":15,"4인 복식":15,"2인 단식":15};
    s.settings["난타"]=Math.max(1,Math.min(20,Number(document.getElementById("g1").textContent||15)));
    s.settings["4인 복식"]=Math.max(1,Math.min(20,Number(document.getElementById("g2").textContent||15)));
    s.settings["2인 단식"]=Math.max(1,Math.min(20,Number(document.getElementById("g3").textContent||15)));
    s.max_per_court=Math.max(1,Math.min(20,Number(document.getElementById("mx").textContent||5)));
    s.re_register_minutes=reRegisterMinutes;

    // 게임시간/정원과 함께 재등록 제한시간도 waiting_state에 확실히 저장
    await save(s);

    // 저장 직후 DB에서 다시 읽어 화면을 갱신하여 5분으로 되돌아가는 현상 방지
    const saved=await get();
    renderAdmin(saved);
    alert("변경사항이 저장되었습니다. 재등록 제한시간: "+(Number(saved.re_register_minutes)||5)+"분");
  }catch(e){showError(e)}
}
async function block(id,b){
  try{
    let s=await get();
    s.courts.find(c=>c.id===id).blocked=b;
    await save(s);
  }catch(e){showError(e)}
}
async function force(id){
  try{
    let s=await get(),c=s.courts.find(c=>c.id===id);
    if(c.active){s.finished=s.finished||{};s.finished[c.active.ticket]={...c.active,endedAt:Date.now()};c.active=null}
    await advance(s); await save(s);
  }catch(e){showError(e)}
}


function management(){
  const view=params.get("view")||"display";
  if(view==="admin"){
    admin();
    const top=document.querySelector('.adminTop');
    if(top){
      const links=top.querySelectorAll('a');
      if(links[0]){links[0].href='?page=management&view=display';links[0].textContent='고객용';links[0].style.display='inline-flex';}
      if(links[1]){links[1].href='?page=register';links[1].textContent='QR 등록';}
    }
  }else{
    customer();
    const top=document.querySelector('.header > div:last-child');
    if(top){
      const a=top.querySelector('a.customerAdminBtn');
      if(a){a.href='?page=management&view=admin';a.textContent='관리자';a.style.display='inline-flex';}
    }
  }
}

(function(){

  if(r==="management")management();
  else if(r==="admin")admin();
  else if(r==="register")register();

})();

<script>

  };

  function initManagementView(){

    if(!mp)return;

    switchManagementView(view==="admin"?"admin":"display");
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",initManagementView);
  }else{
    initManagementView();
  }
})();
</script>
