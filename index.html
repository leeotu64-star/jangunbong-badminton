function scheduleValues(date){
  if(db.schedule && Array.isArray(db.schedule[date])) return db.schedule[date];
  const m=date.slice(0,7), day=Number(date.slice(8,10));
  if(m==="2026-09" && day>=1 && day<=30) return SEPT_2026[day-1];
  return null;
}
function workersForDate(date){
  const vals=scheduleValues(date)||[];
  return workers.map((w,i)=>{const st=vals[i]||"";return {...w,status:st||"편성없음",working:!!st&&!offWords.some(x=>st.includes(x))&&st!=="-"}});

function monthWorkingDays(wid, month){
  let n=0; const y=Number(month.slice(0,4)), m=Number(month.slice(5,7));
  const days=new Date(y,m,0).getDate();
  const limit=month===monthKey()?Number(selectedDate.slice(8,10)):days;
  for(let d=1;d<=Math.min(days,limit);d++){
    const date=month+"-"+String(d).padStart(2,"0"), w=workersForDate(date).find(x=>x.id===wid);
    if(w&&w.working)n++;
  }
  return n;
}
function completedBasicDays(wid, month){
  let n=0; const y=Number(month.slice(0,4)), m=Number(month.slice(5,7));
  const days=new Date(y,m,0).getDate();
  const limit=month===monthKey()?Number(selectedDate.slice(8,10)):days;
  for(let d=1;d<=Math.min(days,limit);d++){
    const date=month+"-"+String(d).padStart(2,"0"), w=workersForDate(date).find(x=>x.id===wid);
    if(w&&w.working){const k=date+"_"+wid, t=db.tasks[k]; if(t&&t.done&&t.done.length===10)n++;}
  }

}

function tasksFor(wid){
 const k=dateKey()+"_"+wid;
 if(!db.tasks||typeof db.tasks!=="object")db.tasks={};
 if(!db.tasks[k]||typeof db.tasks[k]!=="object")db.tasks[k]={done:[],updatedAt:null};
 if(!Array.isArray(db.tasks[k].done))db.tasks[k].done=[];
 return db.tasks[k];
}
async function syncBasicTasks(){
 if(!SUPA)return;
 try{
  const {data,error}=await SUPA.from("basic_tasks").select("*");
  if(error)throw error;
  const t={};
  (data||[]).forEach(r=>{
   const k=String(r.work_date||"")+"_"+String(r.worker_id||"");
   if(!t[k])t[k]={done:[],updatedAt:null};
   const name=taskDisplayName(r.task_name)||String(r.task_name||"");
   if(name && tasks.includes(name) && !t[k].done.includes(name))t[k].done.push(name);
   t[k].updatedAt=r.completed_at||null;
  });
  db.tasks=t;
  localStorage.setItem(KEY,JSON.stringify(db));
 }catch(e){console.warn("기본업무 동기화 실패",e)}
}

function withActionMarker(content,type){const base=String(content||'').replace(/\s*\[\[처리구분:(?:자체조치|외부용역)\]\]/g,'').trim();return type?base+' [[처리구분:'+type+']]':base}

function actionNoteFromIssue(x){const m=String(x?.content||'').match(/\[\[조치내용:([\s\S]*?)\]\]/);return m?m[1].trim():''}

function withWorkMarkers(content,type,note){let base=cleanReporterContent(String(content||'').replace(/\s*\[\[처리구분:(?:자체조치|외부용역)\]\]/g,'').replace(/\s*\[\[조치내용:[\s\S]*?\]\]/g,'').trim());if(type)base+=' [[처리구분:'+type+']]';if(note)base+=' [[조치내용:'+String(note).replace(/\]\]/g,'')+']]';return base}

async function saveWorkProcessing(id,btn){
 const x=(db.issues||[]).find(i=>i.id===id); const sel=document.getElementById('action_'+id); const type=sel?.value||''; const note=(document.getElementById('note_'+id)?.value||'').trim();

function eamPick(cat,code){
  const listBox=document.getElementById('eamproGrid');
  const previousScroll=listBox?listBox.scrollTop:0;
  const previousCategory=window.__eamCat||"";
  window.__eamCat=cat||"cooling";
  if(code!==undefined && code!==null) window.__eamSelCode=String(code);
  else window.__eamSelCode="";
  render();
  requestAnimationFrame(()=>{
    const box=document.getElementById('eamproGrid');
    if(!box)return;
    // 같은 설비 종류에서 선택할 때는 기존 스크롤 위치를 유지하고,
    // 선택한 자산이 화면 밖이면 해당 카드만 자동으로 보이게 합니다.
    if(previousCategory===window.__eamCat) box.scrollTop=previousScroll;
    const selected=box.querySelector('.eam-asset-row.on');
    if(selected){
      const top=selected.offsetTop;
      const bottom=top+selected.offsetHeight;
      const viewTop=box.scrollTop;
      const viewBottom=viewTop+box.clientHeight;
      if(top<viewTop) box.scrollTop=Math.max(0,top-8);
      else if(bottom>viewBottom) box.scrollTop=Math.max(0,bottom-box.clientHeight+8);
    }
  });
}

   EAM FINAL UI / REAL ASSET ONLY
   - Existing source assets only
   - No arbitrary/demo asset creation
   - Duplicate codes removed
   - OT-04~06 are maintenance/repair records, not assets
   - EQ-06, FI-03, FI-08 excluded per prior de-dup decisions

async function eamLoad(){
  window.__eamA=window.__eamA||[];window.__eamH=window.__eamH||[];window.__eamI=window.__eamI||[];
  if(!SUPA)return;
  try{
    const [a,h,i]=await Promise.all([
      SUPA.from("assets").select("*").order("name"),
      SUPA.from("asset_history").select("*").order("event_date",{ascending:false}),
      SUPA.from("inspections").select("*").order("inspection_date",{ascending:false})
    ]);
    if(a.error)throw a.error;
    window.__eamA=a.data||[]; window.__eamH=h.data||[]; window.__eamI=i.data||[];
    const meta={};
    (window.__eamH||[]).forEach(h=>{
      if(h.event_type!=='자산정보수정'||!h.description)return;
      try{ const m=JSON.parse(String(h.description).replace(/^META::/,'')); if(m&&m.asset_code&&!meta[m.asset_code]) meta[m.asset_code]=m; }catch(e){}
    });
    window.__eamMetaByCode=meta;
  }catch(e){console.warn("EAM 동기화 실패",e)}
}

function eamSourceAssets(){
  const main=Array.isArray(JGB_MAIN_EQUIPMENT)?JGB_MAIN_EQUIPMENT:[];
  const excel=Array.isArray(JGB_EXCEL_EQUIPMENT)?JGB_EXCEL_EQUIPMENT:[];
  const rows=[...main,...excel]
    .filter(x=>x && x.code)
    .filter(x=>!["OT-04","OT-05","OT-06"].includes(String(x.code)))
    .map(x=>({
      code:String(x.code),
      name:String(x.name||"-"),
      type:String(x.type||"기타설비"),
      place:String(String(x.type||"").includes('소방')?'유수장치실':(x.place||"-")),
      model:String(x.model||x.capacity||"-"),
      qty:x.quantity??x.quantity??"-",
      vendor:String(x.vendor||x.maker||"-"),
      asContact:String(x.asContact||x.contact||"-"),
      installDate:String(x.installDate||x.date||"-"),
      warranty:String(x.warranty||"-"),
      asHistory:String(x.asHistory||"-"),
      note:String(x.note||"-"),
      photo:x.photo||null
    }));
  const map=new Map();
  rows.forEach(x=>{ if(!map.has(x.code)) map.set(x.code,x); });
  return [...map.values()];
}
function eamDisplayName(x){
  const code=String(x?.code||"");
  const name=String(x?.name||"").trim();
  if(code.startsWith("FI-")){
    // 화면 표시는 원본 자산자료의 실제 소분류(모델/세부명칭)를 우선 사용합니다.
    // DB 등록값에 model이 비어 있어도 원본 JGB_EXCEL_EQUIPMENT에서 다시 찾아 표시합니다.
    const src=Array.isArray(JGB_EXCEL_EQUIPMENT)?JGB_EXCEL_EQUIPMENT.find(v=>String(v.code)===code):null;
    const detail=String(x?.model||src?.model||"").trim();
    if(detail && detail!=="-") return detail;
    return name||String(src?.name||"소방설비").trim()||"소방설비";
  }
  return name||"-";
}
function eamDisplaySubName(x){
  const code=String(x?.code||"");
  if(code.startsWith("FI-")){
    const src=Array.isArray(JGB_EXCEL_EQUIPMENT)?JGB_EXCEL_EQUIPMENT.find(v=>String(v.code)===code):null;
    const detail=String(x?.model||src?.model||"").trim();
    return detail && detail!=="-" ? "소분류 · "+detail : "소분류 · 소방설비";
  }
  return "소분류 · "+eamDisplayName(x);
}
function eamSourceCategory(x){
  const t=String(x.type||"");
  if(t.includes("냉난방")) return "cooling";
  if(t.includes("소방")) return "fire";
  if(t.includes("온수")||t.includes("보일러")||t.includes("난방")) return "water";
  if(t.includes("전기")) return "electrical";
  if(t.includes("조명")) return "lighting";
  if(t.includes("방수")) return "waterproof";
  return "other";
}

function eamUnifiedCode(x){
  const c=String(x?.code||'');
  const maps={
    fire:{'EQ-01':'F-01','EQ-02':'F-02','EQ-03':'F-03','EQ-05':'F-04','FI-01':'F-05','FI-02':'F-06','FI-03':'F-07','FI-04':'F-08','FI-05':'F-09','FI-06':'F-10','FI-07':'F-11','FI-08':'F-12'},
    water:{'EQ-04':'W-01','EQ-06':'W-02','BO-01':'W-03','BO-02':'W-04','BO-03':'W-05'}
  };
  const t=eamSourceCategory(x);
  return (maps[t]&&maps[t][c])||c;
}

    ["water","♨️","온수·난방","온수기 · 조절기 · 난방"],
    ["electrical","⚡","전기설비","분전반"],
    ["lighting","💡","코트조명","조명 · 전동릴"],
    ["waterproof","🏗️","방수","지붕 · 방수"],
    ["other","🔧","기타설비","사무 · 공용"]

function eamProFilter(q, loc){
  const v=String(q||'').trim().toLowerCase();
  const lc=String(loc||'').trim().toUpperCase();
  document.querySelectorAll('#eamproGrid .eam-asset-row').forEach(el=>{
    const txt=(el.innerText||'').toLowerCase();
    const code=String(el.dataset.code||'').toLowerCase();
    const place=String(el.dataset.loc||'').toUpperCase();
    const okText=!v||txt.includes(v)||code.includes(v);
    const okLoc=!lc||place===lc;
    el.style.display=(okText&&okLoc)?'':'';
  });
}

async function eamEnsureEditableAsset(){
  const code=window.__eamSelCode||'';
  if(!code||!SUPA) return null;
  let a=(window.__eamA||[]).find(v=>String(v.asset_code)===String(code));
  if(a) return a;
  const src=eamSelectedSource();
  if(!src) return null;
  const payload={
    asset_code:String(src.code),
    name:String(eamDisplayName(src)||src.name||src.code),
    category:String(eamSourceCategory(src)||'기타설비'),
    place:String(String(src.type||'').includes('소방')?'유수장치실':(src.place||'-')),
    status:'정상',
    product_name:String(src.model||src.name||src.code)
  };
  const r=await SUPA.from('assets').insert(payload).select('*').single();
  if(r.error){
    console.error(r.error);
    const again=await SUPA.from('assets').select('*').eq('asset_code',code).maybeSingle();
    if(again.data) return again.data;
    alert('기존 자산을 수정하려면 먼저 DB 등록이 필요합니다.\n'+(r.error.message||''));
    return null;
  }
  await eamLoad();
  a=(window.__eamA||[]).find(v=>String(v.asset_code)===String(code));
  return a||r.data;
}

<script id="MONTH_YEAR_COMPARE_JS">
(function(){
  const baseMonths={2026:{8:0}};
  const baseYears={2025:0};
  function state(){
    try{
      const keys=["JGB_LIVE_TEST_V2","JGB_FACILITY_LIVE","JGB_LIVE_TEST"];
      for(const k of keys){const v=localStorage.getItem(k);if(v){const s=JSON.parse(v);if(s&&typeof s==="object")return s;}}
    }catch(e){}
    return {};
  }
  function issues(s){
    return s.issues||s.requests||s.items||s.receipts||[];
  }
  function monthKey(x){
    const t=x.receivedAt||x.createdAt||x.time||x.date||"";
    const m=String(t).match(/(20\d\d)[-/.](\d\d?)/);
    return m?m[1]+"-"+String(m[2]).padStart(2,"0"):"";
  }
  function annualData(){
    const s=state(), arr=issues(s), out={};
    for(const x of arr){
      const k=monthKey(x); if(!k) continue;
      const [y,m]=k.split("-").map(Number);
      out[y]??={}; out[y][m]??={received:0,done:0,miss:0};
      out[y][m].received++;
      if(x.completed||x.status==="completed"||x.status==="done"||x.handledAt) out[y][m].done++;
      else out[y][m].miss++;
    }
    return out;
  }
  function renderMonthYearCompare(mode){
    const box=document.getElementById("monthYearCompareBody"); if(!box)return;
    const d=annualData(), now=new Date(), cy=now.getFullYear(), cm=now.getMonth()+1;
    if(mode==="month"){
      const months=[];
      for(let m=1;m<=12;m++){
        const z=(d[cy]&&d[cy][m])||{received:0,done:0,miss:0};
        if(cy===2026 && m===8 && !d[cy]?.[m]) z.received=z.done=z.miss=0;
        const prev=(m===1?{received:0,done:0,miss:0}:((d[cy]&&d[cy][m-1])||{received:0,done:0,miss:0}));
        const delta=z.received-prev.received;
        months.push({m,z,delta});
      }
      const cur=(d[cy]&&d[cy][cm])||{received:0,done:0,miss:0};
      const rate=cur.received?Math.round(cur.done/cur.received*100):0;
      box.innerHTML=`
        <div class="myc-grid">
          <div class="myc-card">현재 월 접수<b class="v">${cur.received}건</b><div class="s">${cy}년 ${cm}월</div></div>
          <div class="myc-card">현재 월 완료<b class="v myc-up">${cur.done}건</b><div class="s">조치완료</div></div>
          <div class="myc-card">현재 월 미완료<b class="v myc-down">${cur.miss}건</b><div class="s">아직 완료되지 않은 건</div></div>

    const a=(window.__eamA||[]).find(v=>String(v.asset_code)===code);
    if(!a){alert('자산을 찾을 수 없습니다.');return}
    if(!window.SUPA){alert('Supabase 연결이 필요합니다.');return}
    const val=id=>document.getElementById(id)?.value?.trim()||'';
    const name=val('editName'), cat=val('editCategory')||'기타설비', loc=val('editLocCode'), detail=val('editDetailPlace');
    if(!name){alert('소분류(자산명)를 입력하세요.');return}
    const place=detail||LOCS[loc]||'';
    const meta={asset_code:code,name,category:cat,place,locationCode:loc,model:val('editModel'),qty:val('editQty'),vendor:val('editVendor'),asContact:val('editAs'),installDate:val('editInstall'),warranty:val('editWarranty'),asHistory:val('editAsHistory'),status:val('editStatus')||'정상',note:val('editNote')};
    const btn=document.getElementById('eamEditSave');
    if(btn){btn.disabled=true;btn.textContent='저장 중…'}
    const boxBefore=document.getElementById('eamproGrid');
    const scrollBefore=boxBefore?boxBefore.scrollTop:0;
    const catBefore=window.__eamCat||'cooling';
    try{
      /* 자산의 핵심 필드는 assets에 직접 저장 */
      const r=await window.SUPA.from('assets').update({
        name,
        category:cat,
        place,
        status:meta.status,
        product_name:meta.model||cat
      }).eq('id',a.id);
      if(r.error) throw r.error;

      /* 확장 정보는 메타 캐시에 보존. 이력 테이블 실패가 기본 저장을 막지 않도록 비차단 처리 */
      const all=readMeta();
      all[code]=meta;
      writeMeta(all);
      window.__eamMetaByCode=all;

      try{
        const h=await window.SUPA.from('asset_history').insert({
          asset_id:a.id,
          event_type:'자산정보수정',
          description:'META::'+JSON.stringify(meta),
          worker_name:'관리자',
          cost:0,
          event_date:new Date().toISOString().slice(0,10)
        });
        if(h?.error) console.warn('자산정보 수정 이력은 저장하지 못했지만 기본정보 저장은 완료:',h.error);
      }catch(e){
        console.warn('자산정보 수정 이력 예외:',e);
      }

      document.getElementById('eamEditModal')?.remove();
      await eamLoad();
      window.__eamMetaByCode=Object.assign(readMeta(),window.__eamMetaByCode||{});
      window.__eamSelCode=code;
      window.__eamCat=CATMAP[cat]||'other';
      /* 위치/카테고리 변경 후 목록에서 선택 자산을 유지 */
      render();
      requestAnimationFrame(()=>{
        const b=document.getElementById('eamproGrid');
        if(!b)return;
        const saved=window.__eamScrollByCat||{};
        const desired=(catBefore===window.__eamCat ? scrollBefore : (saved[window.__eamCat]||0));
        b.scrollTop=Number.isFinite(desired)?desired:0;
        const row=b.querySelector('.eam-asset-row.on');
        if(row){
          const top=row.offsetTop, bottom=top+row.offsetHeight;
          const vTop=b.scrollTop, vBottom=vTop+b.clientHeight;
          if(top<vTop)b.scrollTop=Math.max(0,top-8);
          else if(bottom>vBottom)b.scrollTop=Math.max(0,bottom-b.clientHeight+8);
        }
        if(window.__eamScrollByCat)window.__eamScrollByCat[window.__eamCat]=b.scrollTop;
      });
      toast('자산 정보가 저장되었습니다.');
    }catch(e){
      console.error(e);
      alert('자산 저장에 실패했습니다.\n'+(e?.message||'Supabase 권한 또는 연결을 확인하세요.'));
    }finally{
      if(btn){btn.disabled=false;btn.textContent='저장'}
    }
  };

  // 자산 선택 시 현재 스크롤을 보존하고, 선택 후 자동으로 맨 위로 이동하지 않음.
  window.eamPick=function(cat,code){
    const oldBox=document.getElementById('eamproGrid');
    const oldCat=window.__eamCat||'cooling';
    const oldScroll=oldBox?oldBox.scrollTop:0;
    window.__eamScrollByCat[oldCat]=oldScroll;
    window.__eamCat=cat||oldCat;
    if(code!==undefined&&code!==null) window.__eamSelCode=String(code);
    else window.__eamSelCode='';
    render();
    requestAnimationFrame(()=>{
      const b=document.getElementById('eamproGrid'); if(!b)return;
      // 같은 분류면 방금 보던 위치, 다른 분류면 이전에 보던 위치를 복원
      b.scrollTop=Number.isFinite(window.__eamScrollByCat[window.__eamCat])?window.__eamScrollByCat[window.__eamCat]:0;
    });
  };

  // 필터/검색 렌더링 이후에도 스크롤 유지 보조
  const oldFilter=window.eamProFilter;
  window.eamProFilter=function(q,loc){
    const box=document.getElementById('eamproGrid'), cat=window.__eamCat||'cooling';
    if(box) window.__eamScrollByCat[cat]=box.scrollTop;
    if(typeof oldFilter==='function') oldFilter(q,loc);
    requestAnimationFrame(()=>{const b=document.getElementById('eamproGrid');if(b)b.scrollTop=window.__eamScrollByCat[cat]||0;});
  };
})();
</script>

})();
