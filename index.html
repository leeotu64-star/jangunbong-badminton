<style id="adminPolish">
/* 관리자 화면 정리용 디자인 - 기능/동작은 변경하지 않음 */
.admin{
  min-height:calc(100vh - 72px);
  background:#f3f6fa;
  display:grid;
  grid-template-columns:150px 1fr;
}
.side{
  background:#071b45;
  padding:22px 10px;
  position:sticky;
  top:0;
  height:calc(100vh - 72px);
  box-sizing:border-box;
}
.side h2{
  font-size:15px;
  margin:0 0 16px;
  padding:8px 10px;
  color:#fff;
}
.nav{
  padding:13px 12px;
  margin:5px 0;
  border-radius:8px;
  font-size:14px;
  transition:.15s;
}
.nav.on{background:#1466e8}
.nav:hover{background:#123b7f}
.main{
  padding:20px 22px 35px;
  max-width:1700px;
  width:100%;
  box-sizing:border-box;
}
.panel{
  background:#fff;
  border:1px solid #dbe3ee;
  border-radius:12px;
  margin-bottom:14px;
  padding:18px;
  box-shadow:0 2px 8px rgba(18,38,70,.05);
}
.panel h2{
  font-size:20px;
  margin:0 0 5px;
  color:#10244b;
}
.hint{color:#718096;font-size:12px}
.lockGrid,.controlRow,.grid{
  gap:10px;
}
.lockCard{
  border:1px solid #dce4ee;
  border-radius:10px;
  background:#fbfcfe;
  padding:14px;
  box-shadow:none;
}
.lockCard h3{
  font-size:17px;
  margin:0 0 8px;
}
.lockCard p{
  color:#64748b;
  margin:5px 0 12px;
  font-size:12px;
}
.lockCard button{
  width:100%;
  min-height:38px;
  border-radius:7px;
  font-weight:900;
}
.controlBox{
  background:#fbfcfe;
  border:1px solid #dce4ee;
  border-radius:10px;
  padding:16px;
}
.controlBox h3{
  margin:0 0 12px;
  font-size:16px;
}
.stepper{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}
.stepper button{
  width:38px;
  height:36px;
  border-radius:7px;
  font-size:18px;
  font-weight:900;
}
.stepper strong{
  min-width:38px;
  text-align:center;
  font-size:21px;
}
.adminSave{
  margin-top:13px;
  min-width:130px;
}
.adminTable .grid{
  align-items:stretch;
}
.adminTable .card{
  min-height:145px;
  background:#fbfcfe;
  border:1px solid #d9e2ee;
  border-radius:10px;
  padding:13px;
  box-sizing:border-box;
}
.adminTable .card h3{
  font-size:16px;
  color:#10244b;
  padding-bottom:9px;
  margin-bottom:8px;
  border-bottom:1px solid #e6ebf2;
}
.adminTable .card p{
  margin:7px 0;
  font-size:12px;
  line-height:1.5;
}
.adminTable .card p:first-of-type{
  background:#eef4ff;
  border-radius:7px;
  padding:8px;
  font-weight:800;
}
.adminTable .smallbtn{
  float:right;
  background:#e53935;
  color:#fff;
  border:0;
  border-radius:6px;
  padding:6px 9px;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
}
.adminTable .smallbtn:hover{background:#c62828}
.adminTop a{
  background:#1466e8;
  border-radius:7px;
  padding:9px 15px;
  font-weight:900;
}
@media(max-width:950px){
  .admin{grid-template-columns:1fr}
  .side{position:relative;height:auto}
  .main{padding:14px}
  .grid{grid-template-columns:repeat(2,1fr)}
}
</style>

<script>
const SB_HEADERS={"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY,"Content-Type":"application/json"};
async function sbGet(){
  const url=SUPABASE_URL+"/rest/v1/waiting_state?id=eq.waiting_state&select=*";
  const r=await fetch(url,{
    method:"GET",
    headers:{
      "apikey":SUPABASE_ANON_KEY,
      "Authorization":"Bearer "+SUPABASE_ANON_KEY,
      "Accept":"application/json"
    },
    cache:"no-store"
  });
  const text=await r.text();
  if(!r.ok) throw new Error("조회 오류 "+r.status+" : "+text);
  const rows=text?JSON.parse(text):[];
  return rows[0]||null;
}
async function sbUpsert(row){
  const payload={
    id:ROOT,
    settings:row.settings||{"난타":15,"4인 복식":15,"2인 단식":15},
    max_per_court:Number(row.max_per_court||5),
    re_register_minutes:Math.max(1,Math.min(20,Number(row.re_register_minutes||5))),
    finished:row.finished||{},
    courts:Array.isArray(row.courts)?row.courts:[]
  };

  /* 기존 행이 있으면 PATCH */
  const patchUrl=SUPABASE_URL+"/rest/v1/waiting_state?id=eq."+encodeURIComponent(ROOT);
  const patch=await fetch(patchUrl,{
    method:"PATCH",
    headers:{
      "apikey":SUPABASE_ANON_KEY,
      "Authorization":"Bearer "+SUPABASE_ANON_KEY,
      "Content-Type":"application/json",
      "Accept":"application/json",
      "Prefer":"return=representation"
    },
    body:JSON.stringify(payload),
    cache:"no-store"
  });
  const patchText=await patch.text();

  if(patch.ok){
    const rows=patchText?JSON.parse(patchText):[];
    if(Array.isArray(rows)&&rows.length>0) return rows[0];
  }

  /* 행이 없거나 PATCH 결과가 비어 있으면 upsert로 생성 */
  const upsertUrl=SUPABASE_URL+"/rest/v1/waiting_state?on_conflict=id";
  const upsert=await fetch(upsertUrl,{
    method:"POST",
    headers:{
      "apikey":SUPABASE_ANON_KEY,
      "Authorization":"Bearer "+SUPABASE_ANON_KEY,
      "Content-Type":"application/json",
      "Accept":"application/json",
      "Prefer":"resolution=merge-duplicates,return=representation"
    },
    body:JSON.stringify(payload),
    cache:"no-store"
  });
  const upsertText=await upsert.text();

  if(!upsert.ok){
    throw new Error("저장 오류 "+upsert.status+" : "+upsertText+(patchText?(" / PATCH: "+patchText):""));
  }

  const rows=upsertText?JSON.parse(upsertText):[];
  if(!Array.isArray(rows)||rows.length===0){
    throw new Error("저장 오류 : waiting_state 데이터를 확인할 수 없습니다.");
  }
  return rows[0];
}const ROOT="waiting_state";

/* QR 연속등록 방지: 개인정보 대신 브라우저에 저장되는 랜덤 토큰만 사용 */
const DEVICE_KEY="jb_anonymous_device_v1";
const COOLDOWN_KEY="jb_register_cooldown_until";

function getDeviceToken(){
  try{
    let v=localStorage.getItem(DEVICE_KEY);
    if(!v){
      v=(crypto&&crypto.randomUUID)?crypto.randomUUID():
        ("D"+Date.now()+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2));
      localStorage.setItem(DEVICE_KEY,v);
    }
    return v;
  }catch(e){
    return (crypto&&crypto.randomUUID)?crypto.randomUUID():
      ("D"+Date.now()+Math.random().toString(36).slice(2));
  }
}
function getCooldownUntil(){
  try{return Number(localStorage.getItem(COOLDOWN_KEY)||0)}catch(e){return 0}
}
function setCooldown(minutes){
  const ms=Math.max(1,Math.min(20,Number(minutes||5)))*60*1000;
  try{localStorage.setItem(COOLDOWN_KEY,String(Date.now()+ms))}catch(e){}
}
function clearCooldown(){
  try{localStorage.removeItem(COOLDOWN_KEY)}catch(e){}
}
function cooldownMessage(until){
  const leftMs=Math.max(0,until-Date.now());
  const m=Math.ceil(leftMs/60000);
  return m<=1 ? "잠시 후 다시 등록할 수 있습니다." : m+"분 후 다시 등록할 수 있습니다.";
}
function findDeviceRegistration(s,deviceId){
  for(const c of (s.courts||[])){
    if(c.active?.deviceId===deviceId) return {type:"active",court:c,entry:c.active};
    const q=(c.queue||[]).find(x=>x.deviceId===deviceId);
    if(q) return {type:"queue",court:c,entry:q};
  }
  return null;
}


function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function tm(t){return new Date(t).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}
function left(t){let n=Math.max(0,Math.ceil((t-Date.now())/1000));return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")}
function cloneDef(){return JSON.parse(JSON.stringify(def))}

  }
}
async function get(){
  const data=await sbGet();
  return data?data:cloneDef();
}
async function save(s){
  await sbUpsert({
    id:ROOT,
    settings:s.settings,
    max_per_court:s.max_per_court,
    re_register_minutes:Math.max(1,Math.min(20,Number(s.re_register_minutes||5))),
    finished:s.finished||{},
    courts:s.courts
  });
}
async function ensure(){
  const data=await sbGet();
  if(!data) await save(cloneDef());
}
async function advance(s,doSave=true){
  s.finished=s.finished||{};
  let ch=false;
  for(const c of s.courts){
    if(c.active && Date.now()>=Number(c.active.endAt)){
      const a=c.active;
      s.finished[a.ticket]={...a,endedAt:Date.now()};
      c.active=null; ch=true;
    }
    if(!c.active && !c.blocked && (c.queue||[]).length){
      const x=c.queue.shift();
      const m=Number(s.settings[x.game]||15);
      const st=Date.now();
      c.active={...x,startAt:st,endAt:st+m*60000};
      ch=true;
    }
  }
  if(ch && doSave) await save(s);
  return s;
}
let liveTimer=null;
function sub(fn){
  if(liveTimer) clearInterval(liveTimer);

  let busy=false;
  const refresh=async()=>{
    if(busy)return;
    busy=true;
    try{
      const s=await advance(await get());
      fn(s);
    }catch(e){
      console.error("실시간 연동 오류:",e);
    }finally{
      busy=false;
    }
  };

  /* 최초 즉시 반영 */
  refresh();

  /* 고객 등록 후 최대 1초 안에 고객 모니터에 반영 */
  liveTimer=setInterval(refresh,1000);

  /* 다른 화면에서 고객 모니터로 돌아왔을 때 즉시 반영 */
  window.addEventListener("focus",refresh);
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="visible") refresh();
  });
}

/* GitHub Pages compatible routing:
   /?page=register
   /?page=admin
   /?page=waiting&ticket=...
   Existing /register, /admin, /waiting paths are also supported. */
function route(){
  const path=location.pathname.replace(/\/+$/,"");
  const page=params.get("page")||"";
  if(page==="management") return "management";
  if(path==="/admin" || path.endsWith("/admin") || page==="admin") return "admin";
  if(path==="/register" || path.endsWith("/register") || page==="register") return "register";
  if(path==="/waiting" || path.endsWith("/waiting") || page==="waiting" || ticket) return "waiting";
  return "customer";
}

async function loadRegisterDuration(){
  const game=document.getElementById("g"), out=document.getElementById("duration");
  if(!game||!out)return;
  let timer=null;
  const sync=async()=>{
    try{
      const s=await get();
      out.textContent=(s.settings?.[game.value]||15)+"분";
      const cm=document.getElementById("cooldownMinutes");
      if(cm) cm.textContent=(Number(s.re_register_minutes)||5)+"분";
    }catch(e){}
  };
  game.addEventListener("change",sync);
  await sync();
  timer=setInterval(sync,2000);
  window.addEventListener("beforeunload",()=>{if(timer)clearInterval(timer)},{once:true});
}

async function reg(){
  const btn=document.getElementById("regBtn"), ee=document.getElementById("e");
  const nn=document.getElementById("n").value.trim();
  const gg=document.getElementById("g").value;
  const id=Number(document.getElementById("c").value);
  const deviceId=getDeviceToken();

  const err=(msg)=>{
    ee.style.display="block";
    ee.textContent=msg;
    btn.disabled=false; btn.style.opacity="1";
  };

  if(!nn||!gg||!id){err("닉네임, 게임 방식, 코트를 모두 선택해주세요.");return}

  /* 같은 스마트폰의 5분 재등록 제한 */
  const cooldown=getCooldownUntil();
  if(cooldown>Date.now()){
    err("⚠️ 이미 등록했습니다. "+cooldownMessage(cooldown));
    return;
  }

  btn.disabled=true; btn.style.opacity=".65"; ee.style.display="none";

  try{
    let s=await get();
    if(!s || !Array.isArray(s.courts)) s=cloneDef();
    s.settings=s.settings||{"난타":15,"4인 복식":15,"2인 단식":15};
    s.max_per_court=Math.max(1,Math.min(20,Number(s.max_per_court||5)));
    s.re_register_minutes=Math.max(1,Math.min(20,Number(s.re_register_minutes||5)));
    s.finished=s.finished||{};

    /* 서버에 저장된 익명 기기 토큰으로 모든 코트의 중복 대기/이용 여부 검사 */
    const existing=findDeviceRegistration(s,deviceId);
    if(existing){
      err("⚠️ 이미 대기 등록되어 있습니다.\n기존 대기를 취소하거나 이용을 마친 후 다시 등록해주세요.");
      return;
    }

    const x=s.courts.find(v=>Number(v.id)===id);
    if(!x){err("선택한 코트를 찾을 수 없습니다.");return}
    if(x.blocked){err("현재 이용할 수 없는 코트입니다. 다른 코트를 선택해주세요.");return}

    x.queue=Array.isArray(x.queue)?x.queue:[];
    const total=x.queue.length+(x.active?1:0);
    if(total>=s.max_per_court){err("선택한 코트의 대기가 마감되었습니다.");return}

    const t=(crypto&&crypto.randomUUID)?crypto.randomUUID():
      ("T"+Date.now()+Math.random().toString(36).slice(2));

    /* QR에는 개인정보가 없고, 대기 데이터에도 익명 랜덤 토큰만 저장 */
    x.queue.push({
      ticket:t,
      nickname:nn,
      game:gg,
      court:id,
      createdAt:Date.now(),
      deviceId:deviceId
    });

    await advance(s,false);
    await save(s);

    /* 저장 직후 서버 상태를 다시 읽어 고객 모니터와 같은 데이터를 확인 */
    const savedState=await get();
    const savedHere=savedState.courts.some(c=>
      (c.active&&c.active.ticket===t) ||
      (c.queue||[]).some(q=>q.ticket===t)
    );
    if(!savedHere){
      throw new Error("대기 등록 정보가 서버에 저장되지 않았습니다. 잠시 후 다시 시도해주세요.");
    }

    /* 등록 성공 후 관리자에서 설정한 시간 동안 같은 브라우저의 재등록 차단 */
    setCooldown(Number(s.re_register_minutes)||5);

    location.replace(location.pathname+"?page=waiting&ticket="+encodeURIComponent(t));
  }catch(e){
    console.error(e);
    err(String(e?.message||e));
  }
}

    if(x.active?.ticket===ticket){a=x.active;c=x}

  /* 3번째 화면: 15분 종료 */

  }

  /* 현재 이용 중 */
  if(a){
    const remain=left(a.endAt);

      <div style="font-size:11px;color:#1565ff;font-weight:800;text-align:center;margin-bottom:8px">

      </div>`;
    return;
  }

  /* 2번째 화면: 대기 중 */
  if(q){
    const arr=c.queue||[];
    const pos=arr.findIndex(x=>x.ticket===ticket)+1;
    const duration=Number(s.settings[q.game]||15);

    }

    w.innerHTML=`

async function cancelWait(){
  try{let s=await get();for(const c of s.courts)c.queue=(c.queue||[]).filter(x=>x.ticket!==ticket);await save(s);location.href="?page=register"}catch(e){showError(e)}
}
async function leave(){
  try{let s=await get();for(const c of s.courts)if(c.active?.ticket===ticket){s.finished=s.finished||{};s.finished[ticket]={...c.active,endedAt:Date.now()};c.active=null}await advance(s);await save(s)}catch(e){showError(e)}
}
async function finish(){
  try{let s=await get();if(s.finished)delete s.finished[ticket];await save(s);location.href="?page=register"}catch(e){showError(e)}
}

    }else{
      alert("변경사항이 저장되었습니다.");
    }
  }catch(e){showError(e)}
}
async function block(id,b){
  try{
    let s=await get();
    s.courts.find(c=>c.id===id).blocked=b;
    await save(s);
  }catch(e){showError(e)}
}
async function force(id){
  try{
    let s=await get(),c=s.courts.find(c=>c.id===id);
    if(c.active){s.finished=s.finished||{};s.finished[c.active.ticket]={...c.active,endedAt:Date.now()};c.active=null}
    await advance(s); await save(s);
  }catch(e){showError(e)}
}


function management(){
  const view=params.get("view")||"display";
  if(view==="admin"){
    admin();
    const top=document.querySelector('.adminTop');
    if(top){
      const links=top.querySelectorAll('a');
      if(links[0]){links[0].href='?page=management&view=display';links[0].textContent='고객용';}
      if(links[1]){links[1].href='?page=register';links[1].textContent='QR 등록';}
    }
  }else{
    customer();
    const top=document.querySelector('.header > div:last-child');
    if(top){
      const a=top.querySelector('a.customerBtn');
      if(a){a.href='?page=management&view=admin';a.textContent='관리자';}
    }
  }
}

(function(){
  const r=route();
  if(r==="management")management();
  else if(r==="admin")admin();
  else if(r==="register")register();
  else if(r==="waiting")waiting();
  else customer();
  ensure().catch(e=>console.error(e));
})();
</script>
<script>
(function(){
  window.switchManagementView=function(view){
    const display=document.getElementById("manageDisplay");
    const admin=document.getElementById("manageAdmin");
    if(!display||!admin)return;
    const customer=document.getElementById("switchCustomer");
    const adminBtn=document.getElementById("switchAdmin");
    if(view==="admin"){
      display.style.display="none";
      admin.style.display="block";
      if(customer)customer.style.display="inline-flex";
      if(adminBtn)adminBtn.style.display="none";
    }else{
      display.style.display="block";
      admin.style.display="none";
      if(customer)customer.style.display="none";
      if(adminBtn)adminBtn.style.display="inline-flex";
    }
  };

  function initManagementView(){
    const mp=document.getElementById("managementPage");
    if(!mp)return;
    const params=new URLSearchParams(location.search);
    const view=params.get("view")||"display";
    switchManagementView(view==="admin"?"admin":"display");
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",initManagementView);
  }else{
    initManagementView();
  }
})();
</script>

<script>
(function(){
  function markManagementOnly(){
    const p=new URLSearchParams(location.search);
    const isManagement=p.get("page")==="management";
    document.body.classList.toggle("management-view",isManagement);
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",markManagementOnly);
  else markManagementOnly();
})();
</script>
