<script>
const SB_HEADERS={"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY,"Content-Type":"application/json"};
async function sbGet(){
  const url=SUPABASE_URL+"/rest/v1/waiting_state?id=eq.waiting_state&select=*";
  const r=await fetch(url,{
    method:"GET",
    headers:{
      "apikey":SUPABASE_ANON_KEY,
      "Authorization":"Bearer "+SUPABASE_ANON_KEY,
      "Accept":"application/json"
    },
    cache:"no-store"
  });
  const text=await r.text();
  if(!r.ok) throw new Error("조회 오류 "+r.status+" : "+text);
  const rows=text?JSON.parse(text):[];
  return rows[0]||null;
}
async function sbUpsert(row){
  const payload={
    settings:row.settings||{"난타":15,"4인 복식":15,"2인 단식":15},
    max_per_court:Number(row.max_per_court||5),
    finished:row.finished||{},
    courts:Array.isArray(row.courts)?row.courts:[]
  };
  const url=SUPABASE_URL+"/rest/v1/waiting_state?id=eq.waiting_state";
  const r=await fetch(url,{
    method:"PATCH",
    headers:{
      "apikey":SUPABASE_ANON_KEY,
      "Authorization":"Bearer "+SUPABASE_ANON_KEY,
      "Content-Type":"application/json",
      "Accept":"application/json",
      "Prefer":"return=representation"
    },
    body:JSON.stringify(payload)
  });
  const text=await r.text();
  if(!r.ok) throw new Error("저장 오류 "+r.status+" : "+text);
  const rows=text?JSON.parse(text):[];
  if(!Array.isArray(rows)||rows.length===0)
    throw new Error("저장 오류 : waiting_state가 수정되지 않았습니다.");
  return true;
}const ROOT="waiting_state";

/* QR 연속등록 방지: 개인정보 대신 브라우저에 저장되는 랜덤 토큰만 사용 */
const DEVICE_KEY="jb_anonymous_device_v1";
const COOLDOWN_KEY="jb_register_cooldown_until";
const REGISTER_COOLDOWN_MS=5*60*1000;

function getDeviceToken(){
  try{
    let v=localStorage.getItem(DEVICE_KEY);
    if(!v){
      v=(crypto&&crypto.randomUUID)?crypto.randomUUID():
        ("D"+Date.now()+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2));
      localStorage.setItem(DEVICE_KEY,v);
    }
    return v;
  }catch(e){
    return (crypto&&crypto.randomUUID)?crypto.randomUUID():
      ("D"+Date.now()+Math.random().toString(36).slice(2));
  }
}
function getCooldownUntil(){
  try{return Number(localStorage.getItem(COOLDOWN_KEY)||0)}catch(e){return 0}
}
function setCooldown(){
  try{localStorage.setItem(COOLDOWN_KEY,String(Date.now()+REGISTER_COOLDOWN_MS))}catch(e){}
}
function clearCooldown(){
  try{localStorage.removeItem(COOLDOWN_KEY)}catch(e){}
}
function cooldownMessage(until){
  const leftMs=Math.max(0,until-Date.now());
  const m=Math.ceil(leftMs/60000);
  return m<=1 ? "잠시 후 다시 등록할 수 있습니다." : m+"분 후 다시 등록할 수 있습니다.";
}
function findDeviceRegistration(s,deviceId){
  for(const c of (s.courts||[])){
    if(c.active?.deviceId===deviceId) return {type:"active",court:c,entry:c.active};
    const q=(c.queue||[]).find(x=>x.deviceId===deviceId);
    if(q) return {type:"queue",court:c,entry:q};
  }
  return null;
}


function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function tm(t){return new Date(t).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}
function left(t){let n=Math.max(0,Math.ceil((t-Date.now())/1000));return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")}
function cloneDef(){return JSON.parse(JSON.stringify(def))}
function showError(err){
  const msg=err?.message||String(err||"알 수 없는 오류");
  console.error("Supabase error:",err);
  const box=document.getElementById("app");
  if(box && !box.innerHTML.includes("장군봉 배드민턴")) {
    box.innerHTML='<div style="max-width:720px;margin:60px auto;padding:28px;font-family:Arial;text-align:center"><p>데이터 연결을 준비하는 중입니다.</p><small>'+esc(msg)+'</small></div>';
  }
}
async function get(){
  const data=await sbGet();
  return data?data:cloneDef();
}
async function save(s){
  await sbUpsert({
    id:ROOT,
    settings:s.settings,
    max_per_court:s.max_per_court,
    finished:s.finished||{},
    courts:s.courts
  });
}
async function ensure(){
  const data=await sbGet();
  if(!data) await save(cloneDef());
}
async function advance(s,doSave=true){
  s.finished=s.finished||{};
  let ch=false;
  for(const c of s.courts){
    if(c.active && Date.now()>=Number(c.active.endAt)){
      const a=c.active;
      s.finished[a.ticket]={...a,endedAt:Date.now()};
      c.active=null; ch=true;
    }
    if(!c.active && !c.blocked && (c.queue||[]).length){
      const x=c.queue.shift();
      const m=Number(s.settings[x.game]||15);
      const st=Date.now();
      c.active={...x,startAt:st,endAt:st+m*60000};
      ch=true;
    }
  }
  if(ch && doSave) await save(s);
  return s;
}
let liveTimer=null;
function sub(fn){
  if(liveTimer) clearInterval(liveTimer);
  const refresh=async()=>{try{fn(await advance(await get()))}catch(e){showError(e)}};
  refresh();
  liveTimer=setInterval(refresh,2000);
}

/* GitHub Pages compatible routing:
   /?page=register
   /?page=admin
   /?page=waiting&ticket=...
   Existing /register, /admin, /waiting paths are also supported. */
function route(){
  const path=location.pathname.replace(/\/+$/,"");
  const page=params.get("page")||"";
  if(page==="management") return "management";
  if(path==="/admin" || path.endsWith("/admin") || page==="admin") return "admin";
  if(path==="/register" || path.endsWith("/register") || page==="register") return "register";
  if(path==="/waiting" || path.endsWith("/waiting") || page==="waiting" || ticket) return "waiting";
  return "customer";
}

async function changeTime(game,delta){
  const el=game==="난타"?document.getElementById("g1"):game==="4인 복식"?document.getElementById("g2"):document.getElementById("g3");
  if(!el)return;
  const v=Math.max(1,Math.min(20,Number(el.textContent||15)+delta));
  el.textContent=v;
  try{
    const s=await get();
    s.settings=s.settings||{"난타":15,"4인 복식":15,"2인 단식":15};
    s.settings[game]=v;
    await save(s);
  }catch(e){showError(e)}
}

<script id="registerGameChoiceScript">
(function(){
  function initRegisterGameChoices(){
    const p=new URLSearchParams(location.search);
    if(p.get("page")!=="register") return;
    const wrap=document.getElementById("registerGameChoices");
    if(!wrap) return;
    const target=document.getElementById("g") ||
      document.getElementById("game") ||
      document.querySelector('select[name="game"]');
    if(!target) return;

    const buttons=[...wrap.querySelectorAll("button[data-game]")];
    function setActive(){
      const value=target.value || "4인 복식";
      buttons.forEach(b=>b.classList.toggle("active",b.dataset.game===value));
    }
    buttons.forEach(b=>{
      b.addEventListener("click",()=>{
        target.value=b.dataset.game;
        target.dispatchEvent(new Event("change",{bubbles:true}));
        setActive();
      });
    });
    setActive();
  }
  if(document.readyState==="loading")
    document.addEventListener("DOMContentLoaded",initRegisterGameChoices);
  else initRegisterGameChoices();
})();
</script>
