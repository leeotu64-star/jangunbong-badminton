<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>장군봉 배드민턴</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;color:#071633;background:#fff}
.header{height:76px;background:#061b4f;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{font-size:26px;font-weight:800}.sub{font-size:13px}.wrap{padding:16px;max-width:1500px;margin:auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.stat{border:1px solid #e1e6ef;border-radius:9px;padding:12px;text-align:center}.stat b{display:block;font-size:30px;margin-top:3px}
.courts{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.court{border:1px solid #d8dfeb;border-radius:9px;overflow:hidden}.head{height:52px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:19px;border-bottom:1px solid #e5e9f0}.num{display:inline-flex;width:32px;height:32px;align-items:center;justify-content:center;color:#fff;border-radius:6px;margin-right:7px}.badge{padding:5px 10px;border-radius:14px;color:#fff;font-size:11px}.body{padding:11px}.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #edf0f4}.label{font-size:12px}.val{font-weight:800}.remain{font-size:26px;color:#07854b}.qbox{margin-top:10px;border:1px solid #e1e6ee;border-radius:7px;overflow:hidden}.qtitle{padding:8px;background:#f6f8fb;font-weight:800;font-size:13px}.qrow{display:grid;grid-template-columns:28px 1fr 1fr;padding:6px 8px;border-top:1px solid #edf0f4;font-size:11px}
.form,.wait{max-width:560px;margin:25px auto;border:1px solid #dce4ef;border-radius:16px;overflow:hidden;box-shadow:0 8px 28px #0001}.formhead,.waithead{background:#061b4f;color:#fff;text-align:center;padding:22px}.formbody,.waitbody{padding:18px}.field{margin-bottom:14px}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #d6deea;border-radius:7px;font-size:15px}.btn{width:100%;padding:13px;border:0;border-radius:7px;background:#0d58df;color:#fff;font-weight:800;font-size:16px}.cancel{background:#e50914}.notice{padding:12px;background:#eef5ff;border-radius:8px;font-size:12px;line-height:1.7;margin-bottom:12px}.my{background:#eef5ff;border:1px solid #cbdcff;border-radius:8px;text-align:center;padding:10px;margin:10px 0}.my strong{display:block;color:#125fe3;font-size:38px}.timer{text-align:center;font-size:29px;font-weight:900;margin:12px}
.admin{display:grid;grid-template-columns:190px 1fr;min-height:calc(100vh - 76px)}.side{background:#071b45;color:#fff;padding:18px 10px}.side h2{font-size:16px;margin:0;padding:10px}.nav{padding:14px;border-radius:6px;margin:4px 0;font-weight:800}.nav.on{background:#0c63e8}.main{padding:25px}.panel{border:1px solid #dfe5ee;border-radius:9px;margin-bottom:18px;padding:18px}.panel h2{margin:0 0 6px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.card{border:1px solid #dce3ee;border-radius:8px;padding:12px}.card h3{margin:0 0 10px}.smallbtn{padding:7px 11px;border:1px solid #ccd6e4;background:#fff;border-radius:6px}.settings{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.setting{border:1px solid #dce3ee;border-radius:8px;padding:12px;display:flex;justify-content:space-between;align-items:center}.setting input{width:65px;padding:7px;text-align:center}.save{background:#0c63e8;color:#fff;border:0;border-radius:7px;padding:11px 28px;font-weight:800}
@media(max-width:950px){.courts{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.admin{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.courts,.stats,.settings,.grid{grid-template-columns:1fr}.brand{font-size:18px}}
</style></head><body><div id="app"></div>
<script>
/* Supabase 설정: 아래 2개만 본인 프로젝트 값으로 교체 */
const SUPABASE_URL="https://jvwrwckjumnzzecazgku.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_ATg2EbcVch2360kEit3w4g_IcHAWHIL";
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const ROOT="waiting_state",ticket=new URLSearchParams(location.search).get("ticket")||"";
const colors=["#07854b","#1461e8","#6332d7","#ff7900","#e51e2a"];
const def={id:ROOT,settings:{"난타":15,"4인 복식":15,"2인 단식":15},max_per_court:5,finished:{},courts:[1,2,3,4,5].map(id=>({id,blocked:false,active:null,queue:[]}))};
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function tm(t){return new Date(t).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}
function left(t){let n=Math.max(0,Math.ceil((t-Date.now())/1000));return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")}
async function get(){let {data,error}=await sb.from("waiting_state").select("*").eq("id",ROOT).maybeSingle();if(error)throw error;return data?data:JSON.parse(JSON.stringify(def))}
async function save(s){await sb.from("waiting_state").upsert({id:ROOT,settings:s.settings,max_per_court:s.max_per_court,finished:s.finished,courts:s.courts,updated_at:new Date().toISOString()})}
async function ensure(){let {data}=await sb.from("waiting_state").select("id").eq("id",ROOT).maybeSingle();if(!data)await save(def)}
async function advance(s){s.finished=s.finished||{};let ch=false;for(const c of s.courts){if(c.active&&Date.now()>=c.active.endAt){let a=c.active;s.finished[a.ticket]={...a,endedAt:Date.now()};c.active=null;ch=true}if(!c.active&&!c.blocked&&(c.queue||[]).length){let x=c.queue.shift(),m=Number(s.settings[x.game]||15),st=Date.now();c.active={...x,startAt:st,endAt:st+m*60000};ch=true}}if(ch)await save(s);return s}
function sub(fn){sb.channel("jangunbong-live").on("postgres_changes",{event:"*",schema:"public",table:"waiting_state"},()=>get().then(advance).then(fn)).subscribe();get().then(advance).then(fn)}
function customer(){app.innerHTML='<header class="header"><div><div class="brand">장군봉 배드민턴 코트 현황</div><div class="sub">고객에게 보이는 실시간 대기 현황</div></div><div id="clock"></div></header><div class="wrap"><div class="stats" id="stats"></div><div class="courts" id="courts"></div></div>';sub(renderCustomer);setInterval(()=>clock.textContent=new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}),1000)}
function renderCustomer(s){let a=s.courts.filter(c=>c.active).length,w=s.courts.reduce((n,c)=>n+(c.queue||[]).length,0);stats.innerHTML='<div class="stat">전체 코트<b>5 개</b></div><div class="stat">이용 중 코트<b>'+a+' 개</b></div><div class="stat">대기 중 팀<b>'+w+' 팀</b></div><div class="stat">전체 대기 인원<b>'+w+' 팀</b></div>';courts.innerHTML=s.courts.map((c,i)=>{let q=c.queue||[],a=c.active;return '<section class="court"><div class="head"><span><span class="num" style="background:'+colors[i]+'">'+c.id+'</span>'+c.id+'번 코트</span><span class="badge" style="background:'+(a?colors[i]:'#718096')+'">'+(c.blocked?'사용 불가':a?'이용 중':'대기 중')+'</span></div><div class="body">'+(a?'<div class="row"><span class="label">닉네임</span><span class="val">'+esc(a.nickname)+'</span></div><div class="row"><span class="label">게임 방식</span><span class="val">'+a.game+'</span></div><div class="row"><span class="label">이용 시간</span><span class="val">'+tm(a.startAt)+' ~ '+tm(a.endAt)+'</span></div><div class="row"><span class="label">남은 시간</span><span class="val remain">'+left(a.endAt)+'</span></div>':'<div class="row"><span class="label">현재 대기 팀</span><span class="val">'+q.length+'팀</span></div><div class="row"><span class="label">예상 대기 시간</span><span class="val">약 '+q.length*5+'분</span></div>')+'<div class="qbox"><div class="qtitle">'+c.id+'번 코트 대기 현황 (총 '+q.length+'팀)</div>'+q.map((x,j)=>'<div class="qrow"><b>'+(j+1)+'</b><span>'+esc(x.nickname)+'</span><span>'+x.game+'</span></div>').join('')+'</div></div></section>'}).join('')}
function register(){app.innerHTML='<div class="form"><div class="formhead"><h1>장군봉 배드민턴 스마트 대기</h1><div>간편하게 코트 대기를 등록하세요.</div></div><div class="formbody"><div class="field"><label>닉네임 *</label><input id="n"></div><div class="field"><label>게임 방식 *</label><select id="g"><option value="">게임 방식을 선택해주세요</option><option>4인 복식</option><option>2인 단식</option><option>난타</option></select></div><div class="field"><label>코트 선택 *</label><select id="c"><option value="">코트를 선택해주세요</option><option value="1">1번 코트</option><option value="2">2번 코트</option><option value="3">3번 코트</option><option value="4">4번 코트</option><option value="5">5번 코트</option></select></div><div class="notice">● 선택한 코트의 대기 순번이 등록됩니다.<br>● 게임 시작 전까지 대기 취소가 가능합니다.</div><div id="e" style="color:#d71920;font-weight:800"></div><button class="btn" onclick="reg()">대기 등록하기</button></div></div>'}
async function reg(){let s=await get(),id=+c.value;if(!n.value.trim()||!g.value||!id){e.textContent="필수 항목을 입력해주세요.";return}let x=s.courts.find(x=>x.id===id);if(x.blocked){e.textContent="현재 막혀 있는 코트입니다.";return}if((x.queue||[]).length+(x.active?1:0)>=s.max_per_court){e.textContent="대기가 가득 찼습니다.";return}let t=crypto.randomUUID();x.queue=x.queue||[];x.queue.push({ticket:t,nickname:n.value.trim(),game:g.value,court:id,createdAt:Date.now()});await advance(s);location="/waiting?ticket="+t}
function waiting(){app.innerHTML='<div class="wait"><div class="waithead"><h2>장군봉 배드민턴 스마트 대기</h2></div><div class="waitbody" id="w">불러오는 중...</div></div>';sub(renderWaiting)}
function renderWaiting(s){let a=null,q=null,c=null,fin=s.finished?.[ticket];for(const x of s.courts){if(x.active?.ticket===ticket){a=x.active;c=x}let z=(x.queue||[]).find(y=>y.ticket===ticket);if(z){q=z;c=x}}if(a){w.innerHTML='<div class="row"><span>닉네임</span><b>'+esc(a.nickname)+'</b></div><div class="row"><span>선택 코트</span><b>'+a.court+'번 코트</b></div><div class="row"><span>게임 방식</span><b>'+a.game+'</b></div><div class="my"><small>현재 상태</small><strong>이용 중</strong></div><div class="row"><span>이용 시간</span><b>'+tm(a.startAt)+' ~ '+tm(a.endAt)+'</b></div><div class="timer">'+left(a.endAt)+'</div><button class="btn cancel" onclick="leave()">퇴장하기</button>';return}if(fin){w.innerHTML='<div style="text-align:center;padding:8px"><div style="font-size:48px">✓</div><h2>장군봉 체육관을<br>이용해주셔서<br>대단히 감사합니다!</h2><p>이용 시간이 종료되었습니다.<br>다음 고객을 위해<br>퇴장 버튼을 눌러주세요.</p><div class="notice">퇴장을 눌러야 다시 이용 가능합니다.</div><button class="btn cancel" onclick="finish()">퇴장하기</button></div>';return}if(q){let arr=c.queue||[],pos=arr.findIndex(x=>x.ticket===ticket)+1;w.innerHTML='<div class="row"><span>닉네임</span><b>'+esc(q.nickname)+'</b></div><div class="row"><span>선택 코트</span><b>'+q.court+'번 코트</b></div><div class="row"><span>게임 방식</span><b>'+q.game+'</b></div><div class="row"><span>이용 시간</span><b>'+s.settings[q.game]+'분</b></div><div class="my"><small>나의 순번</small><strong>'+pos+'번</strong><small>(현재 대기 중)</small></div><div class="qbox"><div class="qtitle">'+c.id+'번 코트 대기 현황 (총 '+arr.length+'팀)</div>'+arr.map((x,i)=>'<div class="qrow"><b>'+(i+1)+'</b><span>'+esc(x.nickname)+'</span><span>'+x.game+(x.ticket===ticket?' (나)':'')+'</span></div>').join('')+'</div><button class="btn cancel" onclick="cancelWait()">예약 대기 취소</button>';return}w.innerHTML='대기 등록 정보가 없습니다.'}
async function cancelWait(){let s=await get();for(const c of s.courts)c.queue=(c.queue||[]).filter(x=>x.ticket!==ticket);await save(s);location="/register"}
async function leave(){let s=await get();for(const c of s.courts)if(c.active?.ticket===ticket){s.finished=s.finished||{};s.finished[ticket]={...c.active,endedAt:Date.now()};c.active=null}await advance(s);await save(s)}
async function finish(){let s=await get();delete(s.finished||{})[ticket];await save(s);location="/register"}
function admin(){app.innerHTML='<header class="header"><div><div class="brand">장군봉 배드민턴 관리자</div><div class="sub">스마트 대기 관리 시스템</div></div><div><a href="/" style="color:#fff">고객 화면</a></div></header><div class="admin"><aside class="side"><h2>관리자 모드</h2><div class="nav on">코트 막기</div><div class="nav">시간 늘리기</div><div class="nav">팀 늘리기</div></aside><main class="main"><section class="panel"><h2>코트 막기</h2><div class="grid" id="cs"></div></section><section class="panel"><h2>게임 시간 설정</h2><div class="settings"><div class="setting">난타 <input id="g1" type="number" min="15" max="30">분</div><div class="setting">4인 복식 <input id="g2" type="number" min="15" max="30">분</div><div class="setting">2인 단식 <input id="g3" type="number" min="15" max="30">분</div></div></section><section class="panel"><h2>팀 늘리기</h2><input id="mx" type="number" min="1" max="20"> 팀</section><button class="save" onclick="saveAdmin()">저장</button><section class="panel"><h2>현재 대기 현황</h2><div class="grid" id="qq"></div></section></main></div>';sub(renderAdmin)}
function renderAdmin(s){g1.value=s.settings["난타"];g2.value=s.settings["4인 복식"];g3.value=s.settings["2인 단식"];mx.value=s.max_per_court;cs.innerHTML=s.courts.map(c=>'<div class="card"><h3>'+c.id+'번 코트</h3><p>'+(c.blocked?'접수 막힘':'접수 가능')+'</p><button class="smallbtn" onclick="block('+c.id+','+!c.blocked+')">'+(c.blocked?'운영':'막기')+'</button></div>').join('');qq.innerHTML=s.courts.map(c=>'<div class="card"><h3>'+c.id+'번 코트</h3>'+(c.active?'<p>이용 중: '+esc(c.active.nickname)+' <button class="smallbtn" onclick="force('+c.id+')">강제 퇴장</button></p>':'')+(c.queue||[]).map((x,i)=>'<p>'+String(i+1)+'. '+esc(x.nickname)+' / '+x.game+'</p>').join('')+'</div>').join('')}
async function saveAdmin(){let s=await get();s.settings["난타"]=Math.max(15,Math.min(30,+g1.value));s.settings["4인 복식"]=Math.max(15,Math.min(30,+g2.value));s.settings["2인 단식"]=Math.max(15,Math.min(30,+g3.value));s.max_per_court=Math.max(1,Math.min(20,+mx.value));await save(s)}
async function block(id,b){let s=await get();s.courts.find(c=>c.id===id).blocked=b;await save(s)}
async function force(id){let s=await get(),c=s.courts.find(c=>c.id===id);if(c.active){s.finished=s.finished||{};s.finished[c.active.ticket]={...c.active,endedAt:Date.now()};c.active=null}await advance(s);await save(s)}
(async()=>{await ensure();if(location.pathname==="/admin")admin();else if(location.pathname==="/register")register();else if(location.pathname==="/waiting")waiting();else customer()})();
</script></body></html>
